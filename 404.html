<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7">
<title>简读 · 精华导读</title>
<meta property="og:title" content="简读 · 把一本书读薄">
<meta property="og:description" content="提炼一本书的核心知识与原文精华，配上思考与辨析。通勤 8 分钟，读懂一本好书。">
<meta property="og:type" content="website">
<meta name="description" content="提炼一本书的核心知识与原文精华，配上思考与辨析。通勤 8 分钟，读懂一本好书。">
<style>
/* ================= 设计令牌 ================= */
:root{
  --paper:#FBFAF7; --surface:#FFFFFF; --sunken:#F4F1E9;
  --ink:#1B1A17; --ink2:#5A564E; --ink3:#8B8579;
  --line:#E7E2D6; --line-soft:#F1EDE3;
  --brand:#2E6E65; --brand-soft:#EAF2EF; --brand-tint:rgba(46,110,101,.08);
  --ok:#2C6650; --warn:#9A5A24;
  --sheet-shadow:0 -12px 40px rgba(27,26,23,.14);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --fs:16.5px; --lh:1.92;
}
[data-theme="sepia"]{
  --paper:#F6EFE1; --surface:#FBF6EA; --sunken:#EFE6D4;
  --ink:#231F19; --ink2:#5C5346; --ink3:#8A7F6C;
  --line:#E0D5BF; --line-soft:#EBE2D0;
  --brand:#2A5F58; --brand-soft:#E4EEE9;
}
[data-theme="dark"]{
  --paper:#131311; --surface:#1B1A18; --sunken:#201F1B;
  --ink:#E9E4D8; --ink2:#A9A39A; --ink3:#7C776E;
  --line:#2C2A26; --line-soft:#232220;
  --brand:#6FB5AA; --brand-soft:#1A2A27; --brand-tint:rgba(111,181,170,.14);
  --ok:#7FB39B; --warn:#D09A5C;
  --sheet-shadow:0 -12px 40px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--serif);
  line-height:var(--lh);min-height:100vh;transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--brand-tint)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

/* ================= 顶部 ================= */
.rbar{
  position:sticky;top:0;z-index:40;display:grid;grid-template-columns:44px 1fr 44px;
  align-items:center;height:48px;padding:0 8px;
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.rbar .ico{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;
  color:var(--ink2);border-radius:50%;transition:.18s}
.rbar .ico:active{background:var(--sunken)}
.rbar .chap{text-align:center;font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;
  color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
.rbar .brandmark{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.14em;
  text-align:center;color:var(--ink)}
.pbar{position:sticky;top:48px;z-index:40;height:1.5px;background:var(--line-soft)}
.pbar i{display:block;height:100%;width:0;background:var(--brand);transition:width .12s linear}

@media(min-width:760px){
  body{background:var(--paper)}
}

/* ================= 首页 ================= */
.shelf{max-width:640px;margin:0 auto;padding:22px 22px 96px}
.hero{padding:30px 0 0}
.hero .k{font-family:var(--sans);font-size:10px;letter-spacing:.3em;color:var(--brand);
  font-weight:600;margin-bottom:16px}
.hero h1{font-family:var(--serif);font-size:33px;font-weight:700;line-height:1.32;letter-spacing:.05em}
.hero .sub{font-size:14px;line-height:1.95;color:var(--ink2);margin-top:14px;max-width:30em}
.hero .stats{display:flex;margin-top:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hero .st{flex:1;padding:14px 4px;text-align:center}
.hero .st+.st{border-left:1px solid var(--line-soft)}
.hero .st b{display:block;font-family:var(--sans);font-size:16px;font-weight:700;
  color:var(--ink);font-feature-settings:"tnum";margin-bottom:4px}
.hero .st span{font-family:var(--sans);font-size:9.5px;letter-spacing:.18em;color:var(--ink3)}

.sec-label{display:flex;align-items:center;gap:10px;font-family:var(--sans);font-size:10.5px;
  letter-spacing:.24em;color:var(--ink3);margin:32px 0 4px}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line-soft)}

.feat{margin:14px 0 10px;border-radius:14px;overflow:hidden;cursor:pointer;
  box-shadow:0 10px 30px rgba(27,26,23,.13);animation:rise .55s both}
.feat .cv{position:relative;height:124px;padding:14px 16px;color:#fff;
  background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 52%,#0d2b27))}
.feat .cv .k{font-family:var(--sans);font-size:9.5px;letter-spacing:.26em;opacity:.82}
.feat .cv .zi{position:absolute;right:12px;top:0;font-family:var(--serif);font-size:86px;
  font-weight:700;opacity:.16;line-height:1;pointer-events:none}
.feat .cv h3{position:absolute;left:16px;right:96px;bottom:14px;font-family:var(--serif);
  font-size:17px;font-weight:700;line-height:1.55;text-shadow:0 1px 3px rgba(0,0,0,.22);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feat .bd{padding:14px 16px 16px;background:var(--surface)}
.feat .bd p{font-size:13px;line-height:1.78;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feat .bd .m{display:flex;align-items:center;gap:9px;margin-top:10px;
  font-family:var(--sans);font-size:10.5px;color:var(--ink3);letter-spacing:.04em}
.feat .bd .m i{width:2px;height:2px;border-radius:50%;background:var(--ink3);opacity:.55}
.feat .cta{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:10px 18px;
  border-radius:99px;background:var(--brand);color:#fff;font-family:var(--sans);
  font-size:12px;font-weight:600;letter-spacing:.08em;transition:.2s}
.feat:active .cta{transform:scale(.97)}
.feat .cv .prog{position:absolute;left:16px;right:16px;bottom:11px}
.feat .cv .prog span{display:block;font-family:var(--sans);font-size:10px;
  letter-spacing:.05em;color:rgba(255,255,255,.88);margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat .cv .prog .bar{position:absolute;left:-16px;right:-16px;bottom:-11px;height:3px;
  background:rgba(255,255,255,.24)}
.feat .cv .prog .bar i{display:block;height:100%;background:rgba(255,255,255,.95)}

.book{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:21px 0;
  border-bottom:1px solid var(--line-soft);cursor:pointer;animation:rise .55s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.book,.feat{animation:none}}
.book .no{font-family:var(--serif);font-size:23px;font-weight:700;color:var(--brand);
  line-height:1.2;min-width:1.35em;text-align:left}
.book:active .body h4{color:var(--brand)}
.book h4{font-size:19px;font-weight:600;line-height:1.5;letter-spacing:.01em;margin-bottom:7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:color .18s}
.book p{font-size:13.5px;line-height:1.78;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:11px;
  font-family:var(--sans);font-size:11px;color:var(--ink3);letter-spacing:.03em}
.book .meta i{width:2px;height:2px;border-radius:50%;background:var(--ink3);opacity:.55}
.book .meta .tag{color:var(--brand)}
.book .bprog{height:2.5px;border-radius:99px;background:var(--line-soft);margin-top:12px;overflow:hidden}
.book .bprog i{display:block;height:100%;border-radius:99px;background:var(--brand)}

.shelf-foot{margin-top:52px;text-align:center;font-family:var(--sans);font-size:10px;
  letter-spacing:.34em;color:var(--ink3)}
.shelf-foot::before{content:"";display:block;width:1px;height:26px;background:var(--line);
  margin:0 auto 16px}

.state{text-align:center;padding:56px 24px;color:var(--ink3)}
.state .big{font-family:var(--serif);font-size:17px;margin-bottom:10px;color:var(--ink2);letter-spacing:.06em}
.state .sm{font-family:var(--sans);font-size:12px;line-height:1.9}
.skel-card{padding:22px 0;border-bottom:1px solid var(--line-soft)}
.skel-line{height:14px;border-radius:3px;background:var(--line-soft);margin-bottom:10px;
  animation:pulse 1.4s ease-in-out infinite}
.skel-line.w60{width:60%}.skel-line.w90{width:90%}.skel-line.w40{width:40%}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ================= 阅读页 ================= */
.reader{max-width:640px;margin:0 auto;padding:0 0 120px}
.r-head{padding:24px 24px 0}
.r-head .kicker{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;color:var(--brand);
  font-weight:600;margin-bottom:13px}
.r-head h1{font-size:25px;font-weight:600;line-height:1.48;letter-spacing:.01em}
.r-head .sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:13px;
  font-family:var(--sans);font-size:11px;color:var(--ink3);letter-spacing:.04em}
.r-head .sub i{width:2px;height:2px;border-radius:50%;background:var(--ink3);opacity:.6}
.r-head .oneliner{font-size:15px;line-height:1.95;color:var(--ink2);margin-top:20px;
  padding-left:15px;border-left:2px solid var(--brand)}
.r-head .scope{font-family:var(--sans);font-size:11.5px;line-height:1.8;color:var(--ink3);
  margin-top:18px;padding-top:14px;border-top:1px dotted var(--line)}
.r-head .scope b{color:var(--brand);letter-spacing:.08em;margin-right:6px;font-weight:600}

.sec-h{margin:38px 24px 18px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline}
.sec-h .no{font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;color:var(--brand);
  font-weight:600;padding-top:5px;font-feature-settings:"tnum"}
.sec-h h2{font-size:18px;font-weight:600;letter-spacing:.02em;padding-bottom:10px;
  border-bottom:1px solid var(--line)}
.blk{padding:0 24px}
.blk p{font-size:var(--fs);line-height:var(--lh);color:var(--ink)}
.blk p+p{margin-top:14px}

/* 知识条目 */
.insight{display:grid;grid-template-columns:22px 1fr;gap:0 8px;margin-bottom:26px}
.insight .dot{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--brand);
  padding-top:5px;font-feature-settings:"tnum"}
.insight .lead{font-size:calc(var(--fs) + .5px);font-weight:600;line-height:1.7;margin-bottom:6px;letter-spacing:.01em}
.insight .txt{font-size:calc(var(--fs) - 1px);line-height:var(--lh);color:var(--ink2);white-space:pre-wrap}
.tldr{margin:6px 0 0 30px;padding:14px 16px;background:var(--sunken);border-radius:6px;
  font-size:calc(var(--fs) - 1.5px);line-height:1.88;color:var(--ink)}
.tldr b{font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;color:var(--brand);
  display:block;margin-bottom:6px}

/* 摘录 */
.quote{margin:0 24px 26px;padding-left:20px;border-left:2px solid var(--brand)}
.quote .mark{display:block;height:22px;font-size:48px;line-height:.62;color:var(--brand);opacity:.24}
.quote .qt{font-size:calc(var(--fs) + .5px);line-height:1.95;margin-top:8px;white-space:pre-wrap}
.quote .qs{display:flex;align-items:center;gap:7px;margin-top:14px;
  font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;color:var(--ink3)}
.quote .qs .rule{width:14px;height:1px;background:var(--ink3);opacity:.5}
.quote .qn{font-size:calc(var(--fs) - 2.5px);font-style:italic;line-height:1.85;color:var(--ink2);
  margin-top:10px;padding-top:10px;border-top:1px dotted var(--line)}

/* 辨析 */
.verdict{display:flex;flex-direction:column;gap:20px}
.vd .lab{display:flex;align-items:center;gap:7px;font-family:var(--sans);font-size:10.5px;
  letter-spacing:.12em;font-weight:600;margin-bottom:7px}
.vd .lab i{width:5px;height:5px;border-radius:1px;flex:0 0 5px}
.vd p,.vd li{font-size:calc(var(--fs) - 1.5px);line-height:var(--lh);color:var(--ink2)}
.vd ul{list-style:none}
.vd li{position:relative;padding-left:13px;margin-bottom:8px}
.vd li::before{content:"";position:absolute;left:0;top:.72em;width:4px;height:1px;background:var(--warn);opacity:.7}
.vd.ok .lab{color:var(--ok)}.vd.ok .lab i{background:var(--ok)}
.vd.doubt .lab{color:var(--warn)}.vd.doubt .lab i{background:var(--warn)}
.vd.how .lab{color:var(--brand)}.vd.how .lab i{background:var(--brand)}

/* 适合谁 */
.fitgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:400px){.fitgrid{grid-template-columns:1fr;gap:20px}}
.fitcol{padding-left:13px;border-left:2px solid var(--line)}
.fitcol.yes{border-color:var(--ok)}
.fitcol.no{border-color:var(--warn)}
.fitcol .h{font-family:var(--sans);font-size:10.5px;letter-spacing:.12em;font-weight:600;margin-bottom:7px}
.fitcol.yes .h{color:var(--ok)}.fitcol.no .h{color:var(--warn)}
.fitcol li{list-style:none;font-size:calc(var(--fs) - 2px);line-height:1.85;color:var(--ink2);margin-bottom:6px}

/* 带走什么 */
.takeaway{margin:0 24px;padding:22px 20px;background:var(--sunken);border-radius:12px}
.takeaway .h{font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;color:var(--brand);
  font-weight:600;margin-bottom:10px}
.takeaway p{font-size:var(--fs);line-height:var(--lh)}

/* 避坑 */
.pitfalls{list-style:none}
.pitfalls li{position:relative;padding-left:20px;font-size:calc(var(--fs) - 1px);line-height:var(--lh);
  color:var(--ink2);margin-bottom:14px}
.pitfalls li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;
  border:1.5px solid var(--warn);border-radius:1px;transform:rotate(45deg)}

.r-end{margin:40px 24px 0;padding-top:20px;border-top:1px solid var(--line);display:flex;
  justify-content:space-between;font-family:var(--sans);font-size:10.5px;color:var(--ink3);letter-spacing:.06em}

.todo-note{margin:0 24px;padding:14px 16px;background:var(--sunken);border-radius:8px;
  font-family:var(--sans);font-size:12px;line-height:1.8;color:var(--ink2)}
.todo-note b{color:var(--warn);font-weight:600}

/* ================= 抽屉 ================= */

.scrim{position:fixed;inset:0;background:rgba(20,19,16,.34);z-index:50;opacity:0;
  pointer-events:none;transition:opacity .26s;backdrop-filter:blur(1px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);
  border-radius:22px 22px 0 0;box-shadow:var(--sheet-shadow);border-top:1px solid var(--line);
  padding:10px 22px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  max-height:78vh;overflow-y:auto;max-width:640px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:9px;background:var(--ink3);opacity:.26;margin:0 auto 18px}
.sheet h4{font-size:15px;font-weight:600;letter-spacing:.02em;margin-bottom:14px;display:flex;
  justify-content:space-between;align-items:baseline}
.sheet h4 span{font-family:var(--sans);font-size:11px;color:var(--ink3);font-weight:400;letter-spacing:.04em}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;
  border-top:1px solid var(--line-soft)}
.row .k{font-family:var(--sans);font-size:12.5px;color:var(--ink2)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{width:40px;height:34px;border:0;background:none;color:var(--ink2);font-size:14px}
.stepper button:active{background:var(--sunken)}
.stepper span{min-width:46px;text-align:center;font-family:var(--sans);font-size:12px;
  color:var(--ink);font-feature-settings:"tnum"}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg b{font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--ink3);
  padding:6px 12px;border-radius:999px;cursor:pointer;transition:.18s}
.seg b.on{background:var(--ink);color:var(--paper)}
.acts{display:flex;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft)}
.acts button{flex:1;height:42px;border-radius:999px;border:1px solid var(--line);background:none;
  color:var(--ink2);font-family:var(--sans);font-size:12.5px}
.acts button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.toc{list-style:none;padding-top:2px}
.toc li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:baseline;
  padding:12px 0;border-top:1px solid var(--line-soft);cursor:pointer}
.toc .n{font-family:var(--sans);font-size:10.5px;color:var(--ink3);font-feature-settings:"tnum"}
.toc .t{font-size:14.5px}
.toc .pg{font-family:var(--sans);font-size:10.5px;color:var(--ink3)}
.toc li.on .t{color:var(--brand);font-weight:600}
.toc li.on .n{color:var(--brand)}

.setlab{font-family:var(--sans);font-size:10.5px;letter-spacing:.24em;color:var(--ink3);
  margin:22px 0 2px;border-top:1px solid var(--line);padding-top:16px}

.fin{margin:38px 0 0;display:flex;flex-direction:column;gap:10px}
.fin button{width:100%;height:48px;border-radius:999px;border:1px solid var(--brand);
  background:var(--brand);color:#fff;font-family:var(--sans);font-size:14px;font-weight:600;
  letter-spacing:.14em;cursor:pointer;transition:transform .18s,opacity .18s}
.fin button:active{transform:scale(.98);opacity:.9}
.fin button.ghost{background:none;color:var(--brand);font-weight:500;letter-spacing:.08em}

#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:999px;
  font-family:var(--sans);font-size:12.5px;opacity:0;pointer-events:none;transition:.28s;z-index:80;
  max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="rbar" id="rbar">
  <button class="ico" id="btn-back" aria-label="返回书架">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="chap" id="chapName"><span class="brandmark">简读</span></div>
  <button class="ico" id="btn-toc" aria-label="目录" style="display:none">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
</header>
<div class="pbar"><i id="pbar"></i></div>

<main id="app"></main>

<div class="scrim" id="scrim"></div>

<!-- 目录 + 阅读设置抽屉 -->
<section class="sheet" id="sheetToc" aria-label="目录与阅读设置">
  <div class="grab"></div>
  <h4>目录 <span id="tocHint"></span></h4>
  <ul class="toc" id="tocList"></ul>
  <div class="setlab">阅读设置</div>
  <div class="row">
    <span class="k">字号</span>
    <div class="stepper"><button id="fsDown" aria-label="减小字号">A−</button><span id="fsVal">16.5</span><button id="fsUp" aria-label="增大字号">A+</button></div>
  </div>
  <div class="row">
    <span class="k">行距</span>
    <div class="seg" id="segLh"><b data-lh="1.78">紧</b><b data-lh="1.92">标准</b><b data-lh="2.08">松</b></div>
  </div>

<script>window.__SY_STATIC__={"generatedAt":1793693129948,"list":[{"id":"dg_8","bookId":"bk_3","version":1,"engine":"import","publishedAt":1793674170480,"title":"活着","totalChars":98856,"chaptersCount":20,"oneLiner":"一个败光家产的少爷，用一生亲手埋葬了父母、妻子、儿女、女婿和外孙，最后与一头也叫福贵的老牛相依为命。余华写的不是苦难本身，而是一个人如何在苦难里保住讲述自己一生的平静。","tag":"精华导读 · 导入","digestChars":4282},{"id":"dg_7","bookId":"bk_2","version":1,"engine":"import","publishedAt":1793670572569,"title":"Theo of Golden","totalChars":623737,"chaptersCount":70,"oneLiner":"一位隐去姓名的葡萄牙老人在美国小镇住了一年，用一墙铅笔画像和一封封手写信，把一个个普通人「看见」——直到他为保护一个无家可归的女人而死于非命。一本关于匿名之善、慷慨与尊严的疗愈系小说。","tag":"精华导读 · 导入","digestChars":4000},{"id":"dg_6","bookId":"bk_1","version":6,"engine":"import","publishedAt":1793603902851,"title":"我就是你啊：走进他人内心的7项修炼","totalChars":102933,"chaptersCount":58,"oneLiner":"一本用\"蓝王国/红王国\"寓言讲沟通的方法论书，约 10 万字。故事好读，方法硬核——读完这篇导读约需 8 分钟，能带走一整套可上手的冲突化解术。","tag":"精华导读","digestChars":3085}],"details":{"dg_6":{"digest":{"schemaVersion":2,"tag":"精华导读","scope":"本导读的核心知识与原文摘录，仅基于实际细读的序言、第一关三种控情绪法、后记\"记忆锦囊\"（约 2 万字）；第二~七关仅据目录概述，未引原文。","oneLiner":"一本用\"蓝王国/红王国\"寓言讲沟通的方法论书，约 10 万字。故事好读，方法硬核——读完这篇导读约需 8 分钟，能带走一整套可上手的冲突化解术。","skeleton":["蓝红两国因一条新航线爆发冲突，蓝国王子奥姆奉命化解危机，却屡战屡败。","智者指点他踏上修行之路：七关修炼，每关学会一种\"走进他人内心\"的能力。","全书方法最后浓缩在后记\"记忆锦囊\"里——一套化解纷争的 6 步法（见下文核心知识）。","第一关是全部的根基：控制自己的情绪。学不会这关，后面六关全部免谈。"],"core":{"items":[{"lead":"① 三重山模型","body":"人与人的冲突，源于从\"我\"到\"你\"之间隔着三重大山——偏见、情绪、行为。想走进对方内心，得逐山翻越：先放下\"他就是针对我\"的偏见，再平息双方情绪，最后才谈得上改变行为互动。"},{"lead":"② 自他交换","body":"本书相比\"非暴力沟通\"更进一层的主张——不仅是一种沟通话术，更是一种内在视角：像看待自己一样看待对方，从超越偏见和情绪的高度，洞察对方行为背后的真实需求。"},{"lead":"③ 化解纷争 6 步法","body":"前提：全程避免解释、威胁、人身攻击——\"武力对抗\"只会适得其反。\n1. 平复自己的情绪：抑制攻击冲动（最难也最重要，只需几秒）\n2. 平复他人的情绪：对方炸毛时\"几乎什么也不要做\"，只回\"同意/好的/是的\"\n3. 理解他人，而非让他人被理解：问\"你为什么不同意？\"，倾听找共识\n4. 复述对方的话：\"我说得对吗？\"——让对方知道被理解，他才会闭嘴听你说\n5. 用并列词汇提自己的观点：\"就我而言/与此同时\"，不说\"没错，但是……\"\n6. 提出双赢方案：找不到就问对方；再不行就折中；连折中没有，至少留住关系"}],"tlDr":"前两步管情绪（自己的和对方的），中间两步管理解（先听懂、再证明你听懂了），最后两步管解决（并肩提观点、一起找方案）。顺序不能乱——90% 的冲突升级，都死在前两步。"},"quotes":[{"text":"在人类的认知天性中，从'我'到'你'，间隔着三重大山：偏见、情绪和行为。","src":"序言","note":"全书的理论地基，一句话。冲突的本质不是利益之争，而是三重认知屏障。"},{"text":"相比大家所熟知的'非暴力沟通'，本书更进一层，提出'自他交换'的概念。'自他交换'不仅是一种沟通方法，更是一种高维度的内在视角。","src":"序言","note":"帮你快速定位本书在沟通书谱系里的坐标——它是《非暴力沟通》的进阶版，主打视角切换而非话术。"},{"text":"情绪并不取决于您正在经历什么，而取决于您觉得自己经历了什么。","src":"第一关·方法一，全书最核心的一句","note":"情绪控制的总开关。让你生气的从来不是事件本身，而是你对事件的解读——这句话背后有一整个认知心理学的传统。"},{"text":"就像您可以用锤子钉钉子，也可以用它锤别人的脑袋。锤子还是那个锤子，用法却不同了。","src":"第一关·方法一，智者论情绪","note":"妙在反常识——情绪没有好坏，恐惧和愤怒是警示你的能量（故事里正是恐慌救了奥姆的命），要\"先听听再判断\"，而不是消除它。"},{"text":"当别人不同意我们的看法时，我们就会认为他想跟我们对着干……但其实（他是为自己考虑）。当有人威胁我们时，我们会认为他想让我们害怕，但其实，（是威胁者自己在害怕）。如果别人批评或者侮辱我们，我们会觉得他打算伤害我们……（其实他自己正在痛苦当中）。当别人表现出轻蔑时，我们总认为这代表他看不起我们……（其实他真正看不起的是自己）。","src":"第一关·方法一，引向冲突的四个误判","note":"方法一\"纠误判\"的具体清单，可直接对着用——下次被激怒时，逐条检查自己犯了哪个。"},{"text":"世上并没有坏人，只有受苦的人罢了。","src":"第一关·方法一，奥姆转述奶奶的话","note":"全书最柔软的一句，也是\"自他交换\"的民间版表达。攻击性强的人，多半自己正在痛。"},{"text":"尤其不要和对方说'你冷静点儿！'或者'你生气是没有用的！'……你可以用'同意''好的''是的''没错'等来回复对方……对方的情绪起初会有些波动，但随后便会逐渐稳定，直到最后慢慢平复。","src":"后记·记忆锦囊，第 2 步——全书最反直觉的招","note":"与直觉完全相反——对方发火时，一句\"你冷静点\"是火上浇油，而\"你说得对\"反而能让对方几秒内熄火。这是全书实操价值最高的一招。"},{"text":"之后问对方'我说得对吗？'。这样你会收获意想不到的神奇效果——对方会眉头上扬，露出满意的笑容，大赞一声'对啊！'。而后他便会闭上嘴，听你说话。","src":"后记·记忆锦囊，第 4 步复述","note":"复述的双重作用写得极诚实——既检验你是否真懂，又给足对方\"被理解\"的体验。人只有感到被理解后，才愿意听你说。"}],"thoughts":{"holds":"6 步法顺序设计有坚实的心理学逻辑——情绪不解决，讲道理无效；不理解对方，方案谈不拢。第 2 步的\"同意\"策略与认知失调理论暗合：对方攻击得不到对抗性回应，情绪自然回落。","doubts":["① \"同意/好的\"在权力严重不对等或对方恶意利用时，可能被解读为软弱退让，反而助长侵犯；","② 长期关系中若总是一方在\"自他交换\"，会造成单向透支——书里没细讲\"对方永远不肯翻山过来怎么办\"（此点基于细读范围的判断，后续章节可能有涉及）；","③ \"纠误判\"在盛怒当下最难执行——恰好最需要它的时刻，最用不出来。"],"howto":"不必七关全学。先只练两招——第 2 步的\"好的/同意\"（成本最低、见效最快）和摘录 5 的四误判清单（被激怒时逐条自查）。这两招练成习惯后，再回头看后面的关。","notes":[]},"fit":["经常陷于人际冲突（职场、家庭、客户）的人；读过《非暴力沟通》想进阶的人；喜欢寓言体、读不进理论书的人。"],"unfit":["想要学术论证与实证数据的人（本书是经验方法，不提供研究引用）；期待\"话术模板库\"的人（它给的是内在视角，不是台词）。"],"takeaway":"一套 6 步冲突化解流程 + 一个情绪自查清单 + 一句可贴在工位的反直觉口诀：对方炸毛时，别说\"你冷静点\"，说\"你说得对\"。 至少能改变一个行为：下次冲突升级前，先走第 1、2 步，再开口讲道理。","pitfalls":["别把\"自他交换\"理解成无原则退让——书的前提是对方也在这段关系里，恶意博弈场景需另行判断。","6 步法看着简单，第 1 步（平复自己）才是真功夫，跳过它直接背话术会显得虚伪，效果归零。","本书是寓言体，情节是方法的外壳；只看故事不读\"记忆锦囊\"，等于白读。"]},"book":{"title":"我就是你啊：走进他人内心的7项修炼","totalChars":102933,"chaptersCount":58,"sourceFile":"WoJiuShiNiA_ZouJinTaRen.epub"},"meta":{"version":6,"engine":"import","publishedAt":1793603902851}},"dg_7":{"digest":{"schemaVersion":2,"tag":"精华导读 · 导入","scope":"本导读的主线、身世与结局均基于实际细读的章节：序言、第 1、4、5、23、24、33、57 章全文，第 62 章开头与尾声（约 6 万词中的约 2.5 万词）；其余约 45 章仅据总目录与章首预览概述，未引原文。英文原著，摘录保留英文原文并附中文大意。","oneLiner":"一位隐去姓名的葡萄牙老人在美国小镇住了一年，用一墙铅笔画像和一封封手写信，把一个个普通人「看见」——直到他为保护一个无家可归的女人而死于非命。一本关于匿名之善、慷慨与尊严的疗愈系小说。","skeleton":["序言：Theo 在金色镇只住一年，「却足以形成一股自己的水流，把别人卷进去」。","第 1–3 章：神秘老人从纽约来到南方小镇 Golden，独居、漫步、匿名，对一切保持孩童式好奇。","第 4–5 章：第一封「奇怪的信」寄给会计师 Minnette——有人买下了她叔叔 Asher 画的她的肖像，要当面送她；律师丈夫将信将疑陪她赴约。","第 6–22 章：赠予（bestowal）成体系：每周从咖啡店 Chalice 的画像墙买画送人，手写信约人在喷泉见面；受赠者扩至流浪女 Ellen、清洁工 Kendrick 与病中的女儿 Lamisha。","第 23 章：名字之谜——「叫我 Theo 就好」，全镇放弃追问，选择凭果实判断人。","第 24 章：赠画加速至每周两三幅；给 Ellen 的信刻意用最简单的词写成。","第 33 章：身世闪回——1942 年葡萄牙杜罗河葡萄园的十岁男孩，里斯本美术馆之行被艺术「附魔」，人生从此分为里斯本前/后。","第 34–56 章：一年四季的友情网（大提琴手 Simone、街头乐手 Basil、小狗 Tony……），赠予持续，Simone 受伤的手奇迹痊愈。","第 57–59 章：深夜三个醉汉抢 Ellen 的帽子与自行车，Theo 下楼干预，被害身亡；消息震彻小镇。","第 60–62 章 + 尾声：知情人 Ponder 交付遗物与遗赠；凶手始终未查明；小镇的改变持续发酵——Minnette 给儿子取名 Theo。"],"core":{"items":[{"lead":"赠予的本质是「看见」","body":"Theo 送的从来不是画像本身——画家 Asher 画的是镇上真实的人，他买下画像送还本人，等于宣告「你值得被画下来、被记住」。对无名无姓的流浪女 Ellen、对大学清洁工 Kendrick，这份「被看见」比任何施舍都重。"},{"lead":"匿名行善是一套完整设计","body":"无姓、无邮箱、无实名信用卡（用 PH Ltd 的卡付款），一切经由律师 Ponder 代理。匿名不是故弄玄虚：它让受赠者无法还人情，礼物保持纯粹；也逼着小镇「凭果实判断人」。"},{"lead":"手写信是仪式的核心","body":"每次赠予都从一封钢笔手写、亚麻纸的信开始。给 Ellen 的信刻意用最短的句子、最简单的词——写信本身就是把对方当回事。"},{"lead":"慷慨需要被认真运营","body":"Theo 不是心血来潮：画像清单、约会日历（周二 Bob 七点）、助手 Gidley 送信、频率从每周一幅加速到两三幅。善意像项目一样被管理。"},{"lead":"艺术是「如何活」的答案","body":"第 33 章里斯本美术馆的顿悟——「音乐是声音的画像」。美构成了 Theo 一生的操作系统，他后来对大提琴手 Simone 的投入是同一件事的延续。"},{"lead":"「把生活过小，反而活得比谁都大」","body":"尾声引镇报记者 Katherine 的话作结：他选择 small，却 larger than life。一年、一个镇、每周几幅画——规模极小，穿透力极强。"},{"lead":"结局不给解药","body":"凶手未查明，真名未完全揭晓（Ponder 早已知道，书未和盘托出）。作者给的谜底不是「他是谁」，而是「他做了什么之后，小镇变成了什么样」。"}],"tlDr":"一个匿名老人用「买下你的画像送给你」这一件事，把一座小镇的人一个个点亮；善意不在于规模，而在于让对方确信自己值得被看见。"},"quotes":[{"text":"Only a year. Not so long. But long enough to create a current of his own and to catch others in it.","src":"序言","note":"全书题眼。中文大意：只有一年。不长，但足以形成一股自己的水流，把别人卷进去。一个人就是一股水流。"},{"text":"I'm sorry, dear fellow, but I have nothing to give you this morning. Perhaps tomorrow? And stop complaining. Be glad you're not in New York today.","src":"第 1 章","note":"对乞食小鸟说话，人物一页立住：认真对待每一个小生命，还有一点幽默。"},{"text":"Just think, we might actually meet a sincerely kind human being. There don't seem to be many of those around these days.","src":"第 5 章","note":"Minnette 决定赴约的理由，也是全书的时代注脚：真诚的善成了稀缺品。"},{"text":"The unspoken consensus of the neighborhood was that he would be judged by his fruits, by what could be seen with their own eyes. ... Or so they thought.","src":"第 23 章","note":"全镇对匿名者的信任逻辑——凭果实判断人。结尾的「Or so they thought（他们原以为是）」为结局埋下钩子。"},{"text":"I bought your portrait and would like you to have it. It is a gift. You do not have to pay anything for it or do anything in exchange. ... I am an old man. I will be wearing a green hat.","src":"第 24 章（致 Ellen 的信）","note":"刻意用最简单的词写给流浪女：无附加条件、不居高临下，把尊严还给对方。"},{"text":"His life, thereafter, was clearly delineated into Theo-before-Lisbon and Theo-after-Lisbon.","src":"第 33 章","note":"一次美术馆之行劈开一生。美对人的塑造力，是理解 Theo 全部行为的钥匙。"},{"text":"It was an acknowledgment, a tribute, to Theo's gift of sight. A eulogy.","src":"第 62 章","note":"对逝者最好的悼念，是他教会别人「怎么去看」。Asher 拿起放大镜端详蛋壳那一幕，是全书最安静的告别。"}],"thoughts":{"holds":"把赠予设计成「看见」在心理学上站得住：被看见（recognition）是比物质更稀缺的需求；Ellen 从受赠、遇袭到振作经营 featherwood 小生意，Kendrick 升职、Lamisha 长大想当康复师——尾声用一连串后续证实了这种善的复利。","doubts":["① 匿名善行的前提是极端财富与法律护航（Ponder 全权代理、私人飞机），普通人难以复制其形式——可复制的是心意而非排场；","② Theo 的动机只有身世碎片，神秘化略重，接近「圣人传记」的写法，人物有被神化之嫌；","③ 结尾暴力来得突然、凶手永不查明——是文学选择，但想要因果闭环的读者会卡在这里。"],"howto":"把「赠予」缩小到可操作：这周为身边某个不被注意的人做一件专属的、不要求回报的事——Theo 式的「买下那张画像送给你」。另一条是画家 Asher 的启示：把你的手艺变成看见他人的工具。","notes":[]},"fit":["喜欢《解忧杂货店》《一个人的朝圣》式温柔叙事的人","对「匿名之善」「被看见」主题感兴趣的人","想找一本语言平实、适合睡前安静读的英文小说的人"],"unfit":["想要强情节、快节奏的人","期待身世谜团有完整解答的人（谜底部分留白）","对挽歌语调、宗教意味敏感的人"],"takeaway":"记住一个动作：Theo 式的赠予 = 购买一份「专属的看见」，并无条件送出。合上书可做的一件事：本周为一个人手写一封信（或一条认真写的长消息），只送，不解释。","pitfalls":["别把它当「行善指南」读——书的力量在文学呈现，不在方法论；也别期待悬疑式谜底，作者要给的不是 Theo 是谁，而是他做了什么之后，小镇变成了什么样。"]},"book":{"title":"Theo of Golden","totalChars":623737,"chaptersCount":70,"sourceFile":"TheoOfGolden.epub"},"meta":{"version":1,"engine":"import","publishedAt":1793670572569}},"dg_8":{"digest":{"schemaVersion":2,"tag":"精华导读 · 导入","scope":"本导读基于全书细读：五篇自序（中文版、韩文版、日文版、英文版、麦田新版）与正文全部十节（约 8.8 万字）。所有摘录均出自实际读到原文的段落，并标注出处。","oneLiner":"一个败光家产的少爷，用一生亲手埋葬了父母、妻子、儿女、女婿和外孙，最后与一头也叫福贵的老牛相依为命。余华写的不是苦难本身，而是一个人如何在苦难里保住讲述自己一生的平静。","skeleton":["五篇自序：交代写作原点——美国民歌《老黑奴》，以及那句题眼「人是为活着本身而活着的」。","1992 年夏天，采风的「我」在乡间遇见老人福贵；他对着老牛把一家人的名字一个个喊出来，骗牛说还有别的牛在耕田。","少爷时代：吃喝嫖赌、骑妓女向丈人请安、打怀着孕跪地劝他回家的家珍，被龙二设局输光一百多亩地和房产。","父亲从村口粪缸上摔下而死；丈人抬着花轿接走家珍；福贵租龙二的五亩地学做农活，长根沦为乞丐。","被抓壮丁：进城请郎中途中被国军抓走，渡江后被围，老全中弹、春生失踪；被俘后领两个馒头、拿了盘缠回家，母亲已死，凤霞高烧后失语。","土改：龙二被枪毙，临刑喊「福贵，我是替你去死啊」；福贵分到五亩地，家珍带着有庆回来。","人民公社与大跃进：砸锅、食堂、煮钢铁、老孙头的屋子被烧；饥荒里家珍得软骨病，揣着一袋米从娘家回来。","有庆之死：为救县长女人献血被抽干，县长竟是当年的春生；福贵夜里把儿子埋在自己爹娘坟前，家珍终究猜到了。","凤霞出嫁：偏头二喜带着二十多人、一车彩礼风光迎娶；凤霞难产大出血而死，留下儿子苦根。","家珍之死 → 二喜被水泥板夹死 → 苦根吃豆子撑死；福贵买下待宰的老牛，也叫福贵，一人一牛活成了「两个老不死」。"],"core":{"items":[{"lead":"「活着」的力量是忍受，不是喊叫","body":"韩文版自序里余华把「活着」拆开给外国读者看：这个词在中国语言里的力量，不来自进攻也不来自呐喊，而来自忍受——忍受生命赋予的责任，忍受现实给的幸福与苦难、无聊与平庸。全书没有一句控诉，福贵的语调始终像在讲别人的农事，这种平静本身就是力量。"},{"lead":"生活是感受，幸存是看法","body":"日文版自序回答了意大利中学生的问题：为什么极端环境里还写「生活」而不是「幸存」？答案在叙述人称——福贵用第一人称讲述自己，不需要旁人的看法，只需要自己的感受。若换成第三人称，他就成了读者眼中的「苦难幸存者」。余华还交代了技术细节：最初用旁观者视角写，难以为继；改让福贵自己开口，写作一下畅通了。"},{"lead":"苦难不是重点，讲述的平静才是","body":"福贵讲女儿被送人时嘿嘿笑，讲自己挨爹的布鞋时得意，讲家珍「死得很好，死得平平安安、干干净净」。全文最大的反常不是死了多少人，而是叙述者提起这些时的温和与幽默——这才是这本书区别于「苦难展览」的地方。"},{"lead":"命运是偶然的，活下来的人只能领受","body":"输光家产本是灾祸，却让他躲过了枪毙（龙二替他去死）；被抓壮丁九死一生，回来反而分到了地。福贵摸着胳膊对自己说「这下可要好好活了」。书里没有因果报应，只有一连串偶然，人只能在偶然里决定怎么活。"},{"lead":"亲情是唯一没有被夺走的财产","body":"一百多亩地输光了，绸衣穿不惯，唯一留得住的是家珍那句「我也不想要什么福分，只求每年都能给你做一双新鞋」。凤霞被领走两次都跑回来，福贵背着她往回走时说「就是全家都饿死，也不送凤霞回去」——这是全书最硬的骨头。"},{"lead":"叫名字，是把死去的人留住","body":"开篇最动人的设计：福贵对牛喊「二喜、有庆不要偷懒，家珍、凤霞耕得好，苦根也行啊」，他骗牛说还有别的牛在耕田，其实是把五个死去的亲人一个个叫回田里。结尾他又对牛报账：今天谁耕了多少。记忆不是纪念碑，是每天下地时的一次点名。"},{"lead":"体面是苦难里唯一能自己决定的事","body":"家珍临终前拒绝麻袋包身（「麻袋上都是死结，我到了阴间解不开」），要一块干净布、要洗净身子；她把所有破烂衣服堆在床边拆缝，说「有活干心里踏实」。余华不给他们意义，只给他们体面——这已经是一个人能守住的全部。"},{"lead":"不争，是他活到最后的原因","body":"结尾福贵自述：龙二、春生都只风光了一阵，到头来命都丢了，「做人还是平常点好，争这个争那个，争来争去赔了自己的命」。这话不是成功学，是一个把亲人都送走的人对「活着」的最终理解：不争不是认输，是不再拿命去换。"}],"tlDr":"余华让一个失去全部亲人的人来讲自己的一生，从而证明：活着不需要外部的理由，也不需要旁人的同情——它只需要一个人还能平静地、甚至带点得意地把日子讲下去。"},"quotes":[{"text":"人是为活着本身而活着的，而不是为了活着之外的任何事物所活着。","src":"中文版自序（1993）","note":"全书的题眼。余华说这句话是「写作过程让我明白」的，不是预先设定的主题——先有福贵，后有这句话。"},{"text":"作为一个词语，「活着」在我们中国的语言里充满了力量，它的力量不是来自于喊叫，也不是来自于进攻，而是忍受，去忍受生命赋予我们的责任，去忍受现实给予我们的幸福和苦难、无聊和平庸。","src":"韩文版自序（1996）","note":"最准确的自我注解。注意「无聊和平庸」——他要忍的不只是惨，还有漫长的不精彩。"},{"text":"生活是一个人对自己经历的感受，而幸存往往是旁观者对别人经历的看法。","src":"日文版自序（2002）","note":"一句话说清叙述人称为何决定全书意义。读这本书时，你站在福贵的位置还是旁观者的位置，看到的是两本不同的书。"},{"text":"皇帝招我做女婿，路远迢迢我不去。","src":"正文开篇（福贵赶牛时唱的歌谣）","note":"全书第一个声音就是这句自鸣得意的拒绝。一个一无所有的老人，先给你唱一句「我不去当驸马」——气派与穷困的反差，就是福贵的底色。"},{"text":"我怕它知道只有自己在耕田，就多叫出几个名字去骗它，它听到还有别的牛也在耕田，就不会不高兴，耕田也就起劲啦。","src":"正文开篇（福贵解释为何对牛喊一串名字）","note":"全书最狠也最温柔的一笔：他骗的是牛，安放的是自己——那些名字全是死去的家人。"},{"text":"做人不能忘记四条，话不要说错，床不要睡错，门槛不要踏错，口袋不要摸错。","src":"正文·间奏（福贵对插秧女人说的话）","note":"浪子回头后的人生总结，全是消极戒律。他一生做错的第一条就是「床睡错」，所以这句听着像玩笑，其实是忏悔。"},{"text":"月光照在路上，像是撒满了盐。","src":"正文·有庆死后","note":"十三个字，写尽丧子之痛——不写哭，写路；盐既白又咸，落在伤口上。中国当代文学最著名的比喻之一。"},{"text":"家珍死得很好，死得平平安安、干干净净，死后一点是非都没留下，不像村里有些女人，死了还有人说闲话。","src":"正文·间奏（福贵对采风人说的话）","note":"用「很好」形容妻子的死，初读刺耳，再读才懂：在一个什么都被夺走的人生里，「死得干净」是他能替她守住的最后一件东西。"},{"text":"少年去游荡，中年想掘藏，老年做和尚。","src":"正文结尾（福贵远去的歌声）","note":"三句民谣收束一生：游荡、贪求、放下。福贵没有做和尚，他只是把一家人的名字都记着，一个人过完了余生。"}],"thoughts":{"holds":"「第一人称让苦难变成日子」这个判断站得住，因为余华在三个不同年份的自序里反复确认过同一条技术路径：最初用旁观者视角写作难以为继，改成福贵自述后「没有任何阻挡」。这不是事后美化，而是可交叉印证的创作事实。也正因如此，书里那些近乎欢快的细节（对牛报账、跟插秧女人开玩笑、给苦根讲鸡变牛）才不显得突兀——它们是叙述者的性格，不是作者硬加的温情。","doubts":["① 死亡密度过高：父母、妻子、儿子、女儿、女婿、外孙，七口人几乎全部非正常死亡，读到后半段读者容易从共情滑向麻木，苦难有被「清点」的风险。","② 「忍受」被抬得太高，容易被误读为对苦难的顺从甚至赞美。全书没有一次追问「谁该负责」——有庆之死明明是医疗事故与权力冷漠，文本却停在福贵的悲痛里，这是文学选择，也是思想上的回避。","③ 女性承担了全部沉默的付出：家珍逆来顺受到底，凤霞又聋又哑、死时连叫喊都不可能。她们的死推动情节，却几乎没有自己的视角——这一点在今天的阅读里值得警惕。"],"howto":"把「福贵视角」用在自己身上：挑一件你认定的倒霉事，先用旁观者口吻写 300 字（会写成控诉或抱怨），再换成当事人自述写 300 字（会出现细节、幽默、甚至得意）。两稿并排看，你会亲身验证余华那句「生活是感受，幸存是看法」——这也是把这本书从「读过」变成「用上」的最短路径。","notes":[]},"fit":["想读中国当代文学经典、能承受沉重题材的读者","写作者 / 内容创作者：想看清叙述人称如何改变一本书的意义","经历过丧失、想找一种平静讲述方式的人"],"unfit":["近期正处于丧亲、抑郁或情绪低谷的人（连续死亡描写可能造成二次伤害）","想找「励志」「正能量」解读的人——它不给安慰，只给承受","偏爱强情节、反转、多线叙事的读者"],"takeaway":"记住一句话：生活是属于每个人自己的感受，不属于任何别人的看法。合上书可做的一件事：找家里还健在的长辈，问一句「你这辈子最难的那一年是怎么过的」，把他的话录下来——这就是福贵对采风人做的事，也是这本书教人做的唯一一件具体的事。","pitfalls":["别把福贵当「苦难榜样」去歌颂忍受，那会把一本反抗遗忘的书读成劝人认命的书。","别把它读成「好死不如赖活着」的鸡汤：余华写的是一个人如何保住讲述自己一生的权利，不是教人放弃追问。","别跳过五篇自序——它们不是附属品，是作者亲手给出的解读钥匙，尤其日文版那篇直接决定了你怎么看整本书。"]},"book":{"title":"活着","totalChars":98856,"chaptersCount":20,"sourceFile":"Huozhe.epub"},"meta":{"version":1,"engine":"import","publishedAt":1793674170480}}},"markdown":{"dg_6":"# 《我就是你啊：走进他人内心的7项修炼》精华导读\n\n> **范围声明**：本导读的核心知识与原文摘录，仅基于实际细读的序言、第一关三种控情绪法、后记\"记忆锦囊\"（约 2 万字）；第二~七关仅据目录概述，未引原文。\n\n---\n\n## 一句话定位\n\n一本用\"蓝王国/红王国\"寓言讲沟通的方法论书，约 10 万字。故事好读，方法硬核——读完这篇导读约需 8 分钟，能带走一整套可上手的冲突化解术。\n\n## 这本书讲什么（结构骨架）\n\n1. 蓝红两国因一条新航线爆发冲突，蓝国王子奥姆奉命化解危机，却屡战屡败。\n2. 智者指点他踏上修行之路：七关修炼，每关学会一种\"走进他人内心\"的能力。\n3. 全书方法最后浓缩在后记\"记忆锦囊\"里——一套化解纷争的 6 步法（见下文核心知识）。\n4. 第一关是全部的根基：控制自己的情绪。学不会这关，后面六关全部免谈。\n\n## 核心知识（作者的精华）\n\n**① 三重山模型**：人与人的冲突，源于从\"我\"到\"你\"之间隔着三重大山——偏见、情绪、行为。想走进对方内心，得逐山翻越：先放下\"他就是针对我\"的偏见，再平息双方情绪，最后才谈得上改变行为互动。\n\n**② 自他交换**：本书相比\"非暴力沟通\"更进一层的主张——不仅是一种沟通话术，更是一种内在视角：像看待自己一样看待对方，从超越偏见和情绪的高度，洞察对方行为背后的真实需求。\n\n**③ 化解纷争 6 步法**：前提：全程避免解释、威胁、人身攻击——\"武力对抗\"只会适得其反。\n1. 平复自己的情绪：抑制攻击冲动（最难也最重要，只需几秒）\n2. 平复他人的情绪：对方炸毛时\"几乎什么也不要做\"，只回\"同意/好的/是的\"\n3. 理解他人，而非让他人被理解：问\"你为什么不同意？\"，倾听找共识\n4. 复述对方的话：\"我说得对吗？\"——让对方知道被理解，他才会闭嘴听你说\n5. 用并列词汇提自己的观点：\"就我而言/与此同时\"，不说\"没错，但是……\"\n6. 提出双赢方案：找不到就问对方；再不行就折中；连折中没有，至少留住关系\n\n**换句话说**：前两步管情绪（自己的和对方的），中间两步管理解（先听懂、再证明你听懂了），最后两步管解决（并肩提观点、一起找方案）。顺序不能乱——90% 的冲突升级，都死在前两步。\n\n## 原文精华摘录\n\n**摘录 1**（序言）：\n> 在人类的认知天性中，从'我'到'你'，间隔着三重大山：偏见、情绪和行为。\n\n*点评：全书的理论地基，一句话。冲突的本质不是利益之争，而是三重认知屏障。*\n\n**摘录 2**（序言）：\n> 相比大家所熟知的'非暴力沟通'，本书更进一层，提出'自他交换'的概念。'自他交换'不仅是一种沟通方法，更是一种高维度的内在视角。\n\n*点评：帮你快速定位本书在沟通书谱系里的坐标——它是《非暴力沟通》的进阶版，主打视角切换而非话术。*\n\n**摘录 3**（第一关·方法一，全书最核心的一句）：\n> 情绪并不取决于您正在经历什么，而取决于您觉得自己经历了什么。\n\n*点评：情绪控制的总开关。让你生气的从来不是事件本身，而是你对事件的解读——这句话背后有一整个认知心理学的传统。*\n\n**摘录 4**（第一关·方法一，智者论情绪）：\n> 就像您可以用锤子钉钉子，也可以用它锤别人的脑袋。锤子还是那个锤子，用法却不同了。\n\n*点评：妙在反常识——情绪没有好坏，恐惧和愤怒是警示你的能量（故事里正是恐慌救了奥姆的命），要\"先听听再判断\"，而不是消除它。*\n\n**摘录 5**（第一关·方法一，引向冲突的四个误判）：\n> 当别人不同意我们的看法时，我们就会认为他想跟我们对着干……但其实（他是为自己考虑）。当有人威胁我们时，我们会认为他想让我们害怕，但其实，（是威胁者自己在害怕）。如果别人批评或者侮辱我们，我们会觉得他打算伤害我们……（其实他自己正在痛苦当中）。当别人表现出轻蔑时，我们总认为这代表他看不起我们……（其实他真正看不起的是自己）。\n\n*点评：方法一\"纠误判\"的具体清单，可直接对着用——下次被激怒时，逐条检查自己犯了哪个。*\n\n**摘录 6**（第一关·方法一，奥姆转述奶奶的话）：\n> 世上并没有坏人，只有受苦的人罢了。\n\n*点评：全书最柔软的一句，也是\"自他交换\"的民间版表达。攻击性强的人，多半自己正在痛。*\n\n**摘录 7**（后记·记忆锦囊，第 2 步——全书最反直觉的招）：\n> 尤其不要和对方说'你冷静点儿！'或者'你生气是没有用的！'……你可以用'同意''好的''是的''没错'等来回复对方……对方的情绪起初会有些波动，但随后便会逐渐稳定，直到最后慢慢平复。\n\n*点评：与直觉完全相反——对方发火时，一句\"你冷静点\"是火上浇油，而\"你说得对\"反而能让对方几秒内熄火。这是全书实操价值最高的一招。*\n\n**摘录 8**（后记·记忆锦囊，第 4 步复述）：\n> 之后问对方'我说得对吗？'。这样你会收获意想不到的神奇效果——对方会眉头上扬，露出满意的笑容，大赞一声'对啊！'。而后他便会闭上嘴，听你说话。\n\n*点评：复述的双重作用写得极诚实——既检验你是否真懂，又给足对方\"被理解\"的体验。人只有感到被理解后，才愿意听你说。*\n\n## 思考与辨析\n\n- **成立之处**：6 步法顺序设计有坚实的心理学逻辑——情绪不解决，讲道理无效；不理解对方，方案谈不拢。第 2 步的\"同意\"策略与认知失调理论暗合：对方攻击得不到对抗性回应，情绪自然回落。\n- **存疑之处**：① \"同意/好的\"在权力严重不对等或对方恶意利用时，可能被解读为软弱退让，反而助长侵犯； ② 长期关系中若总是一方在\"自他交换\"，会造成单向透支——书里没细讲\"对方永远不肯翻山过来怎么办\"（此点基于细读范围的判断，后续章节可能有涉及）； ③ \"纠误判\"在盛怒当下最难执行——恰好最需要它的时刻，最用不出来。\n- **怎么落地**：不必七关全学。先只练两招——第 2 步的\"好的/同意\"（成本最低、见效最快）和摘录 5 的四误判清单（被激怒时逐条自查）。这两招练成习惯后，再回头看后面的关。\n\n## 适合谁读 / 不适合谁\n\n- **适合**：经常陷于人际冲突（职场、家庭、客户）的人；读过《非暴力沟通》想进阶的人；喜欢寓言体、读不进理论书的人。\n- **不适合**：想要学术论证与实证数据的人（本书是经验方法，不提供研究引用）；期待\"话术模板库\"的人（它给的是内在视角，不是台词）。\n\n## 读完能带走什么\n\n一套 6 步冲突化解流程 + 一个情绪自查清单 + 一句可贴在工位的反直觉口诀：对方炸毛时，别说\"你冷静点\"，说\"你说得对\"。 至少能改变一个行为：下次冲突升级前，先走第 1、2 步，再开口讲道理。\n\n## 避坑\n\n- 别把\"自他交换\"理解成无原则退让——书的前提是对方也在这段关系里，恶意博弈场景需另行判断。\n- 6 步法看着简单，第 1 步（平复自己）才是真功夫，跳过它直接背话术会显得虚伪，效果归零。\n- 本书是寓言体，情节是方法的外壳；只看故事不读\"记忆锦囊\"，等于白读。\n","dg_7":"# 《Theo of Golden》精华导读\n\n> **范围声明**：本导读的主线、身世与结局均基于实际细读的章节：序言、第 1、4、5、23、24、33、57 章全文，第 62 章开头与尾声（约 6 万词中的约 2.5 万词）；其余约 45 章仅据总目录与章首预览概述，未引原文。英文原著，摘录保留英文原文并附中文大意。\n\n---\n\n## 一句话定位\n\n一位隐去姓名的葡萄牙老人在美国小镇住了一年，用一墙铅笔画像和一封封手写信，把一个个普通人「看见」——直到他为保护一个无家可归的女人而死于非命。一本关于匿名之善、慷慨与尊严的疗愈系小说。\n\n## 这本书讲什么（结构骨架）\n\n1. 序言：Theo 在金色镇只住一年，「却足以形成一股自己的水流，把别人卷进去」。\n2. 第 1–3 章：神秘老人从纽约来到南方小镇 Golden，独居、漫步、匿名，对一切保持孩童式好奇。\n3. 第 4–5 章：第一封「奇怪的信」寄给会计师 Minnette——有人买下了她叔叔 Asher 画的她的肖像，要当面送她；律师丈夫将信将疑陪她赴约。\n4. 第 6–22 章：赠予（bestowal）成体系：每周从咖啡店 Chalice 的画像墙买画送人，手写信约人在喷泉见面；受赠者扩至流浪女 Ellen、清洁工 Kendrick 与病中的女儿 Lamisha。\n5. 第 23 章：名字之谜——「叫我 Theo 就好」，全镇放弃追问，选择凭果实判断人。\n6. 第 24 章：赠画加速至每周两三幅；给 Ellen 的信刻意用最简单的词写成。\n7. 第 33 章：身世闪回——1942 年葡萄牙杜罗河葡萄园的十岁男孩，里斯本美术馆之行被艺术「附魔」，人生从此分为里斯本前/后。\n8. 第 34–56 章：一年四季的友情网（大提琴手 Simone、街头乐手 Basil、小狗 Tony……），赠予持续，Simone 受伤的手奇迹痊愈。\n9. 第 57–59 章：深夜三个醉汉抢 Ellen 的帽子与自行车，Theo 下楼干预，被害身亡；消息震彻小镇。\n10. 第 60–62 章 + 尾声：知情人 Ponder 交付遗物与遗赠；凶手始终未查明；小镇的改变持续发酵——Minnette 给儿子取名 Theo。\n\n## 核心知识（作者的精华）\n\n**赠予的本质是「看见」**：Theo 送的从来不是画像本身——画家 Asher 画的是镇上真实的人，他买下画像送还本人，等于宣告「你值得被画下来、被记住」。对无名无姓的流浪女 Ellen、对大学清洁工 Kendrick，这份「被看见」比任何施舍都重。\n\n**匿名行善是一套完整设计**：无姓、无邮箱、无实名信用卡（用 PH Ltd 的卡付款），一切经由律师 Ponder 代理。匿名不是故弄玄虚：它让受赠者无法还人情，礼物保持纯粹；也逼着小镇「凭果实判断人」。\n\n**手写信是仪式的核心**：每次赠予都从一封钢笔手写、亚麻纸的信开始。给 Ellen 的信刻意用最短的句子、最简单的词——写信本身就是把对方当回事。\n\n**慷慨需要被认真运营**：Theo 不是心血来潮：画像清单、约会日历（周二 Bob 七点）、助手 Gidley 送信、频率从每周一幅加速到两三幅。善意像项目一样被管理。\n\n**艺术是「如何活」的答案**：第 33 章里斯本美术馆的顿悟——「音乐是声音的画像」。美构成了 Theo 一生的操作系统，他后来对大提琴手 Simone 的投入是同一件事的延续。\n\n**「把生活过小，反而活得比谁都大」**：尾声引镇报记者 Katherine 的话作结：他选择 small，却 larger than life。一年、一个镇、每周几幅画——规模极小，穿透力极强。\n\n**结局不给解药**：凶手未查明，真名未完全揭晓（Ponder 早已知道，书未和盘托出）。作者给的谜底不是「他是谁」，而是「他做了什么之后，小镇变成了什么样」。\n\n**换句话说**：一个匿名老人用「买下你的画像送给你」这一件事，把一座小镇的人一个个点亮；善意不在于规模，而在于让对方确信自己值得被看见。\n\n## 原文精华摘录\n\n**摘录 1**（序言）：\n> Only a year. Not so long. But long enough to create a current of his own and to catch others in it.\n\n*点评：全书题眼。中文大意：只有一年。不长，但足以形成一股自己的水流，把别人卷进去。一个人就是一股水流。*\n\n**摘录 2**（第 1 章）：\n> I'm sorry, dear fellow, but I have nothing to give you this morning. Perhaps tomorrow? And stop complaining. Be glad you're not in New York today.\n\n*点评：对乞食小鸟说话，人物一页立住：认真对待每一个小生命，还有一点幽默。*\n\n**摘录 3**（第 5 章）：\n> Just think, we might actually meet a sincerely kind human being. There don't seem to be many of those around these days.\n\n*点评：Minnette 决定赴约的理由，也是全书的时代注脚：真诚的善成了稀缺品。*\n\n**摘录 4**（第 23 章）：\n> The unspoken consensus of the neighborhood was that he would be judged by his fruits, by what could be seen with their own eyes. ... Or so they thought.\n\n*点评：全镇对匿名者的信任逻辑——凭果实判断人。结尾的「Or so they thought（他们原以为是）」为结局埋下钩子。*\n\n**摘录 5**（第 24 章（致 Ellen 的信））：\n> I bought your portrait and would like you to have it. It is a gift. You do not have to pay anything for it or do anything in exchange. ... I am an old man. I will be wearing a green hat.\n\n*点评：刻意用最简单的词写给流浪女：无附加条件、不居高临下，把尊严还给对方。*\n\n**摘录 6**（第 33 章）：\n> His life, thereafter, was clearly delineated into Theo-before-Lisbon and Theo-after-Lisbon.\n\n*点评：一次美术馆之行劈开一生。美对人的塑造力，是理解 Theo 全部行为的钥匙。*\n\n**摘录 7**（第 62 章）：\n> It was an acknowledgment, a tribute, to Theo's gift of sight. A eulogy.\n\n*点评：对逝者最好的悼念，是他教会别人「怎么去看」。Asher 拿起放大镜端详蛋壳那一幕，是全书最安静的告别。*\n\n## 思考与辨析\n\n- **成立之处**：把赠予设计成「看见」在心理学上站得住：被看见（recognition）是比物质更稀缺的需求；Ellen 从受赠、遇袭到振作经营 featherwood 小生意，Kendrick 升职、Lamisha 长大想当康复师——尾声用一连串后续证实了这种善的复利。\n- **存疑之处**：① 匿名善行的前提是极端财富与法律护航（Ponder 全权代理、私人飞机），普通人难以复制其形式——可复制的是心意而非排场； ② Theo 的动机只有身世碎片，神秘化略重，接近「圣人传记」的写法，人物有被神化之嫌； ③ 结尾暴力来得突然、凶手永不查明——是文学选择，但想要因果闭环的读者会卡在这里。\n- **怎么落地**：把「赠予」缩小到可操作：这周为身边某个不被注意的人做一件专属的、不要求回报的事——Theo 式的「买下那张画像送给你」。另一条是画家 Asher 的启示：把你的手艺变成看见他人的工具。\n\n## 适合谁读 / 不适合谁\n\n- **适合**：喜欢《解忧杂货店》《一个人的朝圣》式温柔叙事的人；对「匿名之善」「被看见」主题感兴趣的人；想找一本语言平实、适合睡前安静读的英文小说的人\n- **不适合**：想要强情节、快节奏的人；期待身世谜团有完整解答的人（谜底部分留白）；对挽歌语调、宗教意味敏感的人\n\n## 读完能带走什么\n\n记住一个动作：Theo 式的赠予 = 购买一份「专属的看见」，并无条件送出。合上书可做的一件事：本周为一个人手写一封信（或一条认真写的长消息），只送，不解释。\n\n## 避坑\n\n- 别把它当「行善指南」读——书的力量在文学呈现，不在方法论；也别期待悬疑式谜底，作者要给的不是 Theo 是谁，而是他做了什么之后，小镇变成了什么样。\n","dg_8":"# 《活着》精华导读\n\n> **范围声明**：本导读基于全书细读：五篇自序（中文版、韩文版、日文版、英文版、麦田新版）与正文全部十节（约 8.8 万字）。所有摘录均出自实际读到原文的段落，并标注出处。\n\n---\n\n## 一句话定位\n\n一个败光家产的少爷，用一生亲手埋葬了父母、妻子、儿女、女婿和外孙，最后与一头也叫福贵的老牛相依为命。余华写的不是苦难本身，而是一个人如何在苦难里保住讲述自己一生的平静。\n\n## 这本书讲什么（结构骨架）\n\n1. 五篇自序：交代写作原点——美国民歌《老黑奴》，以及那句题眼「人是为活着本身而活着的」。\n2. 1992 年夏天，采风的「我」在乡间遇见老人福贵；他对着老牛把一家人的名字一个个喊出来，骗牛说还有别的牛在耕田。\n3. 少爷时代：吃喝嫖赌、骑妓女向丈人请安、打怀着孕跪地劝他回家的家珍，被龙二设局输光一百多亩地和房产。\n4. 父亲从村口粪缸上摔下而死；丈人抬着花轿接走家珍；福贵租龙二的五亩地学做农活，长根沦为乞丐。\n5. 被抓壮丁：进城请郎中途中被国军抓走，渡江后被围，老全中弹、春生失踪；被俘后领两个馒头、拿了盘缠回家，母亲已死，凤霞高烧后失语。\n6. 土改：龙二被枪毙，临刑喊「福贵，我是替你去死啊」；福贵分到五亩地，家珍带着有庆回来。\n7. 人民公社与大跃进：砸锅、食堂、煮钢铁、老孙头的屋子被烧；饥荒里家珍得软骨病，揣着一袋米从娘家回来。\n8. 有庆之死：为救县长女人献血被抽干，县长竟是当年的春生；福贵夜里把儿子埋在自己爹娘坟前，家珍终究猜到了。\n9. 凤霞出嫁：偏头二喜带着二十多人、一车彩礼风光迎娶；凤霞难产大出血而死，留下儿子苦根。\n10. 家珍之死 → 二喜被水泥板夹死 → 苦根吃豆子撑死；福贵买下待宰的老牛，也叫福贵，一人一牛活成了「两个老不死」。\n\n## 核心知识（作者的精华）\n\n**「活着」的力量是忍受，不是喊叫**：韩文版自序里余华把「活着」拆开给外国读者看：这个词在中国语言里的力量，不来自进攻也不来自呐喊，而来自忍受——忍受生命赋予的责任，忍受现实给的幸福与苦难、无聊与平庸。全书没有一句控诉，福贵的语调始终像在讲别人的农事，这种平静本身就是力量。\n\n**生活是感受，幸存是看法**：日文版自序回答了意大利中学生的问题：为什么极端环境里还写「生活」而不是「幸存」？答案在叙述人称——福贵用第一人称讲述自己，不需要旁人的看法，只需要自己的感受。若换成第三人称，他就成了读者眼中的「苦难幸存者」。余华还交代了技术细节：最初用旁观者视角写，难以为继；改让福贵自己开口，写作一下畅通了。\n\n**苦难不是重点，讲述的平静才是**：福贵讲女儿被送人时嘿嘿笑，讲自己挨爹的布鞋时得意，讲家珍「死得很好，死得平平安安、干干净净」。全文最大的反常不是死了多少人，而是叙述者提起这些时的温和与幽默——这才是这本书区别于「苦难展览」的地方。\n\n**命运是偶然的，活下来的人只能领受**：输光家产本是灾祸，却让他躲过了枪毙（龙二替他去死）；被抓壮丁九死一生，回来反而分到了地。福贵摸着胳膊对自己说「这下可要好好活了」。书里没有因果报应，只有一连串偶然，人只能在偶然里决定怎么活。\n\n**亲情是唯一没有被夺走的财产**：一百多亩地输光了，绸衣穿不惯，唯一留得住的是家珍那句「我也不想要什么福分，只求每年都能给你做一双新鞋」。凤霞被领走两次都跑回来，福贵背着她往回走时说「就是全家都饿死，也不送凤霞回去」——这是全书最硬的骨头。\n\n**叫名字，是把死去的人留住**：开篇最动人的设计：福贵对牛喊「二喜、有庆不要偷懒，家珍、凤霞耕得好，苦根也行啊」，他骗牛说还有别的牛在耕田，其实是把五个死去的亲人一个个叫回田里。结尾他又对牛报账：今天谁耕了多少。记忆不是纪念碑，是每天下地时的一次点名。\n\n**体面是苦难里唯一能自己决定的事**：家珍临终前拒绝麻袋包身（「麻袋上都是死结，我到了阴间解不开」），要一块干净布、要洗净身子；她把所有破烂衣服堆在床边拆缝，说「有活干心里踏实」。余华不给他们意义，只给他们体面——这已经是一个人能守住的全部。\n\n**不争，是他活到最后的原因**：结尾福贵自述：龙二、春生都只风光了一阵，到头来命都丢了，「做人还是平常点好，争这个争那个，争来争去赔了自己的命」。这话不是成功学，是一个把亲人都送走的人对「活着」的最终理解：不争不是认输，是不再拿命去换。\n\n**换句话说**：余华让一个失去全部亲人的人来讲自己的一生，从而证明：活着不需要外部的理由，也不需要旁人的同情——它只需要一个人还能平静地、甚至带点得意地把日子讲下去。\n\n## 原文精华摘录\n\n**摘录 1**（中文版自序（1993））：\n> 人是为活着本身而活着的，而不是为了活着之外的任何事物所活着。\n\n*点评：全书的题眼。余华说这句话是「写作过程让我明白」的，不是预先设定的主题——先有福贵，后有这句话。*\n\n**摘录 2**（韩文版自序（1996））：\n> 作为一个词语，「活着」在我们中国的语言里充满了力量，它的力量不是来自于喊叫，也不是来自于进攻，而是忍受，去忍受生命赋予我们的责任，去忍受现实给予我们的幸福和苦难、无聊和平庸。\n\n*点评：最准确的自我注解。注意「无聊和平庸」——他要忍的不只是惨，还有漫长的不精彩。*\n\n**摘录 3**（日文版自序（2002））：\n> 生活是一个人对自己经历的感受，而幸存往往是旁观者对别人经历的看法。\n\n*点评：一句话说清叙述人称为何决定全书意义。读这本书时，你站在福贵的位置还是旁观者的位置，看到的是两本不同的书。*\n\n**摘录 4**（正文开篇（福贵赶牛时唱的歌谣））：\n> 皇帝招我做女婿，路远迢迢我不去。\n\n*点评：全书第一个声音就是这句自鸣得意的拒绝。一个一无所有的老人，先给你唱一句「我不去当驸马」——气派与穷困的反差，就是福贵的底色。*\n\n**摘录 5**（正文开篇（福贵解释为何对牛喊一串名字））：\n> 我怕它知道只有自己在耕田，就多叫出几个名字去骗它，它听到还有别的牛也在耕田，就不会不高兴，耕田也就起劲啦。\n\n*点评：全书最狠也最温柔的一笔：他骗的是牛，安放的是自己——那些名字全是死去的家人。*\n\n**摘录 6**（正文·间奏（福贵对插秧女人说的话））：\n> 做人不能忘记四条，话不要说错，床不要睡错，门槛不要踏错，口袋不要摸错。\n\n*点评：浪子回头后的人生总结，全是消极戒律。他一生做错的第一条就是「床睡错」，所以这句听着像玩笑，其实是忏悔。*\n\n**摘录 7**（正文·有庆死后）：\n> 月光照在路上，像是撒满了盐。\n\n*点评：十三个字，写尽丧子之痛——不写哭，写路；盐既白又咸，落在伤口上。中国当代文学最著名的比喻之一。*\n\n**摘录 8**（正文·间奏（福贵对采风人说的话））：\n> 家珍死得很好，死得平平安安、干干净净，死后一点是非都没留下，不像村里有些女人，死了还有人说闲话。\n\n*点评：用「很好」形容妻子的死，初读刺耳，再读才懂：在一个什么都被夺走的人生里，「死得干净」是他能替她守住的最后一件东西。*\n\n**摘录 9**（正文结尾（福贵远去的歌声））：\n> 少年去游荡，中年想掘藏，老年做和尚。\n\n*点评：三句民谣收束一生：游荡、贪求、放下。福贵没有做和尚，他只是把一家人的名字都记着，一个人过完了余生。*\n\n## 思考与辨析\n\n- **成立之处**：「第一人称让苦难变成日子」这个判断站得住，因为余华在三个不同年份的自序里反复确认过同一条技术路径：最初用旁观者视角写作难以为继，改成福贵自述后「没有任何阻挡」。这不是事后美化，而是可交叉印证的创作事实。也正因如此，书里那些近乎欢快的细节（对牛报账、跟插秧女人开玩笑、给苦根讲鸡变牛）才不显得突兀——它们是叙述者的性格，不是作者硬加的温情。\n- **存疑之处**：① 死亡密度过高：父母、妻子、儿子、女儿、女婿、外孙，七口人几乎全部非正常死亡，读到后半段读者容易从共情滑向麻木，苦难有被「清点」的风险。 ② 「忍受」被抬得太高，容易被误读为对苦难的顺从甚至赞美。全书没有一次追问「谁该负责」——有庆之死明明是医疗事故与权力冷漠，文本却停在福贵的悲痛里，这是文学选择，也是思想上的回避。 ③ 女性承担了全部沉默的付出：家珍逆来顺受到底，凤霞又聋又哑、死时连叫喊都不可能。她们的死推动情节，却几乎没有自己的视角——这一点在今天的阅读里值得警惕。\n- **怎么落地**：把「福贵视角」用在自己身上：挑一件你认定的倒霉事，先用旁观者口吻写 300 字（会写成控诉或抱怨），再换成当事人自述写 300 字（会出现细节、幽默、甚至得意）。两稿并排看，你会亲身验证余华那句「生活是感受，幸存是看法」——这也是把这本书从「读过」变成「用上」的最短路径。\n\n## 适合谁读 / 不适合谁\n\n- **适合**：想读中国当代文学经典、能承受沉重题材的读者；写作者 / 内容创作者：想看清叙述人称如何改变一本书的意义；经历过丧失、想找一种平静讲述方式的人\n- **不适合**：近期正处于丧亲、抑郁或情绪低谷的人（连续死亡描写可能造成二次伤害）；想找「励志」「正能量」解读的人——它不给安慰，只给承受；偏爱强情节、反转、多线叙事的读者\n\n## 读完能带走什么\n\n记住一句话：生活是属于每个人自己的感受，不属于任何别人的看法。合上书可做的一件事：找家里还健在的长辈，问一句「你这辈子最难的那一年是怎么过的」，把他的话录下来——这就是福贵对采风人做的事，也是这本书教人做的唯一一件具体的事。\n\n## 避坑\n\n- 别把福贵当「苦难榜样」去歌颂忍受，那会把一本反抗遗忘的书读成劝人认命的书。\n- 别把它读成「好死不如赖活着」的鸡汤：余华写的是一个人如何保住讲述自己一生的权利，不是教人放弃追问。\n- 别跳过五篇自序——它们不是附属品，是作者亲手给出的解读钥匙，尤其日文版那篇直接决定了你怎么看整本书。\n"}};</script>
<script>
/* 静态站垫片：把阅读页的 /api/* 请求接到内嵌数据上，页面代码零改动 */
(function () {
  const D = window.__SY_STATIC__;
  const json = o => Promise.resolve(new Response(JSON.stringify(o), { status: 200, headers: { 'Content-Type': 'application/json' } }));
  const text = t => Promise.resolve(new Response(t, { status: 200, headers: { 'Content-Type': 'text/markdown; charset=utf-8' } }));
  const orig = window.fetch;
  window.fetch = function (url) {
    const u = String(url);
    let m;
    if (u === '/api/digests') return json({ digests: D.list });
    if ((m = u.match(/^\/api\/digests\/([^/]+)\/markdown$/))) return text(D.markdown[decodeURIComponent(m[1])] || '');
    if ((m = u.match(/^\/api\/digests\/([^/]+)$/))) {
      const d = D.details[decodeURIComponent(m[1])];
      return d ? json(d) : Promise.resolve(new Response('{"error":"not found"}', { status: 404 }));
    }
    return orig.apply(this, arguments);
  };
  /* 导出按钮：静态模式下点击直接下载 markdown */
  addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('btn-md');
    if (!btn) return;
    btn.onclick = () => {
      const m = (location.hash || '').match(/^#\/d\/(.+)$/);
      if (!m) return;
      const id = decodeURIComponent(m[1]);
      const md = D.markdown[id];
      if (!md) return;
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '精华导读-' + id + '.md';
      a.click();
      URL.revokeObjectURL(a.href);
      const t = document.getElementById('toast');
      if (t) { t.textContent = '已导出 Markdown'; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
    };
  });
})();
</script>

  fs:+(localStorage.getItem('sy-fs')||16.5),
  lh:+(localStorage.getItem('sy-lh')||1.92),
  theme:localStorage.getItem('sy-theme')||'light',
};
function applyPrefs(){
  document.documentElement.style.setProperty('--fs',prefs.fs+'px');
  document.documentElement.style.setProperty('--lh',prefs.lh);
  document.documentElement.setAttribute('data-theme',prefs.theme);
  const m={light:'#FBFAF7',sepia:'#F6EFE1',dark:'#131311'}[prefs.theme];
  document.querySelector('meta[name=theme-color]').setAttribute('content',m);
  $('#fsVal').textContent=prefs.fs;
  $('#segLh').querySelectorAll('b').forEach(b=>b.classList.toggle('on',+b.dataset.lh===prefs.lh));
  $('#segTheme').querySelectorAll('b').forEach(b=>b.classList.toggle('on',b.dataset.theme===prefs.theme));
}
function savePrefs(){localStorage.setItem('sy-fs',prefs.fs);localStorage.setItem('sy-lh',prefs.lh);
  localStorage.setItem('sy-theme',prefs.theme);applyPrefs()}
$('#fsUp').onclick=()=>{prefs.fs=Math.min(22,prefs.fs+1);savePrefs()};
$('#fsDown').onclick=()=>{prefs.fs=Math.max(14,prefs.fs-1);savePrefs()};
$('#segLh').onclick=e=>{const b=e.target.closest('b');if(!b)return;prefs.lh=+b.dataset.lh;savePrefs()};
$('#segTheme').onclick=e=>{const b=e.target.closest('b');if(!b)return;prefs.theme=b.dataset.theme;savePrefs()};

/* ---------------- 抽屉 ---------------- */
function openSheet(which){
  closeSheets();
  $('#scrim').classList.add('on');
  $(which).classList.add('on');
  document.body.style.overflow='hidden';
}
function closeSheets(){
  $('#scrim').classList.remove('on');
  $('#sheetToc').classList.remove('on');
  document.body.style.overflow='';
}
$('#scrim').onclick=closeSheets;
$('#btn-toc').onclick=()=>{buildToc();openSheet('#sheetToc')};
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheets()});

/* ---------------- 路由 ---------------- */
function route(){
  const h=location.hash||'#/';
  const m=h.match(/^#\/d\/(.+)$/);
  closeSheets();
  if(m) showDigest(m[1]); else showShelf();
}
addEventListener('hashchange',route);

/* ---------------- 首页 ---------------- */
const cnNum=n=>{const d='零壹贰叁肆伍陆柒捌玖';
  if(n<=10)return n===10?'拾':d[n];
  if(n<20)return '拾'+d[n%10];
  if(n<100){const t=Math.floor(n/10),u=n%10;return d[t]+'拾'+(u?d[u]:'')}
  return String(n)};
const firstZi=t=>esc((t||'书').replace(/^《|》$/g,'').trim()[0]||'书');

async function showShelf(){
  document.title='简读 · 精华导读';
  current=null; sections=[];   // 清掉阅读页残留，防止滚动回调覆写顶栏
  $('#btn-back').style.visibility='hidden';
  $('#btn-toc').style.display='none';
  $('#chapName').innerHTML='<span class="brandmark">简读</span>';
  $('#pbar').style.width='0%';
  window.scrollTo(0,0);
  app.innerHTML=`<div class="shelf"><div class="skel-card">
      <div class="skel-line w60"></div><div class="skel-line w90"></div><div class="skel-line w40"></div>
    </div><div class="skel-card"><div class="skel-line w40"></div><div class="skel-line w90"></div></div></div>`;
  try{
    const r=await fetch('/api/digests');
    const {digests}=await r.json();
    // Hero（空架也显示）
    const hero=(iss)=>`<div class="hero">
      <div class="k">JIAN DU · 电子书精华导读</div>
      <h1>把一本书读薄</h1>
      <div class="sub">提炼一本书的核心知识与原文精华，配上思考与辨析。<br>通勤路上 8 分钟，读懂一本好书。</div>
      ${iss?`<div class="stats">
        <div class="st"><b>${digests.length}</b><span>篇导读</span></div>
        <div class="st"><b>${wn(digests.reduce((a,d)=>a+(d.totalChars||0),0))}</b><span>原文总字数</span></div>
        <div class="st"><b>${(()=>{const ms=digests.map(d=>minutesOf(d.digestChars));const lo=Math.min(...ms),hi=Math.max(...ms);return lo===hi?lo:lo+'–'+hi})()}</b><span>分钟 · 单篇</span></div>
      </div>`:''}
    </div>`;
    if(!digests.length){
      app.innerHTML=`<div class="shelf">${hero(false)}
        <div class="state">
          <div class="big">导读还没上架</div>
          <div class="sm">管理员在 /admin 上传书籍并发布导读后<br>会出现在这里</div>
        </div>
        <div class="shelf-foot">简读 · 把一本书读薄</div></div>`;
      return;
    }
    // 阅读进度（以位置为准）：1<p<99 视为在读；>=99 读完不再展示
    const progOf=bookId=>{
      const p=Math.round((+(localStorage.getItem('sy-prog-'+bookId)||0))*100);
      if(p<=1||p>=99) return null;
      const sIdx=+(localStorage.getItem('sy-sec-'+bookId)||0);
      const sTot=+(localStorage.getItem('sy-sect-'+bookId)||0);
      const sName=localStorage.getItem('sy-secname-'+bookId)||'';
      const nn=String(sIdx+1).padStart(2,'0');
      const remain=Math.max(0,sTot-sIdx-1);
      let cap;
      if(p>=97) cap='已接近尾声 · 马上读完';
      else if(sName&&sTot>1) cap=`上次读到 ${nn} · ${esc(sName)} · 还剩 ${remain} 段`;
      else cap=`已读 ${p}%`;
      return {p,cap};
    };
    const finishedOf=bookId=>(+(localStorage.getItem('sy-prog-'+bookId)||0))>=0.99;
    const f=digests[0];
    const fp=progOf(f.id);
    app.innerHTML=`<div class="shelf">
      ${hero(true)}
      <div class="sec-label">本期精选</div>
      <div class="feat" style="animation-delay:80ms" onclick="location.hash='#/d/${f.id}'">
        <div class="cv">
          <div class="k">本期精选 · 壹</div>
          <div class="zi">${firstZi(f.title)}</div>
          <h3 style="${fp?'bottom:36px':''}">${esc(f.title)}</h3>
          ${fp?`<div class="prog"><span>${fp.cap}</span><div class="bar"><i style="width:${fp.p}%"></i></div></div>`:''}
        </div>
        <div class="bd">
          <p>${esc(f.oneLiner||'暂无一句话定位')}</p>
          <div class="m"><span>精华导读</span><i></i><span>${wn(f.totalChars||0)} 字</span><i></i><span>${minutesOf(f.digestChars)} 分钟</span></div>
          <div class="cta">${fp?'继续阅读 →':(finishedOf(f.id)?'重新阅读 →':'开始阅读 →')}</div>
        </div>
      </div>
      <div class="sec-label">全部导读</div>
      ${digests.map((d,i)=>{
        const bp=progOf(d.id);
        return `
        <div class="book" style="animation-delay:${Math.min(i*70+140,700)}ms" onclick="location.hash='#/d/${d.id}'">
          <div class="no">${cnNum(i+1)}</div>
          <div class="body">
            <h4>${esc(d.title)}</h4>
            <p>${esc(d.oneLiner||'暂无一句话定位')}</p>
            <div class="meta">
              <span class="tag">${esc(d.tag||'精华导读')}</span><i></i>
              <span>${wn(d.totalChars||0)} 字</span><i></i>
              <span>${minutesOf(d.digestChars)} 分钟</span>
              ${bp?`<i></i><span>已读 ${bp.p}%</span>`:''}
            </div>
            ${bp?`<div class="bprog"><i style="width:${bp.p}%"></i></div>`:''}
          </div>
        </div>`}).join('')}
      <div class="shelf-foot">简读 · 把一本书读薄</div>
    </div>`;
  }catch(e){
    app.innerHTML=`<div class="shelf"><div class="state">
      <div class="big">加载失败</div><div class="sm">请检查网络后重试</div></div></div>`;
  }
}

/* ---------------- 阅读页 ---------------- */
function sec(title,html,id){
  if(!html) return '';
  secNo+=1;
  return `<section class="sec" data-sec="${id}">
    <div class="sec-h"><div class="no">${String(secNo).padStart(2,'0')}</div><h2>${title}</h2></div>
    ${html}</section>`;
}

async function showDigest(id){
  $('#btn-toc').style.display='';
  $('#btn-back').style.visibility='';
  $('#chapName').textContent='加载中';
  sections=[]; secNo=0;
  app.innerHTML=`<div class="reader"><div class="r-head">
    <div class="skel-line w40"></div><div class="skel-line w90"></div><div class="skel-line w60"></div>
  </div></div>`;
  try{
    const r=await fetch('/api/digests/'+id);
    if(!r.ok){
      app.innerHTML=`<div class="state"><div class="big">导读不存在或未发布</div>
        <div class="sm"><a href="#/" style="color:var(--brand)">← 返回书架</a></div></div>`;
      return;
    }
    const {digest:d,book,meta}=await r.json();
    current={digest:d,book,meta,id};
    document.title=`${book.title} · 简读精华导读`;
    localStorage.setItem('sy-last',id);

    const ck=(d.core&&d.core.items)||[];
    const tlDr=(d.core&&d.core.tlDr)||'';
    const th=d.thoughts||{};
    const doubts=th.doubts||[];
    const notes=th.notes||[];
    const todo=`<div class="todo-note"><b>本段尚未生成。</b>当前是未接入模型的框架稿——在管理台配置模型，或导入 AI 稿后即可补全。</div>`;

    let body='';

    // 01 一句话定位
    if(d.oneLiner) body+=sec('一句话定位',`<div class="blk"><p>${esc(d.oneLiner)}</p></div>`,'定位');

    // 02 这本书讲什么
    if((d.skeleton||[]).length){
      body+=sec('这本书讲什么',
        `<div class="blk">${d.skeleton.map((s,i)=>`
          <div class="insight"><div class="dot">${String(i+1).padStart(2,'0')}</div>
          <div><div class="txt">${esc(s)}</div></div></div>`).join('')}</div>`,'讲什么');
    }

    // 03 核心知识
    body+=sec('核心知识',
      `<div class="blk">
        ${ck.length?ck.map((it,i)=>`
          <div class="insight"><div class="dot">${String(i+1).padStart(2,'0')}</div>
          <div>${it.lead?`<div class="lead">${esc(it.lead)}</div>`:''}
          ${it.body?`<div class="txt">${esc(it.body)}</div>`:''}</div></div>`).join(''):todo}
        ${tlDr?`<div class="tldr"><b>换句话说</b>${esc(tlDr)}</div>`:''}
      </div>`,'核心知识');

    // 04 原文摘录
    if((d.quotes||[]).length){
      body+=sec('原文摘录',
        d.quotes.map(q=>`
          <blockquote class="quote">
            <span class="mark">“</span>
            <div class="qt">${esc(q.text)}</div>
            <div class="qs"><span class="rule"></span>${esc(q.src||'原文')}</div>
            ${q.note?`<div class="qn">${esc(q.note)}</div>`:''}
          </blockquote>`).join(''),'摘录');
    }

    // 05 思考与辨析
    if(th.holds||doubts.length||th.howto||notes.length){
      body+=sec('思考与辨析',
        `<div class="blk"><div class="verdict">
          ${th.holds?`<div class="vd ok"><div class="lab"><i></i>成立</div><p>${esc(th.holds)}</p></div>`:''}
          ${doubts.length?`<div class="vd doubt"><div class="lab"><i></i>存疑</div>
            <ul>${doubts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
          ${th.howto?`<div class="vd how"><div class="lab"><i></i>怎么用</div><p>${esc(th.howto)}</p></div>`:''}
          ${notes.length?`<div class="vd"><p>${notes.map(esc).join('<br>')}</p></div>`:''}
        </div></div>`,'辨析');
    }

    // 06 适合谁
    if((d.fit||[]).length||(d.unfit||[]).length){
      body+=sec('适合谁',
        `<div class="blk"><div class="fitgrid">
          <div class="fitcol yes"><div class="h">适合</div>
            <ul>${(d.fit||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>—</li>'}</ul></div>
          <div class="fitcol no"><div class="h">不适合</div>
            <ul>${(d.unfit||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>—</li>'}</ul></div>
        </div></div>`,'适合谁');
    }

    // 07 带走什么
    if(d.takeaway){
      body+=sec('带走什么',
        `<div class="takeaway"><div class="h">TAKEAWAY</div><p>${esc(d.takeaway)}</p></div>`,'带走什么');
    }

    // 08 避坑
    if((d.pitfalls||[]).length){
      body+=sec('避坑',
        `<div class="blk"><ul class="pitfalls">${d.pitfalls.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`,'避坑');
    }

    app.innerHTML=`<article class="reader">
      <div class="r-head">
        <div class="kicker">${esc(d.tag||'精华导读')}</div>
        <h1>${esc(book.title)}</h1>
        <div class="sub"><span>${wn(book.totalChars||0)} 字</span><i></i>
          <span>${book.chaptersCount||'—'} 节</span><i></i><span>读完约 ${minutesOf(JSON.stringify(d).length)} 分钟</span></div>
        ${d.oneLiner?`<p class="oneliner">${esc(d.oneLiner)}</p>`:''}
        ${d.scope?`<p class="scope"><b>范围声明</b>${esc(d.scope)}</p>`:''}
      </div>
      ${body}
      <div class="fin">
        <button id="btn-fin">已读完 · 回到书架</button>
        <button id="btn-share" class="ghost">分享这篇导读</button>
      </div>
      <div class="r-end"><span>简读 · 精华导读 v${meta.version}</span><span id="pctEnd">0%</span></div>
    </article>`;

    $('#btn-fin').onclick=()=>{
      localStorage.setItem('sy-prog-'+id,'1');
      localStorage.removeItem('sy-pos-'+id);
      toast('已读完');
      setTimeout(()=>{location.hash='#/'},650);
    };

    $('#btn-share').onclick=async()=>{
      const u=location.origin+location.pathname.replace(/index\.html$/,'')+'d/'+id+'/';
      const t=`《${current.book.title}》精华导读 · 简读`;
      const x=current.digest.oneLiner||'把一本书读薄，通勤 8 分钟读懂一本好书';
      if(navigator.share){
        try{await navigator.share({title:t,text:x,url:u});return}
        catch(e){if(e&&e.name==='AbortError')return}
      }
      const clip=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t+'\n'+x+'\n'+u):null;
      if(clip) clip.then(()=>toast('分享文案已复制，去粘贴给朋友'),()=>toast('复制失败，请手动复制'));
      else toast('当前浏览器不支持分享');
    };

    sections=[...app.querySelectorAll('[data-sec]')];

    // 阅读位置恢复
    const pos=+(localStorage.getItem('sy-pos-'+id)||0);
    if(pos>200){requestAnimationFrame(()=>window.scrollTo(0,pos));toast('已恢复上次阅读位置')}
    else window.scrollTo(0,0);
    updateScroll(true);
  }catch(e){
    app.innerHTML=`<div class="state"><div class="big">加载失败</div>
      <div class="sm">请检查网络后重试</div></div>`;
  }
}

/* ---------------- 滚动：进度 / 章节名 / 位置记忆 ---------------- */
function updateScroll(force){
  const h=document.documentElement;
  const max=h.scrollHeight-h.clientHeight;
  const p=max>0?Math.min(1,h.scrollTop/max):0;
  $('#pbar').style.width=(p*100).toFixed(1)+'%';
  const pe=$('#pctEnd'); if(pe) pe.textContent=Math.round(p*100)+'%';

  if(!current || !sections.length) return;
  const y=h.scrollTop+80;
  let idx=0;
  sections.forEach((s,i)=>{ if(s.offsetTop<=y) idx=i; });
  const name=sections[idx].querySelector('h2').textContent;
  $('#chapName').textContent=`${String(idx+1).padStart(2,'0')} · ${name}`;
  $('#tocList').querySelectorAll('li').forEach((li,i)=>li.classList.toggle('on',i===idx));

  if(!force){
    localStorage.setItem('sy-pos-'+current.id,Math.round(h.scrollTop));
    localStorage.setItem('sy-prog-'+current.id,p.toFixed(3));
    localStorage.setItem('sy-sec-'+current.id,String(idx));
    localStorage.setItem('sy-sect-'+current.id,String(sections.length));
    localStorage.setItem('sy-secname-'+current.id,name);
  }
}
let ticking=false;
addEventListener('scroll',()=>{
  if(ticking)return;
  ticking=true;
  requestAnimationFrame(()=>{updateScroll();ticking=false});
},{passive:true});

/* ---------------- 目录 ---------------- */
function buildToc(){
  if(!current) return;
  const pct=Math.round((+(localStorage.getItem('sy-prog-'+current.id)||0))*100);
  $('#tocHint').textContent=`共 ${sections.length} 段 · 已读 ${pct}%`;
  $('#tocList').innerHTML=sections.map((s,i)=>`
    <li data-i="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span>
    <span class="t">${esc(s.querySelector('h2').textContent)}</span>
    <span class="pg">${i===sections.length-1?'结尾':''}</span></li>`).join('');
  $('#tocList').querySelectorAll('li').forEach(li=>{
    li.onclick=()=>{
      const s=sections[+li.dataset.i];
      closeSheets();
      setTimeout(()=>window.scrollTo({top:s.offsetTop-56,behavior:'smooth'}),120);
    };
  });
  updateScroll(true);   // 立即同步当前段高亮
}

/* ---------------- 顶部操作 ---------------- */
$('#btn-back').onclick=()=>location.hash='#/';

function doExport(btn){
  if(!current){toast('请先打开一篇导读');return}
  if(btn.dataset.mode==='copy'){
    fetch('/api/digests/'+current.id+'/markdown').then(r=>r.text()).then(t=>{
      navigator.clipboard?.writeText(t).then(()=>toast('Markdown 已复制'),()=>toast('复制失败，请用「导出文件」'));
    });
    return;
  }
  location.href='/api/digests/'+current.id+'/markdown';
  toast('正在导出 Markdown');
}
$('#btn-md').dataset.mode='copy';
$('#btn-md').onclick=e=>doExport(e.currentTarget);
$('#btn-dl').onclick=e=>doExport(e.currentTarget);

/* 初始化 */
applyPrefs();
route();
</script>
</body>
</html>
