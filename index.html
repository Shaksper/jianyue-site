<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>书语 · 精华导读阅读</title>
<style>
:root{
  --bg:#f7f3ea; --card:#fffdf8; --ink:#2c2a26; --ink2:#6b675e; --ink3:#9a948a;
  --accent:#8b5a2b; --accent2:#b07b3f; --line:#e8e0d0; --quote-bg:#f2ecdd;
  --chip:#efe7d5; --ok:#4a7c59; --warn:#a35d2b;
}
[data-theme="dark"]{
  --bg:#17171a; --card:#202024; --ink:#e6e2d8; --ink2:#a8a49a; --ink3:#6e6a62;
  --accent:#d0a05c; --accent2:#c08a4a; --line:#33333a; --quote-bg:#26262c;
  --chip:#2c2c33; --ok:#7db894; --warn:#d0a05c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Noto Serif SC","Source Han Serif SC","STSong",serif;
  background:var(--bg); color:var(--ink); line-height:1.9;
  transition:background .3s,color .3s; min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 90px}
header{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.hd{max-width:640px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:10px}
.hd h1{font-size:17px;font-weight:700;letter-spacing:1px;flex:1}
.hd .logo{font-size:20px}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--ink2);
  width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* 书架 */
.shelf-title{padding:26px 4px 14px;font-size:13px;letter-spacing:2px;color:var(--accent);font-weight:700}
.shelf-empty{text-align:center;padding:80px 20px;color:var(--ink3);font-size:14px}
.shelf-empty .big{font-size:40px;margin-bottom:10px}
.book-card{
  display:flex;gap:14px;align-items:center;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;
  cursor:pointer;transition:transform .15s;
}
.book-card:active{transform:scale(.98)}
.book-card .cover{
  width:52px;height:70px;border-radius:6px;flex-shrink:0;
  background:linear-gradient(160deg,var(--accent),var(--accent2));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:11px;line-height:1.4;text-align:center;padding:4px;overflow:hidden;
  font-family:inherit;
}
.book-card .info{flex:1;min-width:0}
.book-card .bt{font-size:16px;font-weight:700;margin-bottom:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.book-card .bd{font-size:12px;color:var(--ink2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book-card .meta{font-size:11px;color:var(--ink3);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.badge{background:var(--chip);color:var(--accent);font-size:10.5px;padding:2px 8px;border-radius:10px}

/* 阅读页 */
.reader-card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:26px 22px;margin-bottom:18px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.book-head{text-align:center;padding:34px 16px 26px}
.book-head .tag{display:inline-block;background:var(--chip);color:var(--accent);
  font-size:11.5px;padding:3px 12px;border-radius:20px;letter-spacing:1px;margin-bottom:14px}
.book-head h2{font-size:24px;line-height:1.5;margin-bottom:10px;letter-spacing:1px}
.book-head .meta{font-size:12.5px;color:var(--ink3)}
.sec{margin-top:30px}
.sec-title{font-size:13px;color:var(--accent);letter-spacing:2px;font-weight:700;
  display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.sec p{font-size:var(--fs,16px);color:var(--ink);margin-bottom:10px;text-align:justify}
.skeleton-list{list-style:none}
.skeleton-list li{font-size:var(--fs,16px);margin:10px 0;padding-left:20px;position:relative;text-align:justify}
.skeleton-list li::before{content:"·";position:absolute;left:4px;color:var(--accent2);font-weight:700}
.quote{background:var(--quote-bg);border-left:3px solid var(--accent2);
  border-radius:0 12px 12px 0;padding:16px 16px 12px;margin:16px 0}
.quote .q-text{font-size:var(--fs,16px);color:var(--ink);text-align:justify}
.quote .q-src{font-size:11.5px;color:var(--ink3);margin-top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.dual>div{background:var(--quote-bg);border-radius:12px;padding:12px 14px;font-size:13px}
.dual .h{font-size:11.5px;letter-spacing:1px;margin-bottom:4px;font-weight:700}
.dual .fit .h{color:var(--ok)} .dual .unfit .h{color:var(--warn)}
.takeaway{background:var(--quote-bg);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:10px}
.takeaway .h{font-size:12px;letter-spacing:2px;color:var(--accent);margin-bottom:8px;font-weight:700}
.takeaway p{font-size:var(--fs,16px)}
.pitfall{list-style:none}
.pitfall li{font-size:var(--fs,16px);margin:10px 0;padding-left:22px;position:relative;text-align:justify}
.pitfall li::before{content:"⚠";position:absolute;left:0;font-size:13px;top:3px}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:13px;
  padding:14px 0 4px;cursor:pointer;text-decoration:none}
.loading{text-align:center;padding:100px 20px;color:var(--ink3);font-size:14px}

/* 范围声明 */
.scope-note{background:var(--quote-bg);border:1px dashed var(--line);border-radius:12px;
  padding:12px 14px;font-size:12.5px;color:var(--ink2);line-height:1.75;margin-top:6px}
.scope-note b{color:var(--accent);letter-spacing:1px}

/* 核心知识条目 */
.ck{margin:0 0 18px}
.ck-lead{font-size:calc(var(--fs,16px) - 1px);font-weight:700;color:var(--accent);
  margin-bottom:6px;letter-spacing:.5px}
.ck-body{font-size:var(--fs,16px);color:var(--ink);text-align:justify;white-space:pre-wrap}
.tldr{background:var(--quote-bg);border-radius:12px;padding:14px 16px;margin-top:16px;
  font-size:calc(var(--fs,16px) - 1px);color:var(--ink);line-height:1.85}
.tldr b{color:var(--accent2)}

/* 摘录 */
.quote .q-no{font-size:11px;color:var(--accent);letter-spacing:1.5px;font-weight:700;margin-bottom:8px}
.quote .q-note{font-size:calc(var(--fs,16px) - 2px);color:var(--ink2);margin-top:12px;
  padding-top:10px;border-top:1px dashed var(--line);font-style:italic;line-height:1.8}
.quote .q-text{white-space:pre-wrap}

/* 辨析 */
.think-block{margin-bottom:16px}
.think-block .h{font-size:12px;letter-spacing:1.5px;font-weight:700;color:var(--accent);margin-bottom:6px}
.think-block.doubt .h{color:var(--warn)}
.think-block p{font-size:var(--fs,16px);text-align:justify}
.think-list{list-style:none}
.think-list li{font-size:calc(var(--fs,16px) - 1px);margin:8px 0;padding-left:20px;
  position:relative;text-align:justify;color:var(--ink)}
.think-list li::before{content:"？";position:absolute;left:0;color:var(--warn);font-weight:700;font-size:12px}

/* 待补占位 */
.todo-note{background:var(--quote-bg);border-radius:10px;padding:14px 16px;
  font-size:13px;color:var(--ink2);line-height:1.8}
.todo-note b{color:var(--warn)}

/* 结构骨架（有序） */
.skel{margin:0 0 0 22px}
.skel li{font-size:var(--fs,16px);margin:12px 0;padding-left:2px;text-align:justify}
.skel li::marker{color:var(--accent2);font-weight:700}

/* 工具条 */
.toolbar{position:fixed;bottom:0;left:0;right:0;z-index:60;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line)}
.tb{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.tb .spacer{flex:1}
.tb button{border:1px solid var(--line);background:var(--card);color:var(--ink2);
  padding:9px 16px;border-radius:20px;font-size:13px;cursor:pointer;font-family:inherit}
.tb button:active{transform:scale(.95)}
#fs-val{font-size:11px;color:var(--ink3);min-width:34px;text-align:center}
.progress-bar{position:fixed;top:0;left:0;height:2.5px;background:var(--accent);z-index:100;width:0;transition:width .1s}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:24px;
  font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:200;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

  <div class="hd">

  </div>
</div>

，我们会觉得他打算伤害我们……（其实他自己正在痛苦当中）。当别人表现出轻蔑时，我们总认为这代表他看不起我们……（其实他真正看不起的是自己）。","src":"第一关·方法一，引向冲突的四个误判","note":"方法一\"纠误判\"的具体清单，可直接对着用——下次被激怒时，逐条检查自己犯了哪个。"},{"text":"世上并没有坏人，只有受苦的人罢了。","src":"第一关·方法一，奥姆转述奶奶的话","note":"全书最柔软的一句，也是\"自他交换\"的民间版表达。攻击性强的人，多半自己正在痛。"},{"text":"尤其不要和对方说'你冷静点儿！'或者'你生气是没有用的！'……你可以用'同意''好的''是的''没错'等来回复对方……对方的情绪起初会有些波动，但随后便会逐渐稳定，直到最后慢慢平复。","src":"后记·记忆锦囊，第 2 步——全书最反直觉的招","note":"与直觉完全相反——对方发火时，一句\"你冷静点\"是火上浇油，而\"你说得对\"反而能让对方几秒内熄火。这是全书实操价值最高的一招。"},{"text":"之后问对方'我说得对吗？'。这样你会收获意想不到的神奇效果——对方会眉头上扬，露出满意的笑容，大赞一声'对啊！'。而后他便会闭上嘴，听你说话。","src":"后记·记忆锦囊，第 4 步复述","note":"复述的双重作用写得极诚实——既检验你是否真懂，又给足对方\"被理解\"的体验。人只有感到被理解后，才愿意听你说。"}],"thoughts":{"holds":"6 步法顺序设计有坚实的心理学逻辑——情绪不解决，讲道理无效；不理解对方，方案谈不拢。第 2 步的\"同意\"策略与认知失调理论暗合：对方攻击得不到对抗性回应，情绪自然回落。","doubts":["① \"同意/好的\"在权力严重不对等或对方恶意利用时，可能被解读为软弱退让，反而助长侵犯；","② 长期关系中若总是一方在\"自他交换\"，会造成单向透支——书里没细讲\"对方永远不肯翻山过来怎么办\"（此点基于细读范围的判断，后续章节可能有涉及）；","③ \"纠误判\"在盛怒当下最难执行——恰好最需要它的时刻，最用不出来。"],"howto":"不必七关全学。先只练两招——第 2 步的\"好的/同意\"（成本最低、见效最快）和摘录 5 的四误判清单（被激怒时逐条自查）。这两招练成习惯后，再回头看后面的关。","notes":[]},"fit":["经常陷于人际冲突（职场、家庭、客户）的人；读过《非暴力沟通》想进阶的人；喜欢寓言体、读不进理论书的人。"],"unfit":["想要学术论证与实证数据的人（本书是经验方法，不提供研究引用）；期待\"话术模板库\"的人（它给的是内在视角，不是台词）。"],"takeaway":"一套 6 步冲突化解流程 + 一个情绪自查清单 + 一句可贴在工位的反直觉口诀：对方炸毛时，别说\"你冷静点\"，说\"你说得对\"。 至少能改变一个行为：下次冲突升级前，先走第 1、2 步，再开口讲道理。","pitfalls":["别把\"自他交换\"理解成无原则退让——书的前提是对方也在这段关系里，恶意博弈场景需另行判断。","6 步法看着简单，第 1 步（平复自己）才是真功夫，跳过它直接背话术会显得虚伪，效果归零。","本书是寓言体，情节是方法的外壳；只看故事不读\"记忆锦囊\"，等于白读。"]},"book":{"title":"我就是你啊：走进他人内心的7项修炼","totalChars":102933,"chaptersCount":58,"sourceFile":"WoJiuShiNiA_ZouJinTaRen.epub"},"meta":{"version":6,"engine":"import","publishedAt":1793603902851}}},"markdown":{"dg_6":"# 《我就是你啊：走进他人内心的7项修炼》精华导读\n\n> **范围声明**：本导读的核心知识与原文摘录，仅基于实际细读的序言、第一关三种控情绪法、后记\"记忆锦囊\"（约 2 万字）；第二~七关仅据目录概述，未引原文。\n\n---\n\n## 一句话定位\n\n一本用\"蓝王国/红王国\"寓言讲沟通的方法论书，约 10 万字。故事好读，方法硬核——读完这篇导读约需 8 分钟，能带走一整套可上手的冲突化解术。\n\n## 这本书讲什么（结构骨架）\n\n1. 蓝红两国因一条新航线爆发冲突，蓝国王子奥姆奉命化解危机，却屡战屡败。\n2. 智者指点他踏上修行之路：七关修炼，每关学会一种\"走进他人内心\"的能力。\n3. 全书方法最后浓缩在后记\"记忆锦囊\"里——一套化解纷争的 6 步法（见下文核心知识）。\n4. 第一关是全部的根基：控制自己的情绪。学不会这关，后面六关全部免谈。\n\n## 核心知识（作者的精华）\n\n**① 三重山模型**：人与人的冲突，源于从\"我\"到\"你\"之间隔着三重大山——偏见、情绪、行为。想走进对方内心，得逐山翻越：先放下\"他就是针对我\"的偏见，再平息双方情绪，最后才谈得上改变行为互动。\n\n**② 自他交换**：本书相比\"非暴力沟通\"更进一层的主张——不仅是一种沟通话术，更是一种内在视角：像看待自己一样看待对方，从超越偏见和情绪的高度，洞察对方行为背后的真实需求。\n\n**③ 化解纷争 6 步法**：前提：全程避免解释、威胁、人身攻击——\"武力对抗\"只会适得其反。\n1. 平复自己的情绪：抑制攻击冲动（最难也最重要，只需几秒）\n2. 平复他人的情绪：对方炸毛时\"几乎什么也不要做\"，只回\"同意/好的/是的\"\n3. 理解他人，而非让他人被理解：问\"你为什么不同意？\"，倾听找共识\n4. 复述对方的话：\"我说得对吗？\"——让对方知道被理解，他才会闭嘴听你说\n5. 用并列词汇提自己的观点：\"就我而言/与此同时\"，不说\"没错，但是……\"\n6. 提出双赢方案：找不到就问对方；再不行就折中；连折中没有，至少留住关系\n\n**换句话说**：前两步管情绪（自己的和对方的），中间两步管理解（先听懂、再证明你听懂了），最后两步管解决（并肩提观点、一起找方案）。顺序不能乱——90% 的冲突升级，都死在前两步。\n\n## 原文精华摘录\n\n**摘录 1**（序言）：\n> 在人类的认知天性中，从'我'到'你'，间隔着三重大山：偏见、情绪和行为。\n\n*点评：全书的理论地基，一句话。冲突的本质不是利益之争，而是三重认知屏障。*\n\n**摘录 2**（序言）：\n> 相比大家所熟知的'非暴力沟通'，本书更进一层，提出'自他交换'的概念。'自他交换'不仅是一种沟通方法，更是一种高维度的内在视角。\n\n*点评：帮你快速定位本书在沟通书谱系里的坐标——它是《非暴力沟通》的进阶版，主打视角切换而非话术。*\n\n**摘录 3**（第一关·方法一，全书最核心的一句）：\n> 情绪并不取决于您正在经历什么，而取决于您觉得自己经历了什么。\n\n*点评：情绪控制的总开关。让你生气的从来不是事件本身，而是你对事件的解读——这句话背后有一整个认知心理学的传统。*\n\n**摘录 4**（第一关·方法一，智者论情绪）：\n> 就像您可以用锤子钉钉子，也可以用它锤别人的脑袋。锤子还是那个锤子，用法却不同了。\n\n*点评：妙在反常识——情绪没有好坏，恐惧和愤怒是警示你的能量（故事里正是恐慌救了奥姆的命），要\"先听听再判断\"，而不是消除它。*\n\n**摘录 5**（第一关·方法一，引向冲突的四个误判）：\n> 当别人不同意我们的看法时，我们就会认为他想跟我们对着干……但其实（他是为自己考虑）。当有人威胁我们时，我们会认为他想让我们害怕，但其实，（是威胁者自己在害怕）。如果别人批评或者侮辱我们，我们会觉得他打算伤害我们……（其实他自己正在痛苦当中）。当别人表现出轻蔑时，我们总认为这代表他看不起我们……（其实他真正看不起的是自己）。\n\n*点评：方法一\"纠误判\"的具体清单，可直接对着用——下次被激怒时，逐条检查自己犯了哪个。*\n\n**摘录 6**（第一关·方法一，奥姆转述奶奶的话）：\n> 世上并没有坏人，只有受苦的人罢了。\n\n*点评：全书最柔软的一句，也是\"自他交换\"的民间版表达。攻击性强的人，多半自己正在痛。*\n\n**摘录 7**（后记·记忆锦囊，第 2 步——全书最反直觉的招）：\n> 尤其不要和对方说'你冷静点儿！'或者'你生气是没有用的！'……你可以用'同意''好的''是的''没错'等来回复对方……对方的情绪起初会有些波动，但随后便会逐渐稳定，直到最后慢慢平复。\n\n*点评：与直觉完全相反——对方发火时，一句\"你冷静点\"是火上浇油，而\"你说得对\"反而能让对方几秒内熄火。这是全书实操价值最高的一招。*\n\n**摘录 8**（后记·记忆锦囊，第 4 步复述）：\n> 之后问对方'我说得对吗？'。这样你会收获意想不到的神奇效果——对方会眉头上扬，露出满意的笑容，大赞一声'对啊！'。而后他便会闭上嘴，听你说话。\n\n*点评：复述的双重作用写得极诚实——既检验你是否真懂，又给足对方\"被理解\"的体验。人只有感到被理解后，才愿意听你说。*\n\n## 思考与辨析\n\n- **成立之处**：6 步法顺序设计有坚实的心理学逻辑——情绪不解决，讲道理无效；不理解对方，方案谈不拢。第 2 步的\"同意\"策略与认知失调理论暗合：对方攻击得不到对抗性回应，情绪自然回落。\n- **存疑之处**：① \"同意/好的\"在权力严重不对等或对方恶意利用时，可能被解读为软弱退让，反而助长侵犯； ② 长期关系中若总是一方在\"自他交换\"，会造成单向透支——书里没细讲\"对方永远不肯翻山过来怎么办\"（此点基于细读范围的判断，后续章节可能有涉及）； ③ \"纠误判\"在盛怒当下最难执行——恰好最需要它的时刻，最用不出来。\n- **怎么落地**：不必七关全学。先只练两招——第 2 步的\"好的/同意\"（成本最低、见效最快）和摘录 5 的四误判清单（被激怒时逐条自查）。这两招练成习惯后，再回头看后面的关。\n\n## 适合谁读 / 不适合谁\n\n- **适合**：经常陷于人际冲突（职场、家庭、客户）的人；读过《非暴力沟通》想进阶的人；喜欢寓言体、读不进理论书的人。\n- **不适合**：想要学术论证与实证数据的人（本书是经验方法，不提供研究引用）；期待\"话术模板库\"的人（它给的是内在视角，不是台词）。\n\n## 读完能带走什么\n\n一套 6 步冲突化解流程 + 一个情绪自查清单 + 一句可贴在工位的反直觉口诀：对方炸毛时，别说\"你冷静点\"，说\"你说得对\"。 至少能改变一个行为：下次冲突升级前，先走第 1、2 步，再开口讲道理。\n\n## 避坑\n\n- 别把\"自他交换\"理解成无原则退让——书的前提是对方也在这段关系里，恶意博弈场景需另行判断。\n- 6 步法看着简单，第 1 步（平复自己）才是真功夫，跳过它直接背话术会显得虚伪，效果归零。\n- 本书是寓言体，情节是方法的外壳；只看故事不读\"记忆锦囊\"，等于白读。\n"}};</script>
<script>
/* 静态站垫片：把阅读页的 /api/* 请求接到内嵌数据上，页面代码零改动 */
(function () {
  const D = window.__SY_STATIC__;
  const json = o => Promise.resolve(new Response(JSON.stringify(o), { status: 200, headers: { 'Content-Type': 'application/json' } }));
  const text = t => Promise.resolve(new Response(t, { status: 200, headers: { 'Content-Type': 'text/markdown; charset=utf-8' } }));
  const orig = window.fetch;
  window.fetch = function (url) {
    const u = String(url);
    let m;
    if (u === '/api/digests') return json({ digests: D.list });
    if ((m = u.match(/^\/api\/digests\/([^/]+)\/markdown$/))) return text(D.markdown[decodeURIComponent(m[1])] || '');
    if ((m = u.match(/^\/api\/digests\/([^/]+)$/))) {
      const d = D.details[decodeURIComponent(m[1])];
      return d ? json(d) : Promise.resolve(new Response('{"error":"not found"}', { status: 404 }));
    }
    return orig.apply(this, arguments);
  };
  /* 导出按钮：静态模式下点击直接下载 markdown */
  addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('btn-md');
    if (!btn) return;
    btn.onclick = () => {
      const m = (location.hash || '').match(/^#\/d\/(.+)$/);
      if (!m) return;
      const id = decodeURIComponent(m[1]);
      const md = D.markdown[id];
      if (!md) return;
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '精华导读-' + id + '.md';
      a.click();
      URL.revokeObjectURL(a.href);
      const t = document.getElementById('toast');
      if (t) { t.textContent = '已导出 Markdown'; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
    };
  });
})();
</script>

let current=null; // {digest, book, meta}
let fs=+(localStorage.getItem('sy-fs')||16);

function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function setFs(v){fs=Math.min(24,Math.max(13,v));document.documentElement.style.setProperty('--fs',fs+'px');$('#fs-val').textContent=fs+'px';localStorage.setItem('sy-fs',fs)}
$('#btn-fs').onclick=()=>setFs(fs-1);$('#btn-fs2').onclick=()=>setFs(fs+1);

/* 主题 */
const theme=localStorage.getItem('sy-theme')||'light';
document.documentElement.setAttribute('data-theme',theme);
$('#btn-theme').textContent=theme==='dark'?'☀️':'🌙';
$('#btn-theme').onclick=()=>{
  const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);localStorage.setItem('sy-theme',n);
  $('#btn-theme').textContent=n==='dark'?'☀️':'🌙';
};

/* 路由：#/ 书架  #/d/:id 阅读页 */
function route(){
  const h=location.hash||'#/';
  const m=h.match(/^#\/d\/(.+)$/);
  if(m) showDigest(m[1]); else showShelf();
}
addEventListener('hashchange',route);

async function showShelf(){
  $('#toolbar').style.display='none';
  app.innerHTML='<div class="loading">书架加载中…</div>';
  try{
    const r=await fetch('/api/digests');
    const {digests}=await r.json();
    if(!digests.length){
      app.innerHTML=`<div class="shelf-empty"><div class="big">📚</div>书架还空着<br><span style="font-size:12px">管理员在 /admin 上传书籍并发布导读后，会出现在这里</span></div>`;
      return;
    }
    app.innerHTML=`<div class="shelf-title">书架 · ${digests.length} 篇精华导读</div>`+
      digests.map(d=>`
      <div class="book-card" onclick="location.hash='#/d/${d.id}'">
        <div class="cover">${esc((d.title||'书').slice(0,8))}</div>
        <div class="info">
          <div class="bt">《${esc(d.title)}》</div>
          <div class="bd">${esc(d.oneLiner)}</div>
          <div class="meta">
            <span class="badge">${esc(d.tag||'精华导读')}</span>
            <span>${d.totalChars>=10000?(d.totalChars/10000).toFixed(1)+'万字':d.totalChars+'字'}</span>
            <span>${d.engine==='ai'?'AI 引擎':'本地引擎'}</span>
          </div>
        </div>
      </div>`).join('');
  }catch(e){
    app.innerHTML='<div class="shelf-empty">书架加载失败，请稍后重试</div>';
  }
}

async function showDigest(id){
  app.innerHTML='<div class="loading">导读加载中…</div>';
  try{
    const r=await fetch('/api/digests/'+id);
    if(!r.ok){app.innerHTML='<div class="shelf-empty">导读不存在或未发布 <a class="back-link" href="#/">← 返回书架</a></div>';return}
    const {digest:d,book,meta}=await r.json();
    current={digest:d,book,meta,id};
    $('#toolbar').style.display='block';
    const wn=n=>n>=10000?(n/10000).toFixed(1)+' 万':String(n);
    const engName={ai:'AI 引擎',local:'本地引擎',import:'导入'}[meta.engine]||meta.engine;

    const ck=(d.core&&d.core.items)||[];
    const tlDr=(d.core&&d.core.tlDr)||'';
    const th=d.thoughts||{};
    const doubts=th.doubts||[];
    const notes=th.notes||[];
    const hasThink=!!(th.holds||doubts.length||th.howto||notes.length);
    const todo='<div class="todo-note"><b>本段尚未生成。</b>当前是未接入模型的框架稿——在管理台配置模型，或导入 AI 稿后即可补全。</div>';

    app.innerHTML=`
    <a class="back-link" href="#/">← 返回书架</a>

    <article class="reader-card book-head">
      <span class="tag">${esc(d.tag||'精华导读')}</span>
      <h2>《${esc(book.title)}》精华导读</h2>
      <p class="meta">${wn(book.totalChars||0)} 字 · ${book.chaptersCount} 节 · ${engName} · v${meta.version}</p>
      ${d.scope?`<div class="scope-note" style="text-align:left;margin-top:18px"><b>范围声明</b>　${esc(d.scope)}</div>`:''}
    </article>

    ${d.oneLiner?`<article class="reader-card">
      <div class="sec-title">一句话定位</div><p>${esc(d.oneLiner)}</p>
    </article>`:''}

    ${(d.skeleton||[]).length?`<article class="reader-card">
      <div class="sec-title">这本书讲什么</div>
      <ol class="skel">${d.skeleton.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
    </article>`:''}

    <article class="reader-card">
      <div class="sec-title">核心知识</div>
      ${ck.length?ck.map(it=>`
        <div class="ck">
          ${it.lead?`<div class="ck-lead">${esc(it.lead)}</div>`:''}
          ${it.body?`<div class="ck-body">${esc(it.body)}</div>`:''}
        </div>`).join(''):todo}
      ${tlDr?`<div class="tldr"><b>换句话说</b>　${esc(tlDr)}</div>`:''}
    </article>

    ${(d.quotes||[]).length?`<article class="reader-card">
      <div class="sec-title">原文精华摘录</div>
      ${d.quotes.map((q,i)=>`
        <blockquote class="quote">
          <div class="q-no">摘录 ${i+1} · ${esc(q.src||'原文')}</div>
          <p class="q-text">「${esc(q.text)}」</p>
          ${q.note?`<p class="q-note">点评：${esc(q.note)}</p>`:''}
        </blockquote>`).join('')}
    </article>`:''}

    <article class="reader-card">
      <div class="sec-title">思考与辨析</div>
      ${th.holds?`<div class="think-block"><div class="h">成立之处</div><p>${esc(th.holds)}</p></div>`:''}
      ${doubts.length?`<div class="think-block doubt"><div class="h">存疑之处</div>
        <ul class="think-list">${doubts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      ${th.howto?`<div class="think-block"><div class="h">怎么落地</div><p>${esc(th.howto)}</p></div>`:''}
      ${notes.length?`<div class="think-block">${notes.map(n=>`<p>${esc(n)}</p>`).join('')}</div>`:''}
      ${!hasThink?todo:''}
      ${((d.fit||[]).length||(d.unfit||[]).length)?`<div class="dual">
        <div class="fit"><div class="h">✔ 适合谁读</div>${(d.fit||[]).map(x=>`<div>· ${esc(x)}</div>`).join('')||'—'}</div>
        <div class="unfit"><div class="h">✘ 不适合谁</div>${(d.unfit||[]).map(x=>`<div>· ${esc(x)}</div>`).join('')||'—'}</div>
      </div>`:''}
    </article>

    ${d.takeaway?`<article class="reader-card">
      <div class="sec-title">读完能带走什么</div>
      <div class="takeaway"><div class="h">TAKEAWAY</div><p>${esc(d.takeaway)}</p></div>
    </article>`:''}

    ${(d.pitfalls||[]).length?`<article class="reader-card">
      <div class="sec-title">避坑</div>
      <ul class="pitfall">${d.pitfalls.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
    </article>`:''}`;

    // 阅读位置记忆
    const pos=+(localStorage.getItem('sy-pos-'+id)||0);
    if(pos>200){setTimeout(()=>window.scrollTo(0,pos),50);toast('已恢复上次阅读位置')}
  }catch(e){
    app.innerHTML='<div class="shelf-empty">加载失败，请检查网络</div>';
  }
}

/* 进度 + 位置记忆 */
addEventListener('scroll',()=>{
  const h=document.documentElement;
  if(h.scrollHeight<=h.clientHeight)return;
  const p=h.scrollTop/(h.scrollHeight-h.clientHeight);
  $('#pbar').style.width=(p*100).toFixed(1)+'%';
  const m=location.hash.match(/^#\/d\/(.+)$/);
  if(m)localStorage.setItem('sy-pos-'+m[1],window.scrollY);
},{passive:true});

$('#btn-back').onclick=()=>location.hash='#/';
$('#btn-md').onclick=()=>{
  if(!current)return;
  location.href='/api/digests/'+current.id+'/markdown';
  toast('正在导出 Markdown');
};

setFs(fs);
route();
</script>
</body>
</html>
