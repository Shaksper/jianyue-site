<script>window.__SY_STATIC__={"generatedAt":1793949247245,"list":[{"id":"dg_10","bookId":"bk_5","version":1,"engine":"import","publishedAt":1793949220570,"title":"平凡的世界","totalChars":810762,"chaptersCount":169,"oneLiner":"一部八十二万字的三部曲：一九七五到一九八五年，黄土高原双水村的两兄弟——哥哥孙少安把根扎进土地，弟弟孙少平把心伸向远方——在贫穷与变革的夹缝里，把「平凡」活成了不平庸。读完这篇导读约八分钟，读完原著约需四十小时。","tag":"中国当代文学 · 茅盾文学奖","digestChars":6352},{"id":"dg_9","bookId":"bk_4","version":1,"engine":"import","publishedAt":1793872084901,"title":"儒林外史","totalChars":328634,"chaptersCount":58,"oneLiner":"中国第一部真正意义上的长篇讽刺小说：五十六回没有主角，只有一面照了三百年的镜子——读书人一旦横下「功名富贵」的念头，会当众活成什么样子。约三十三万字的明清白话章回体，通勤读完全书约需十小时，读完这篇导读约八分钟。","tag":"中国古典文学 · 长篇讽刺小说","digestChars":5497},{"id":"dg_8","bookId":"bk_3","version":1,"engine":"import","publishedAt":1793674170480,"title":"活着","totalChars":98856,"chaptersCount":20,"oneLiner":"一个败光家产的少爷，用一生亲手埋葬了父母、妻子、儿女、女婿和外孙，最后与一头也叫福贵的老牛相依为命。余华写的不是苦难本身，而是一个人如何在苦难里保住讲述自己一生的平静。","tag":"精华导读 · 导入","digestChars":4282},{"id":"dg_7","bookId":"bk_2","version":1,"engine":"import","publishedAt":1793670572569,"title":"Theo of Golden","totalChars":623737,"chaptersCount":70,"oneLiner":"一位隐去姓名的葡萄牙老人在美国小镇住了一年，用一墙铅笔画像和一封封手写信，把一个个普通人「看见」——直到他为保护一个无家可归的女人而死于非命。一本关于匿名之善、慷慨与尊严的疗愈系小说。","tag":"精华导读 · 导入","digestChars":4000},{"id":"dg_6","bookId":"bk_1","version":6,"engine":"import","publishedAt":1793603902851,"title":"我就是你啊：走进他人内心的7项修炼","totalChars":102933,"chaptersCount":58,"oneLiner":"一本用\"蓝王国/红王国\"寓言讲沟通的方法论书，约 10 万字。故事好读，方法硬核——读完这篇导读约需 8 分钟，能带走一整套可上手的冲突化解术。","tag":"精华导读","digestChars":3085}],"details":{"dg_6":{"digest":{"schemaVersion":2,"tag":"精华导读","scope":"本导读的核心知识与原文摘录，仅基于实际细读的序言、第一关三种控情绪法、后记\"记忆锦囊\"（约 2 万字）；第二~七关仅据目录概述，未引原文。","oneLiner":"一本用\"蓝王国/红王国\"寓言讲沟通的方法论书，约 10 万字。故事好读，方法硬核——读完这篇导读约需 8 分钟，能带走一整套可上手的冲突化解术。","skeleton":["蓝红两国因一条新航线爆发冲突，蓝国王子奥姆奉命化解危机，却屡战屡败。","智者指点他踏上修行之路：七关修炼，每关学会一种\"走进他人内心\"的能力。","全书方法最后浓缩在后记\"记忆锦囊\"里——一套化解纷争的 6 步法（见下文核心知识）。","第一关是全部的根基：控制自己的情绪。学不会这关，后面六关全部免谈。"],"core":{"items":[{"lead":"① 三重山模型","body":"人与人的冲突，源于从\"我\"到\"你\"之间隔着三重大山——偏见、情绪、行为。想走进对方内心，得逐山翻越：先放下\"他就是针对我\"的偏见，再平息双方情绪，最后才谈得上改变行为互动。"},{"lead":"② 自他交换","body":"本书相比\"非暴力沟通\"更进一层的主张——不仅是一种沟通话术，更是一种内在视角：像看待自己一样看待对方，从超越偏见和情绪的高度，洞察对方行为背后的真实需求。"},{"lead":"③ 化解纷争 6 步法","body":"前提：全程避免解释、威胁、人身攻击——\"武力对抗\"只会适得其反。\n1. 平复自己的情绪：抑制攻击冲动（最难也最重要，只需几秒）\n2. 平复他人的情绪：对方炸毛时\"几乎什么也不要做\"，只回\"同意/好的/是的\"\n3. 理解他人，而非让他人被理解：问\"你为什么不同意？\"，倾听找共识\n4. 复述对方的话：\"我说得对吗？\"——让对方知道被理解，他才会闭嘴听你说\n5. 用并列词汇提自己的观点：\"就我而言/与此同时\"，不说\"没错，但是……\"\n6. 提出双赢方案：找不到就问对方；再不行就折中；连折中没有，至少留住关系"}],"tlDr":"前两步管情绪（自己的和对方的），中间两步管理解（先听懂、再证明你听懂了），最后两步管解决（并肩提观点、一起找方案）。顺序不能乱——90% 的冲突升级，都死在前两步。"},"quotes":[{"text":"在人类的认知天性中，从'我'到'你'，间隔着三重大山：偏见、情绪和行为。","src":"序言","note":"全书的理论地基，一句话。冲突的本质不是利益之争，而是三重认知屏障。"},{"text":"相比大家所熟知的'非暴力沟通'，本书更进一层，提出'自他交换'的概念。'自他交换'不仅是一种沟通方法，更是一种高维度的内在视角。","src":"序言","note":"帮你快速定位本书在沟通书谱系里的坐标——它是《非暴力沟通》的进阶版，主打视角切换而非话术。"},{"text":"情绪并不取决于您正在经历什么，而取决于您觉得自己经历了什么。","src":"第一关·方法一，全书最核心的一句","note":"情绪控制的总开关。让你生气的从来不是事件本身，而是你对事件的解读——这句话背后有一整个认知心理学的传统。"},{"text":"就像您可以用锤子钉钉子，也可以用它锤别人的脑袋。锤子还是那个锤子，用法却不同了。","src":"第一关·方法一，智者论情绪","note":"妙在反常识——情绪没有好坏，恐惧和愤怒是警示你的能量（故事里正是恐慌救了奥姆的命），要\"先听听再判断\"，而不是消除它。"},{"text":"当别人不同意我们的看法时，我们就会认为他想跟我们对着干……但其实（他是为自己考虑）。当有人威胁我们时，我们会认为他想让我们害怕，但其实，（是威胁者自己在害怕）。如果别人批评或者侮辱我们，我们会觉得他打算伤害我们……（其实他自己正在痛苦当中）。当别人表现出轻蔑时，我们总认为这代表他看不起我们……（其实他真正看不起的是自己）。","src":"第一关·方法一，引向冲突的四个误判","note":"方法一\"纠误判\"的具体清单，可直接对着用——下次被激怒时，逐条检查自己犯了哪个。"},{"text":"世上并没有坏人，只有受苦的人罢了。","src":"第一关·方法一，奥姆转述奶奶的话","note":"全书最柔软的一句，也是\"自他交换\"的民间版表达。攻击性强的人，多半自己正在痛。"},{"text":"尤其不要和对方说'你冷静点儿！'或者'你生气是没有用的！'……你可以用'同意''好的''是的''没错'等来回复对方……对方的情绪起初会有些波动，但随后便会逐渐稳定，直到最后慢慢平复。","src":"后记·记忆锦囊，第 2 步——全书最反直觉的招","note":"与直觉完全相反——对方发火时，一句\"你冷静点\"是火上浇油，而\"你说得对\"反而能让对方几秒内熄火。这是全书实操价值最高的一招。"},{"text":"之后问对方'我说得对吗？'。这样你会收获意想不到的神奇效果——对方会眉头上扬，露出满意的笑容，大赞一声'对啊！'。而后他便会闭上嘴，听你说话。","src":"后记·记忆锦囊，第 4 步复述","note":"复述的双重作用写得极诚实——既检验你是否真懂，又给足对方\"被理解\"的体验。人只有感到被理解后，才愿意听你说。"}],"thoughts":{"holds":"6 步法顺序设计有坚实的心理学逻辑——情绪不解决，讲道理无效；不理解对方，方案谈不拢。第 2 步的\"同意\"策略与认知失调理论暗合：对方攻击得不到对抗性回应，情绪自然回落。","doubts":["① \"同意/好的\"在权力严重不对等或对方恶意利用时，可能被解读为软弱退让，反而助长侵犯；","② 长期关系中若总是一方在\"自他交换\"，会造成单向透支——书里没细讲\"对方永远不肯翻山过来怎么办\"（此点基于细读范围的判断，后续章节可能有涉及）；","③ \"纠误判\"在盛怒当下最难执行——恰好最需要它的时刻，最用不出来。"],"howto":"不必七关全学。先只练两招——第 2 步的\"好的/同意\"（成本最低、见效最快）和摘录 5 的四误判清单（被激怒时逐条自查）。这两招练成习惯后，再回头看后面的关。","notes":[]},"fit":["经常陷于人际冲突（职场、家庭、客户）的人；读过《非暴力沟通》想进阶的人；喜欢寓言体、读不进理论书的人。"],"unfit":["想要学术论证与实证数据的人（本书是经验方法，不提供研究引用）；期待\"话术模板库\"的人（它给的是内在视角，不是台词）。"],"takeaway":"一套 6 步冲突化解流程 + 一个情绪自查清单 + 一句可贴在工位的反直觉口诀：对方炸毛时，别说\"你冷静点\"，说\"你说得对\"。 至少能改变一个行为：下次冲突升级前，先走第 1、2 步，再开口讲道理。","pitfalls":["别把\"自他交换\"理解成无原则退让——书的前提是对方也在这段关系里，恶意博弈场景需另行判断。","6 步法看着简单，第 1 步（平复自己）才是真功夫，跳过它直接背话术会显得虚伪，效果归零。","本书是寓言体，情节是方法的外壳；只看故事不读\"记忆锦囊\"，等于白读。"]},"book":{"title":"我就是你啊：走进他人内心的7项修炼","totalChars":102933,"chaptersCount":58,"sourceFile":"WoJiuShiNiA_ZouJinTaRen.epub"},"meta":{"version":6,"engine":"import","publishedAt":1793603902851}},"dg_7":{"digest":{"schemaVersion":2,"tag":"精华导读 · 导入","scope":"本导读的主线、身世与结局均基于实际细读的章节：序言、第 1、4、5、23、24、33、57 章全文，第 62 章开头与尾声（约 6 万词中的约 2.5 万词）；其余约 45 章仅据总目录与章首预览概述，未引原文。英文原著，摘录保留英文原文并附中文大意。","oneLiner":"一位隐去姓名的葡萄牙老人在美国小镇住了一年，用一墙铅笔画像和一封封手写信，把一个个普通人「看见」——直到他为保护一个无家可归的女人而死于非命。一本关于匿名之善、慷慨与尊严的疗愈系小说。","skeleton":["序言：Theo 在金色镇只住一年，「却足以形成一股自己的水流，把别人卷进去」。","第 1–3 章：神秘老人从纽约来到南方小镇 Golden，独居、漫步、匿名，对一切保持孩童式好奇。","第 4–5 章：第一封「奇怪的信」寄给会计师 Minnette——有人买下了她叔叔 Asher 画的她的肖像，要当面送她；律师丈夫将信将疑陪她赴约。","第 6–22 章：赠予（bestowal）成体系：每周从咖啡店 Chalice 的画像墙买画送人，手写信约人在喷泉见面；受赠者扩至流浪女 Ellen、清洁工 Kendrick 与病中的女儿 Lamisha。","第 23 章：名字之谜——「叫我 Theo 就好」，全镇放弃追问，选择凭果实判断人。","第 24 章：赠画加速至每周两三幅；给 Ellen 的信刻意用最简单的词写成。","第 33 章：身世闪回——1942 年葡萄牙杜罗河葡萄园的十岁男孩，里斯本美术馆之行被艺术「附魔」，人生从此分为里斯本前/后。","第 34–56 章：一年四季的友情网（大提琴手 Simone、街头乐手 Basil、小狗 Tony……），赠予持续，Simone 受伤的手奇迹痊愈。","第 57–59 章：深夜三个醉汉抢 Ellen 的帽子与自行车，Theo 下楼干预，被害身亡；消息震彻小镇。","第 60–62 章 + 尾声：知情人 Ponder 交付遗物与遗赠；凶手始终未查明；小镇的改变持续发酵——Minnette 给儿子取名 Theo。"],"core":{"items":[{"lead":"赠予的本质是「看见」","body":"Theo 送的从来不是画像本身——画家 Asher 画的是镇上真实的人，他买下画像送还本人，等于宣告「你值得被画下来、被记住」。对无名无姓的流浪女 Ellen、对大学清洁工 Kendrick，这份「被看见」比任何施舍都重。"},{"lead":"匿名行善是一套完整设计","body":"无姓、无邮箱、无实名信用卡（用 PH Ltd 的卡付款），一切经由律师 Ponder 代理。匿名不是故弄玄虚：它让受赠者无法还人情，礼物保持纯粹；也逼着小镇「凭果实判断人」。"},{"lead":"手写信是仪式的核心","body":"每次赠予都从一封钢笔手写、亚麻纸的信开始。给 Ellen 的信刻意用最短的句子、最简单的词——写信本身就是把对方当回事。"},{"lead":"慷慨需要被认真运营","body":"Theo 不是心血来潮：画像清单、约会日历（周二 Bob 七点）、助手 Gidley 送信、频率从每周一幅加速到两三幅。善意像项目一样被管理。"},{"lead":"艺术是「如何活」的答案","body":"第 33 章里斯本美术馆的顿悟——「音乐是声音的画像」。美构成了 Theo 一生的操作系统，他后来对大提琴手 Simone 的投入是同一件事的延续。"},{"lead":"「把生活过小，反而活得比谁都大」","body":"尾声引镇报记者 Katherine 的话作结：他选择 small，却 larger than life。一年、一个镇、每周几幅画——规模极小，穿透力极强。"},{"lead":"结局不给解药","body":"凶手未查明，真名未完全揭晓（Ponder 早已知道，书未和盘托出）。作者给的谜底不是「他是谁」，而是「他做了什么之后，小镇变成了什么样」。"}],"tlDr":"一个匿名老人用「买下你的画像送给你」这一件事，把一座小镇的人一个个点亮；善意不在于规模，而在于让对方确信自己值得被看见。"},"quotes":[{"text":"Only a year. Not so long. But long enough to create a current of his own and to catch others in it.","src":"序言","note":"全书题眼。中文大意：只有一年。不长，但足以形成一股自己的水流，把别人卷进去。一个人就是一股水流。"},{"text":"I'm sorry, dear fellow, but I have nothing to give you this morning. Perhaps tomorrow? And stop complaining. Be glad you're not in New York today.","src":"第 1 章","note":"对乞食小鸟说话，人物一页立住：认真对待每一个小生命，还有一点幽默。"},{"text":"Just think, we might actually meet a sincerely kind human being. There don't seem to be many of those around these days.","src":"第 5 章","note":"Minnette 决定赴约的理由，也是全书的时代注脚：真诚的善成了稀缺品。"},{"text":"The unspoken consensus of the neighborhood was that he would be judged by his fruits, by what could be seen with their own eyes. ... Or so they thought.","src":"第 23 章","note":"全镇对匿名者的信任逻辑——凭果实判断人。结尾的「Or so they thought（他们原以为是）」为结局埋下钩子。"},{"text":"I bought your portrait and would like you to have it. It is a gift. You do not have to pay anything for it or do anything in exchange. ... I am an old man. I will be wearing a green hat.","src":"第 24 章（致 Ellen 的信）","note":"刻意用最简单的词写给流浪女：无附加条件、不居高临下，把尊严还给对方。"},{"text":"His life, thereafter, was clearly delineated into Theo-before-Lisbon and Theo-after-Lisbon.","src":"第 33 章","note":"一次美术馆之行劈开一生。美对人的塑造力，是理解 Theo 全部行为的钥匙。"},{"text":"It was an acknowledgment, a tribute, to Theo's gift of sight. A eulogy.","src":"第 62 章","note":"对逝者最好的悼念，是他教会别人「怎么去看」。Asher 拿起放大镜端详蛋壳那一幕，是全书最安静的告别。"}],"thoughts":{"holds":"把赠予设计成「看见」在心理学上站得住：被看见（recognition）是比物质更稀缺的需求；Ellen 从受赠、遇袭到振作经营 featherwood 小生意，Kendrick 升职、Lamisha 长大想当康复师——尾声用一连串后续证实了这种善的复利。","doubts":["① 匿名善行的前提是极端财富与法律护航（Ponder 全权代理、私人飞机），普通人难以复制其形式——可复制的是心意而非排场；","② Theo 的动机只有身世碎片，神秘化略重，接近「圣人传记」的写法，人物有被神化之嫌；","③ 结尾暴力来得突然、凶手永不查明——是文学选择，但想要因果闭环的读者会卡在这里。"],"howto":"把「赠予」缩小到可操作：这周为身边某个不被注意的人做一件专属的、不要求回报的事——Theo 式的「买下那张画像送给你」。另一条是画家 Asher 的启示：把你的手艺变成看见他人的工具。","notes":[]},"fit":["喜欢《解忧杂货店》《一个人的朝圣》式温柔叙事的人","对「匿名之善」「被看见」主题感兴趣的人","想找一本语言平实、适合睡前安静读的英文小说的人"],"unfit":["想要强情节、快节奏的人","期待身世谜团有完整解答的人（谜底部分留白）","对挽歌语调、宗教意味敏感的人"],"takeaway":"记住一个动作：Theo 式的赠予 = 购买一份「专属的看见」，并无条件送出。合上书可做的一件事：本周为一个人手写一封信（或一条认真写的长消息），只送，不解释。","pitfalls":["别把它当「行善指南」读——书的力量在文学呈现，不在方法论；也别期待悬疑式谜底，作者要给的不是 Theo 是谁，而是他做了什么之后，小镇变成了什么样。"]},"book":{"title":"Theo of Golden","totalChars":623737,"chaptersCount":70,"sourceFile":"TheoOfGolden.epub"},"meta":{"version":1,"engine":"import","publishedAt":1793670572569}},"dg_8":{"digest":{"schemaVersion":2,"tag":"精华导读 · 导入","scope":"本导读基于全书细读：五篇自序（中文版、韩文版、日文版、英文版、麦田新版）与正文全部十节（约 8.8 万字）。所有摘录均出自实际读到原文的段落，并标注出处。","oneLiner":"一个败光家产的少爷，用一生亲手埋葬了父母、妻子、儿女、女婿和外孙，最后与一头也叫福贵的老牛相依为命。余华写的不是苦难本身，而是一个人如何在苦难里保住讲述自己一生的平静。","skeleton":["五篇自序：交代写作原点——美国民歌《老黑奴》，以及那句题眼「人是为活着本身而活着的」。","1992 年夏天，采风的「我」在乡间遇见老人福贵；他对着老牛把一家人的名字一个个喊出来，骗牛说还有别的牛在耕田。","少爷时代：吃喝嫖赌、骑妓女向丈人请安、打怀着孕跪地劝他回家的家珍，被龙二设局输光一百多亩地和房产。","父亲从村口粪缸上摔下而死；丈人抬着花轿接走家珍；福贵租龙二的五亩地学做农活，长根沦为乞丐。","被抓壮丁：进城请郎中途中被国军抓走，渡江后被围，老全中弹、春生失踪；被俘后领两个馒头、拿了盘缠回家，母亲已死，凤霞高烧后失语。","土改：龙二被枪毙，临刑喊「福贵，我是替你去死啊」；福贵分到五亩地，家珍带着有庆回来。","人民公社与大跃进：砸锅、食堂、煮钢铁、老孙头的屋子被烧；饥荒里家珍得软骨病，揣着一袋米从娘家回来。","有庆之死：为救县长女人献血被抽干，县长竟是当年的春生；福贵夜里把儿子埋在自己爹娘坟前，家珍终究猜到了。","凤霞出嫁：偏头二喜带着二十多人、一车彩礼风光迎娶；凤霞难产大出血而死，留下儿子苦根。","家珍之死 → 二喜被水泥板夹死 → 苦根吃豆子撑死；福贵买下待宰的老牛，也叫福贵，一人一牛活成了「两个老不死」。"],"core":{"items":[{"lead":"「活着」的力量是忍受，不是喊叫","body":"韩文版自序里余华把「活着」拆开给外国读者看：这个词在中国语言里的力量，不来自进攻也不来自呐喊，而来自忍受——忍受生命赋予的责任，忍受现实给的幸福与苦难、无聊与平庸。全书没有一句控诉，福贵的语调始终像在讲别人的农事，这种平静本身就是力量。"},{"lead":"生活是感受，幸存是看法","body":"日文版自序回答了意大利中学生的问题：为什么极端环境里还写「生活」而不是「幸存」？答案在叙述人称——福贵用第一人称讲述自己，不需要旁人的看法，只需要自己的感受。若换成第三人称，他就成了读者眼中的「苦难幸存者」。余华还交代了技术细节：最初用旁观者视角写，难以为继；改让福贵自己开口，写作一下畅通了。"},{"lead":"苦难不是重点，讲述的平静才是","body":"福贵讲女儿被送人时嘿嘿笑，讲自己挨爹的布鞋时得意，讲家珍「死得很好，死得平平安安、干干净净」。全文最大的反常不是死了多少人，而是叙述者提起这些时的温和与幽默——这才是这本书区别于「苦难展览」的地方。"},{"lead":"命运是偶然的，活下来的人只能领受","body":"输光家产本是灾祸，却让他躲过了枪毙（龙二替他去死）；被抓壮丁九死一生，回来反而分到了地。福贵摸着胳膊对自己说「这下可要好好活了」。书里没有因果报应，只有一连串偶然，人只能在偶然里决定怎么活。"},{"lead":"亲情是唯一没有被夺走的财产","body":"一百多亩地输光了，绸衣穿不惯，唯一留得住的是家珍那句「我也不想要什么福分，只求每年都能给你做一双新鞋」。凤霞被领走两次都跑回来，福贵背着她往回走时说「就是全家都饿死，也不送凤霞回去」——这是全书最硬的骨头。"},{"lead":"叫名字，是把死去的人留住","body":"开篇最动人的设计：福贵对牛喊「二喜、有庆不要偷懒，家珍、凤霞耕得好，苦根也行啊」，他骗牛说还有别的牛在耕田，其实是把五个死去的亲人一个个叫回田里。结尾他又对牛报账：今天谁耕了多少。记忆不是纪念碑，是每天下地时的一次点名。"},{"lead":"体面是苦难里唯一能自己决定的事","body":"家珍临终前拒绝麻袋包身（「麻袋上都是死结，我到了阴间解不开」），要一块干净布、要洗净身子；她把所有破烂衣服堆在床边拆缝，说「有活干心里踏实」。余华不给他们意义，只给他们体面——这已经是一个人能守住的全部。"},{"lead":"不争，是他活到最后的原因","body":"结尾福贵自述：龙二、春生都只风光了一阵，到头来命都丢了，「做人还是平常点好，争这个争那个，争来争去赔了自己的命」。这话不是成功学，是一个把亲人都送走的人对「活着」的最终理解：不争不是认输，是不再拿命去换。"}],"tlDr":"余华让一个失去全部亲人的人来讲自己的一生，从而证明：活着不需要外部的理由，也不需要旁人的同情——它只需要一个人还能平静地、甚至带点得意地把日子讲下去。"},"quotes":[{"text":"人是为活着本身而活着的，而不是为了活着之外的任何事物所活着。","src":"中文版自序（1993）","note":"全书的题眼。余华说这句话是「写作过程让我明白」的，不是预先设定的主题——先有福贵，后有这句话。"},{"text":"作为一个词语，「活着」在我们中国的语言里充满了力量，它的力量不是来自于喊叫，也不是来自于进攻，而是忍受，去忍受生命赋予我们的责任，去忍受现实给予我们的幸福和苦难、无聊和平庸。","src":"韩文版自序（1996）","note":"最准确的自我注解。注意「无聊和平庸」——他要忍的不只是惨，还有漫长的不精彩。"},{"text":"生活是一个人对自己经历的感受，而幸存往往是旁观者对别人经历的看法。","src":"日文版自序（2002）","note":"一句话说清叙述人称为何决定全书意义。读这本书时，你站在福贵的位置还是旁观者的位置，看到的是两本不同的书。"},{"text":"皇帝招我做女婿，路远迢迢我不去。","src":"正文开篇（福贵赶牛时唱的歌谣）","note":"全书第一个声音就是这句自鸣得意的拒绝。一个一无所有的老人，先给你唱一句「我不去当驸马」——气派与穷困的反差，就是福贵的底色。"},{"text":"我怕它知道只有自己在耕田，就多叫出几个名字去骗它，它听到还有别的牛也在耕田，就不会不高兴，耕田也就起劲啦。","src":"正文开篇（福贵解释为何对牛喊一串名字）","note":"全书最狠也最温柔的一笔：他骗的是牛，安放的是自己——那些名字全是死去的家人。"},{"text":"做人不能忘记四条，话不要说错，床不要睡错，门槛不要踏错，口袋不要摸错。","src":"正文·间奏（福贵对插秧女人说的话）","note":"浪子回头后的人生总结，全是消极戒律。他一生做错的第一条就是「床睡错」，所以这句听着像玩笑，其实是忏悔。"},{"text":"月光照在路上，像是撒满了盐。","src":"正文·有庆死后","note":"十三个字，写尽丧子之痛——不写哭，写路；盐既白又咸，落在伤口上。中国当代文学最著名的比喻之一。"},{"text":"家珍死得很好，死得平平安安、干干净净，死后一点是非都没留下，不像村里有些女人，死了还有人说闲话。","src":"正文·间奏（福贵对采风人说的话）","note":"用「很好」形容妻子的死，初读刺耳，再读才懂：在一个什么都被夺走的人生里，「死得干净」是他能替她守住的最后一件东西。"},{"text":"少年去游荡，中年想掘藏，老年做和尚。","src":"正文结尾（福贵远去的歌声）","note":"三句民谣收束一生：游荡、贪求、放下。福贵没有做和尚，他只是把一家人的名字都记着，一个人过完了余生。"}],"thoughts":{"holds":"「第一人称让苦难变成日子」这个判断站得住，因为余华在三个不同年份的自序里反复确认过同一条技术路径：最初用旁观者视角写作难以为继，改成福贵自述后「没有任何阻挡」。这不是事后美化，而是可交叉印证的创作事实。也正因如此，书里那些近乎欢快的细节（对牛报账、跟插秧女人开玩笑、给苦根讲鸡变牛）才不显得突兀——它们是叙述者的性格，不是作者硬加的温情。","doubts":["① 死亡密度过高：父母、妻子、儿子、女儿、女婿、外孙，七口人几乎全部非正常死亡，读到后半段读者容易从共情滑向麻木，苦难有被「清点」的风险。","② 「忍受」被抬得太高，容易被误读为对苦难的顺从甚至赞美。全书没有一次追问「谁该负责」——有庆之死明明是医疗事故与权力冷漠，文本却停在福贵的悲痛里，这是文学选择，也是思想上的回避。","③ 女性承担了全部沉默的付出：家珍逆来顺受到底，凤霞又聋又哑、死时连叫喊都不可能。她们的死推动情节，却几乎没有自己的视角——这一点在今天的阅读里值得警惕。"],"howto":"把「福贵视角」用在自己身上：挑一件你认定的倒霉事，先用旁观者口吻写 300 字（会写成控诉或抱怨），再换成当事人自述写 300 字（会出现细节、幽默、甚至得意）。两稿并排看，你会亲身验证余华那句「生活是感受，幸存是看法」——这也是把这本书从「读过」变成「用上」的最短路径。","notes":[]},"fit":["想读中国当代文学经典、能承受沉重题材的读者","写作者 / 内容创作者：想看清叙述人称如何改变一本书的意义","经历过丧失、想找一种平静讲述方式的人"],"unfit":["近期正处于丧亲、抑郁或情绪低谷的人（连续死亡描写可能造成二次伤害）","想找「励志」「正能量」解读的人——它不给安慰，只给承受","偏爱强情节、反转、多线叙事的读者"],"takeaway":"记住一句话：生活是属于每个人自己的感受，不属于任何别人的看法。合上书可做的一件事：找家里还健在的长辈，问一句「你这辈子最难的那一年是怎么过的」，把他的话录下来——这就是福贵对采风人做的事，也是这本书教人做的唯一一件具体的事。","pitfalls":["别把福贵当「苦难榜样」去歌颂忍受，那会把一本反抗遗忘的书读成劝人认命的书。","别把它读成「好死不如赖活着」的鸡汤：余华写的是一个人如何保住讲述自己一生的权利，不是教人放弃追问。","别跳过五篇自序——它们不是附属品，是作者亲手给出的解读钥匙，尤其日文版那篇直接决定了你怎么看整本书。"]},"book":{"title":"活着","totalChars":98856,"chaptersCount":20,"sourceFile":"Huozhe.epub"},"meta":{"version":1,"engine":"import","publishedAt":1793674170480}},"dg_9":{"digest":{"schemaVersion":2,"tag":"中国古典文学 · 长篇讽刺小说","scope":"本导读细读了以下回目与段落：前言、第一回（楔子·王冕）、第二回（周进）、第三回（范进中举）、第五回与第六回（严氏兄弟）、第十四回（马二先生游西湖段落）、第十六回与第二十回（匡超人）、第三十四回（杜少卿）、第四十八回（王玉辉）、第五十五回（四大奇人）、第五十六回（幽榜，据前言考据为后人伪作，仅作参考）；其余回目依据总目录与各回回目做结构概览，未逐字细读，已在骨架中标明。所有摘录均出自上述实际读到的原文。","oneLiner":"中国第一部真正意义上的长篇讽刺小说：五十六回没有主角，只有一面照了三百年的镜子——读书人一旦横下「功名富贵」的念头，会当众活成什么样子。约三十三万字的明清白话章回体，通勤读完全书约需十小时，读完这篇导读约八分钟。","skeleton":["开篇一首词点题：「功名富贵无凭据，费尽心情，总把流光误」——全书唯一的贯穿线不是人物，是这四个字。","楔子借王冕立标尺：放牛娃自学成才、拒官避祸，断言八股取士之法一定，「一代文人有厄」——制度判词先于故事。","周进撞号板：六十岁考不进学的老童生，在贡院一头撞向号板放声大哭；商人凑二百两银子替他捐监，次年高中御史——「哭」与「中」的荒诞接力。","范进中举：考了三十多年，中举当场喜疯；胡屠户前一天骂他「尖嘴猴腮」，当天低着头替他扯了几十回衣襟——讽刺喜剧的巅峰一回。","严氏兄弟：严贡生横行碰瓷（把几文钱的云片糕讹成几百两的药、强立嗣夺产），严监生坐拥十多万两却两根灯草咽不下气。","名士群像：马二先生游西湖满眼只见食物与女客；莺脰湖、莫愁湖高会此起彼伏——假名士拿风雅给功名当点缀。","匡超人：全书最完整的堕落弧线——夜里跪着捧父亲出恭的孝子，一步步变成停妻再娶、拒探恩人、自吹「先儒匡子之神位」的「名士」。","理想寄托：杜少卿装病辞征辟、携妻游山、主张「娶妾伤天理」；虞育德、庄绍光与泰伯祠大祭——作者亲手造了一座精神庙宇。","庙宇倾颓：泰伯祠屋山倒了半边、儿孩在门口踢球；王玉辉劝女殉夫大笑「死的好」——礼教吃人，理想落空。","结局落在市井：会写字的、下棋的、开茶馆的、弹琴的四个市井奇人，才是作者眼里真正的贤人——「不曾在朝廷旌扬之列」。（第五十六回「幽榜」系后人伪作）"],"core":{"items":[{"lead":"主线不是故事，是「功名富贵」四个字","body":"五十六回没有贯穿主角，人物一环传一环：周进提携范进，范进连着张静斋，张静斋惹出汤知县……鲁迅评它是「集诸碎锦，合为帖子，虽非巨幅，而时见珍异」。把碎锦缀起来的针线只有一根：谁横了求功名富贵的念头，谁就开始变形。换句话说，这不是一部小说，是「学历社会」的完整纪录片。"},{"lead":"讽刺从不出面骂人，让落差自己开口","body":"胡屠户中举前骂女婿「癞蛤蟆想吃起天鹅肉」「尖嘴猴腮，也该撒泡尿自己照照」，中举当天「见女婿衣裳后襟滚皱了许多，一路低着头替他扯了几十回」；严贡生的船工吃了他几片云片糕，他立刻说成「费了几百两银子合的药」。作者一句评论都没有，判决完全留给读者——这正是鲁迅说的「婉而多讽」：证据呈堂，不判而判。"},{"lead":"科举画出的圈，比功名本身更伤人","body":"进学与不进学之间隔着的不是学问，是整个社会的脸色：梅玖以「老友不同小友序齿」的规矩当众羞辱六十岁的先生周进；王举人鸡鸭满桌吃剩一地骨头，周进「昏头昏脑扫了一早晨」还要替他挨造谣；范进中举当天，家里正等他卖掉一只母鸡换米救命。功名未到手时人不如鸡，到手的一瞬立刻翻盘——这个落差就是全书反复奏响的和弦。"},{"lead":"匡超人：一个好人被环境层层加码教坏","body":"第十六回他半夜跪在床前捧着瘫痪父亲的腿让其出恭、四更天起来杀猪磨豆腐，是全书最动人的孝子。然后一路被「教」：马二先生教他把举业当正业，杭州名士圈教他吹牛抬轿，衙门潘三教他弄钱办事。到第二十回，恩人潘三下狱，他说「既替朝廷办事，就要照依着朝廷的赏罚」拒绝探监；停妻再娶时拿「戏文上说的蔡状元招赘牛相府，传为佳话，这有何妨」自我说服。堕落不是突变，每一步都有当时听来「合理」的理由。"},{"lead":"严监生：被一句戏读埋没的最复杂人物","body":"他是家私十多万两的监生：儿子要吃肉只肯「在熟切店内买四个钱的哄他就是了」，病重舍不得吃人参，临死惦记两茎灯草「恐费了油」。但妻子办丧事花四五千两银子毫无犹豫，给两位舅爷送银子一送再送（每位一百两、再加五十两、病中又各两封）。对己刻薄到抠灯草，对人情世故挥金如土——他不是吝啬鬼寓言，是被宗法社会的人情账单活活拖垮的可怜人。先读第五回再笑他。"},{"lead":"王玉辉：礼教吃人时，吃人的和被吃的都不知道疼","body":"老秀才王玉辉鼓励绝食殉夫的女儿「这是青史上留名的事，我难道反拦阻你」，女儿饿死八日而死，他仰天大笑「死的好！死的好！」；可入祠旌表之后他「转觉心伤」，庆功宴不肯去坐上席，后来在苏州看见一个穿白衣的少年妇人便「想起女儿，热泪直滚」。他不是坏人——这正是最可怕处：把一个老实人变成劝死机器的，是被他真诚相信的信仰本身。"},{"lead":"杜少卿：全书唯一把功名念头真正放下的人","body":"朝廷征辟，他装病推掉，私下理由是「放着南京这样好玩的所在，留着我在家，春天秋天，同你出去看花吃酒，好不快活」；他解《诗经》敢不依朱注，说《女曰鸡鸣》里那对「绝无一点心想到功名富贵上去，弹琴饮酒，知命乐天」的夫妇是三代君子；他公开主张「娶妾的事，小弟觉得最伤天理」。在人人往科场挤的世道里，他往反方向走——作者把理想人格放在了他身上，而高翰林教子侄的纸条是「不可学天长杜仪」。一个人是不是醒着，看众人怎么骂他就够了。"},{"lead":"答案最后写在市井","body":"贤人君子风流云散、泰伯祠颓败之后，出场的是四个市井奇人：季遐年「又不贪你的钱，又不慕你的势，又不借你的光」，敢当面骂叫他写字的御史公子；王太赢了国手，大笑「天下哪里还有个快活似杀矢棋的事」扬长而去；盖宽守着一壶茶赚一个钱的小茶馆叹「世情看冷暖，人面逐高低」；荆元白天做裁缝晚上弹琴，「又不贪图人的富贵，又不伺候人的颜色，天不收，地不管，倒不快活？」作者明说他们「不曾在朝廷旌扬之列」——真正的体面不在功名册上，在自食其力的手艺里。"}],"tlDr":"《儒林外史》用五十六个彼此衔接的故事证明一件事：功名富贵这根念头一绷紧，读书人就会当众变形——周进哭了，范进疯了，严监生抠死了，匡超人变坏了，王玉辉劝女儿饿死了。而作者给出的出路既不在科场也不在朝廷，在市井四个自食其力的奇人身上。三百年来它照出每一代人的学历焦虑：书没有过时，过时的是我们以为的「新东西」。"},"quotes":[{"text":"功名富贵无凭据，费尽心情，总把流光误。浊酒三杯沈醉去，水流花谢知何处？","src":"第一回开篇词","note":"全书题眼。吴敬梓开卷先交底：这本书写的就是为这四个字「费尽心情」的一群人，以及他们回望时「知何处」的茫然。"},{"text":"这个法却定的不好。将来读书人既有此一条荣身之路，把那文行出处都看得轻了。","src":"第一回·王冕看邸报","note":"楔子的判决书。全书批判的靶子不是某个贪官，而是制度本身——这话由全书唯一的完人说出来，等于替读者先把结论钉死，后文五十五回全是证据。"},{"text":"你看贯索犯文昌，一代文人有厄！","src":"第一回·王冕夜观天象","note":"王冕指着天上星象说出的话，借「天意」包装的直白预告：文人的厄运来自取士之法。先抑后扬的楔子由此与正文锁死。"},{"text":"噫！好了！我中了！","src":"第三回·范进中举","note":"全书最著名的五个字。一个字都没提功名富贵，却是全书对功名富贵最狠的判词——绷了三十四年的弦，断的那一声就是「好了」。"},{"text":"像你这尖嘴猴腮，也该撒泡尿自己照照……【中举之后】屠户见女婿衣裳后襟滚皱了许多，一路低着头替他扯了几十回。","src":"第三回·胡屠户前后两副面孔","note":"讽刺的教科书级标本：同一个人、同一周、对同一个人，两张脸。作者一个字的评语都没写，读者自己会笑出声。"},{"text":"老爷！只有我能知道你的心事。你是为那盏灯里点的是两茎灯草，不放心，恐费了油；我如今挑掉一茎就是了。……点一点头，把手垂下，登时就没了气。","src":"第六回·严监生临终","note":"中国文学最著名的死亡特写：用两根灯草量一个人一生的重量。妙在赵氏一语道破后「登时就没了气」——他惦记的真是灯草，还是只有这个妾懂他？两种读法都成立。"},{"text":"本该竟到监里去看他一看，只是小弟而今比不得做诸生的时候，既替朝廷办事，就要照依着朝廷的赏罚，若到这样地方去看人，便是赏罚不明了。……潘三哥所做的这些事，便是我做地方官，我也是要访拿他的。","src":"第二十回·匡超人拒探潘三","note":"全书最冷的忘恩负义：把见利忘义说成朝廷大义，把落难恩人划为该拿之人。无耻说到这个流畅程度，竟像德性。"},{"text":"但凡士君子，横了一个做官的念头在心里，便先要骄傲妻子。……你看这夫妇两个，绝无一点心想到功名富贵上去，弹琴饮酒，知命乐天，这便是三代以上修身齐家之君子。","src":"第三十四回·杜少卿说《诗经·女曰鸡鸣》","note":"杜少卿从一首情诗里读出了全书想立的生活方式：把「做官的念头」放下，日子才回到日子本身。这是作者的正面宣言，借解经说出。"},{"text":"我儿，你既如此，这是青史上留名的事，我难道反拦阻你？你竟是这样做罢。","src":"第四十八回·王玉辉劝女殉夫","note":"全书最冷的一句话：历史荣誉成了杀人的许可。紧随其后的大笑「死的好」与后来的「转觉心伤」连起来读，才明白吴敬梓写的不是恶人，是被信仰接管的人。"},{"text":"又不贪图人的富贵，又不伺候人的颜色，天不收，地不管，倒不快活？","src":"第五十五回·裁缝荆元","note":"全书的答案句。泰伯祠倒了、贤人散了之后，体面的最后定义由一个裁缝说出：自食其力，不进别人的评价体系。"}],"thoughts":{"holds":"讽刺机制全部成立。三大名场面——撞号板、中举疯、两根灯草——没有一个依赖夸张情节，全部由可核查的行为落差构成：胡屠户骂人与扯衣襟是同一个人前后几天干的事；云片糕与「几百两的药」是同一样东西前后几分钟的两种说法。它比后出的《官场现形记》一类谴责小说高明，正在于不靠猎奇事件，靠日常细节的自相矛盾。鲁迅「戚而能谐，婉而多讽」六字，是准确的技术鉴定：悲是底色，笑是表层。","doubts":["作者的药方乏力。理想寄托在杜少卿、虞育德与泰伯祠的古礼古乐上（本书前言也明说这是时代局限），而泰伯祠四十五回后直接颓败——吴敬梓自己似乎也知道乌托邦立不住，只能让裁缝荆元来收尾：批判有力，出路含糊。","女性角色的位置太窄。细读所见，女性几乎只有殉夫（王玉辉三女）、守节（王玉辉长女）与妾（赵氏）三种命运；全书被读者记住的女性只沈琼枝一人。","列传式结构牺牲了纵深。人物立起来又放下去，读者对任何人都来不及建立完整感情——这是它作为小说的美学选择，也是它影视改编困难的根本原因。","第五十六回「幽榜」为后人伪作（前言据程晋芳《怀人诗》考得原本止于五十五回），不必当作者本意；但伪作者的安排别有反讽——皇帝给全体儒林死者追赐进士，连反科举的人也被科举的逻辑收编了，姑妄读之，反添一层凉意。"],"howto":"","notes":[]},"fit":["想啃四大名著之外明清经典的古典文学爱好者","关心讽刺文学谱系、鲁迅源流的读者——鲁迅的讽刺观与这部书直接相关","正被升学、考编、「上岸」叙事裹挟的现代人：它是一面三百年前的镜子","写作者：想学白话对话写实与「不评价的讽刺」的人，这本书是最好的范本"],"unfit":["期待强主线、连贯情节的读者——列传式结构天然散点，认人成本高","想看科举逆袭爽文的——书里中举者也没几个有好下场","明清白话读着吃力又不肯放慢的人——对话是全书精华，跳读损失最大"],"takeaway":"合上书带走两件事。一句话：「横了一个做官的念头在心里」——用它照一照自己此刻焦虑的来源。一个动作：下次围观任何「上岸/没上岸」的新闻，先想想范进——热闹的是围观者，疯的是当事人；压垮人的从来不是喜事或败事本身，是那根绷了三十四年的弦。","pitfalls":["别把严监生当吝啬鬼段子讲。先读第五回再笑：他对人情挥金如土，对己才刻薄到抠灯草——这是全书最容易被一段戏文埋掉的人物。","别把「幽榜」当结尾读。真本止于第五十五回「四大奇人」，第五十六回是后人伪作，读了不算吴敬梓的意思。","别当古代官场现形记猎奇读。它的对手不是贪官，是制度与人心的合谋；只看热闹，会错过全部悲悯。","别跳过对话。胡屠户、梅玖、匡超人的台词比叙述更好看——白话对话是这本书的第一成就，只读情节梗概等于白读。"]},"book":{"title":"儒林外史","totalChars":328634,"chaptersCount":58,"sourceFile":"åæå¤å²ï¼ä¸­å½å¤å¸æå­¦åèï¼ (å´æ¬æ¢) (z-library.sk, 1lib.sk, z-lib.sk).epub"},"meta":{"version":1,"engine":"import","publishedAt":1793872084901}},"dg_10":{"digest":{"schemaVersion":2,"tag":"中国当代文学 · 茅盾文学奖","scope":"本导读细读了以下章节：第一部第一章（开篇黑馍）、第四章、第六章、第十一章（少安与润叶）、第十八章（郝红梅事件与田晓霞出场）、第二十八章（偷水事件与金俊斌之死）、第二十九章（贺秀莲）、第五十四章（第一部结尾·责任制被制止）；第二部第一章（乔伯年）、第六章（责任制到来）、第十九章与第五十四、五十五章（开头段落）；第三部第一章（铜城煤矿）、第四章（下井第一课）、第九章（晓霞井口重逢）、第十七章（王世才之死）、第三十二章与第三十三章（晓霞之死）、第三十八章、第五十三章（结尾段落）、第五十四章（全书终章全文）；其余章节依据总目录做结构概览，未逐字细读，已在骨架中标明。所有摘录均出自上述实际读到的原文。","oneLiner":"一部八十二万字的三部曲：一九七五到一九八五年，黄土高原双水村的两兄弟——哥哥孙少安把根扎进土地，弟弟孙少平把心伸向远方——在贫穷与变革的夹缝里，把「平凡」活成了不平庸。读完这篇导读约八分钟，读完原著约需四十小时。","skeleton":["开篇名场面定调：一九七五年雨雪交加的县城高中，菜分甲乙丙三等、馍分「欧洲、亚洲、非洲」——孙少平永远最后来，拿走两个黑高粱面馍，躲着人刮盆底混了雨水的剩菜汤。「慌得如同偷窃一般」：全书的起点是贫穷，更是贫穷碾过的少年自尊。","结构是沙盘式的：双水村是整个中国的微缩。孙、田、金三姓在十年间的浮沉，与县、地、省三级干部的政策博弈（田福军、乔伯年）交织推进；第一部写穷（1975-1978），第二部写变（责任制与进城），第三部写分岔（煤矿与砖窑）。每部末章都停在下一次命运转折的前一刻。","孙少安线：十三岁以全县第三名的高小成绩辍学撑家，十八岁当生产队长。他先于时代一步在一队搞承包，被县革委会定性为「资本主义复辟倾向」制止——两年后政策自己来了。砖窑从起家、崩盘到东山再起，最后掏钱重建双水村小学：他的一生就是改革史的民间注脚。","孙少平线：黑馍少年→黄原揽工汉（背石头，脊背血肉模糊）→大牙湾煤矿工人。地位一路下沉，精神世界却始终靠书和报纸撑着。揽工结束告别东关大桥头时，他管那片人市叫「我的神圣的耶路撒冷」——把苦难之地敬为圣殿，是理解这个人物的钥匙。","爱情线是三堵时代的墙：少安与润叶败给城乡门第，润叶另嫁，少安娶了不要彩礼的山西姑娘贺秀莲；少平与省报记者田晓霞是跨越身份的精神之恋，定期在古塔山杜梨树下赴约——约定被洪水掐断；十年后金秀向少平表白，他拒绝的理由是「不能耽误她的前程」。","田晓霞：全书写得最亮的人物。抗洪一线她掏出记者证「像足球裁判亮黄牌一样」逼公安局副局长用刺刀逼退三千恋家的市民，半小时后那片街区成为汪洋——三千人幸免。随后电讯传来：本报记者田晓霞，在抗洪第一线为抢救群众的生命英勇牺牲。","井下线：师傅王世才为救护组员，钢梁从腹部穿背而过，死在掌子面上。少平从此照拂师母惠英与儿子明明。全书结尾，毁容出院的少平拒绝省城、拒绝金秀，回到大牙湾——「他远远地看见，头上包着红纱巾的惠英，胸前飘着红领巾的明明，以及脖项里响着铜铃铛的小狗，正向他飞奔而来」。","结尾是双重的反高潮：少安在捐资小学落成仪式上，看见刚立起来的秀莲「嘴里鲜血喷涌」——肺癌；少平在金秀宿舍摔碎镜子，独自面对脸上那道疤，然后买一副黑镜、一件风雨衣，把表彰和记过两份文件「揉成一团」揣进衣袋。路遥拒绝给奋斗者颁发圆满：生活继续，不收官。","田福军线是改革的官方版本：从被压制的县革委会副主任，到顶着「坚决制止」的上级指示在常委会上摆出全县口粮账，再到亲手推行责任制——改革不是文件自己落地的，是有人拿乌纱帽换的。而双水村的老支书田福堂，在责任制到来时「无法接受眼前的现实，但他也没有能力拒挡这个潮流」。","全书纲藏在第一部第十八章：少平被初恋郝红梅甩了之后完成的第一次人生自我教育——「普通并不等于庸俗。他也许一辈子就是个普通人，但他要做一个不平庸的人。」哥哥与弟弟，一个在土地上不平庸，一个在煤堆里不平庸：这就是书名「平凡的世界」的全部答案。"],"core":{"items":[{"lead":"先记住时间轴：全书与改革史严格咬合","body":"第一部（1975-1978）结尾，孙少安的责任制尝试被定性为「资本主义复辟倾向」制止；第二部（1979-1982）开头，中央文件下来，正是孙少安去年「要搞而没有搞成的事」在农村普遍实行——读到这个呼应才算读懂路遥的结构：个人的先手与时代的迟到的对表，是全书的引擎。三部各以一次转折收尾，人物命运永远停在半空。"},{"lead":"「平凡」与「平庸」的分野，是全书的纲","body":"第一部第十八章，郝红梅转向顾养民、金波带人打了顾养民、顾养民挨打却不告不发——少平从这位「情敌」身上看到人格的分量，写下他人生第一次自我教育：普通不等于庸俗。此后全书所有人物都可以用这把尺子量：孙玉亭革命热情滚滚却把日子过烂，是庸；王世才一句话不多说、死在救人现场，是不平庸。"},{"lead":"孙少安：先于时代半步的人","body":"他的一生是「半步」的代价史：承包早搞了两年，挨批判；砖窑是全公社第一个，火候一到就崩盘（雇工、扩建踩在政策模糊地带）；等一切都合法了，他已是先被磨过一轮的人。路遥对他的仁慈在于给他秀莲——一个说「就是他讨吃要饭，她也愿意跟他去」的妻子；路遥对他的残忍在于结尾：他终于站在自己捐建的教室前，秀莲倒下了。"},{"lead":"孙少平：用读书守住下沉的人生","body":"从县城高中的黑馍，到黄原桥头的揽工汉，到大牙湾的煤黑——他的社会位置一路走低，但每天看报的习惯没断（在煤矿，区队的报纸常被拿去包猪头肉，他就站在矿部阅报栏前读）。揽工岁月结束时他告别东关：「我的忧伤和辛酸之地，我的幸运与幸福之邦，我的神圣的耶路撒冷」。他后来拒绝妹妹兰香和仲平安排的省城，理由清醒得近乎冷酷：「不同生活处境的人应该寻找各自的归宿。」"},{"lead":"三段感情，三种「不可能」","body":"少安与润叶是童年最暖的暖流（她偷玉米面馍塞给他、蹲在土圪崂给他的破裤子缝补丁），被城乡鸿沟无声掐断——田福堂听说少安领回媳妇时「心里十分高兴」，因为「再不要担心他女儿和少安的关系了」，一句话写尽全部阻力的来源。少平与晓霞是精神对等之恋：矿工与省报记者，井口的黑手与六月阳光下的白裙。金秀的爱情则是少平的自我认知成熟后的拒绝——他不再需要用爱情证明自己配得上什么。"},{"lead":"写苦难的克制：不喊疼，写细节","body":"王世才之死没有嚎啕：钢梁「从王世才的肚子里戳进去，一直从后背上穿出来」之后，路遥写的是矿工们一个接一个做人工呼吸接龙，以及一句「这染血的煤将变为熊熊炉火。难道我们还不能明白，为什么炉火总是那样鲜红」。晓霞之死同样不正面写：少平是在矿部阅报栏前，从报纸的「又讯」里读到死讯的——用新闻体谋杀爱情，比任何直接描写都狠。"},{"lead":"改革是有具体面孔的","body":"第一部第五十四章，路遥把少安们连夜搞出的承包合同整份抄进小说——定土地、定产量、定工、奖赔，白纸黑字像件公文；同一章里田福军在县常委会上背出全县的账：一九五三年人均生产粮九百斤，去年降到六百斤，二十年间十六个年头社员平均口粮不足三百五十斤。宏大的政策史被压缩成一份村合同和一串挨饿的数字——这是全书最硬的写法。"},{"lead":"每个配角都是完整的","body":"半脑壳田二在追悼会上捡纸花，嘟囔「世事要变了」——全书最准的谶语，两年后部长篇第二部的主题句；二队长的弟弟金俊斌为偷水送命，支部会给烈士定规格，孙玉亭激动地提议追认党员；田福堂为抗旱半夜豁坝引来决堤人命，最后自己成了被责任制甩下的人。路遥给每个配角都留了动机和体面，这是百万字长篇最见功力的地方。"}],"tlDr":""},"quotes":[{"text":"他也许一辈子就是个普通人，但他要做一个不平庸的人。在许许多多平平常常的事情中，应该表现出不平常的看法和做法来。","src":"第一部 第十八章","note":"全书纲。这句写在郝红梅事件尘埃落定之后——少平从「情敌」顾养民挨打不报仇的克制里，完成了人生第一次自我教育。书名里的「平凡」由此有了对照物。"},{"text":"在最平常的事情中都可以显示出一个人人格的伟大来！","src":"第一部 第十八章","note":"上一句的落点。路遥把伟大从传奇里搬出来，安放在日常：能不能好好对待一件所有人都可能遇到的小事。这也是他写这本大书的笔法。"},{"text":"说句反动话，如果让他单干种庄稼，他孙少安就不相信一家人连饭也吃不饱！","src":"第一部 第五十四章","note":"一个农民在心里说「反动话」——「说句反动话」这个前置语本身就是时代。少安的全部勇气与全部恐惧都压缩在这五个字里。"},{"text":"这也许是整个黄土高原农村的第一次自发性改革尝试——在短短的时间里就以失败而结束了！","src":"第一部 第五十四章","note":"第一部的收束句。路遥自己跳出来说破：这场失败不是孙家的失败，是历史迟到两年。第二部开头政策落地时，读者会回头想起这句话。"},{"text":"中间一点「白菜心」，周围全是「菜帮子」，这就是本省大自然的写照。","src":"第二部 第一章","note":"新任省委书记乔伯年车窗外的省情速写，也是全书权力的出发点：他知道白菜心外面有多少菜帮子在挨饿。改革叙事由此从最顶层启动。"},{"text":"他无法接受眼前的现实。但他也没有能力拒挡这个潮流。","src":"第二部 第六章","note":"写给田福堂——合作化的功臣、偷水的莽汉、被责任制甩下的老支书。路遥对旧时代的人物没有羞辱，只有这两句准确的判词。"},{"text":"别了，我的忧伤和辛酸之地，我的幸运与幸福之邦，我的神圣的耶路撒冷啊！你用严酷的爱的火焰，用无情而有力的锤砧，烧炼和锻打了我的体魄和灵魂。","src":"第二部 第五十四章","note":"少平告别黄原东关大桥头的揽工地。把苦力市场称作圣城——这个比喻是全书少平线的题眼：他不逃离苦难，他在苦难里认领自己。"},{"text":"这完全像远离人世间的另一个世界。当阿姆斯特朗第一脚踏上月球的时候，他感受也许莫过于此。","src":"第三部 第四章","note":"少平第一次下井。罐笼坠向地层深处、阳光消失的瞬间，用登月作比——把煤矿写成另一个星球，为后面整部井下叙事定了调。"},{"text":"生活中真正的勇士向来默默无闻，喧哗不止的永远是自视高贵的一群。","src":"第三部 第十七章","note":"井下段落里的议论。不是鸡汤，是白描之后的总结：刚写完矿工们拖着疲惫的身子升井、有家室的钻回低矮的窝棚土窑。"},{"text":"那根钢梁无情地从王世才的肚子里戳进去，一直从后背上穿出来。……血渗进煤中；血成为黑色——这染血的煤将变为熊熊炉火。难道我们还不能明白，为什么炉火总是那样鲜红……","src":"第三部 第十七章","note":"王世才之死。全书最重的牺牲被处理成一次颜色转换：红的血、黑的煤、红的炉火。不喊一声疼，但比任何嚎啕都重。"},{"text":"牺牲？我的晓霞……","src":"第三部 第三十三章","note":"少平在矿部阅报栏前读到死讯的第一反应——四个字加一个省略号。随后他「沿着铁路向东面奔跑……一直奔跑到心力衰竭」。路遥把全书最大的悲痛压进最短的句子。"},{"text":"哭，笑，都是因为欢乐。哭的人知道而笑的人并不知道，这欢乐是多少痛苦所换来的……","src":"第三部 第五十三章","note":"少安在捐资小学落成仪式上的瞬间。下一秒秀莲口吐鲜血倒下——这句是路遥提前给出的预告：所有圆满都值得怀疑。"}],"thoughts":{"holds":"「平凡不平庸」的纲全篇立得住。时间线与政策节点严格咬合：第一部末少安的承包被制止，第二部开头文件自己来了——个人的先手与时代的迟到这组张力贯穿始终。三场重大死亡（金俊斌、王世才、晓霞）没有一场是煽情堆砌，全部用职业性细节完成：追悼会的悼词格式、矿工接龙式的人工呼吸、报纸上的「又讯」。结尾的双重反高潮（秀莲的病、少平的疤与拒绝）尤其诚实：路遥没有给任何奋斗者颁发圆满奖赏，生活只是继续——这比一切励志读法都高级。","doubts":["女性角色的位置偏窄。细读所见，惠英与秀莲大多处于等待与扶持的位置；晓霞被写得近乎完美——记者、书记千金、精神伴侣三合一——她的死更像叙事需要（不掐断这层关系，少平线无法收束），而非命运必然。读者对她普遍的执念，一半是人物魅力，一半是作者的偏心。","第三部事件密度过高。矿难、洪水、殉情式的死亡、毁容接连而至，转折间隔明显短于前两部；单看第三十三章前后，悲剧像约好了排队。这未必是败笔，但读的时候能感觉到作者赶着收官。","苦难被审美化的风险。书里的苦难几乎总能兑换成精神成长——脊背的血肉换来「生活的力量和包容苦难而不屈服于命运的心脏」。作为文学成立，作为人生观要警惕：现实中的苦难不保证有这回报，别把它读成「感谢贫穷」。","篇幅负担。八十多万字中，第一部最见生活的密度，第二部改革线最锐，第三部情感线最重；若时间极有限而只读一部，选第一部会错过全书真正的题眼（第十八章的自我教育与第二部的政策落地）。"],"howto":"","notes":[]},"fit":["正在「小地方还是大城市」「扎根还是闯荡」之间摇摆的年轻人——孙家两兄弟是两种答案，不是对错","对 1975-1985 中国巨变只有课本印象、想摸到具体肌理的读者：一份村合同、一串口粮数字比通史更有手感","从小地方出来、在异乡吃过苦的人：揽工汉段落与井下段落会照见自己","研究当代文学与现实主义谱系的读者：这是理解「茅盾文学奖一代」绕不开的坐标"],"unfit":["想要快节奏、强情节的读者——百万字的体量里，大半篇幅是日常与劳作的耐心白描","期待大团圆结局的读者——三场死亡、一场绝症、一张毁容的脸，路遥不负责治愈","对「苦难叙事」本能反感的读者——这本书会被读成说教，尽管它其实一直在克制"],"takeaway":"合上书带走两件事。一句话：「普通并不等于庸俗」——用它校准你此刻对「混得不好」的恐惧：怕的该是不平庸地活着，而不是平凡地活着。一个动作：想起这本书时，别只记得「苦难励志」——记得少平在阅报栏前读报、记得田福军背出的那串口粮数字：把宏大的日子过具体，就是不平庸的第一步。","pitfalls":["别把它当成功学读。它不承诺奋斗必有回报：晓霞死了，秀莲病了，少平毁容后回到煤矿。书名里「平凡」二字不是谦辞，是结论。","别跳过开篇的黑馍段落。全书所有动机——自尊、读书、出走、回不去——的种子都在第一部第一章那碗混着雨水的剩菜汤里。","别只读第一部就停。第一部是「穷」，第二部才是「变」：责任制落地、少安翻身、少平进城揽工都在第二部；只读第一部等于只看了前半张地图。","别用「励志金句」替代原文。这本书的力气在细节与克制里——追悼会、合同书、人工呼吸接龙、阅报栏——摘句集锦会把一部社会史读薄成鸡汤。"]},"book":{"title":"平凡的世界","totalChars":810762,"chaptersCount":169,"sourceFile":"å¹³å¡çä¸ç (è·¯é¥) (z-library.sk, 1lib.sk, z-lib.sk).epub"},"meta":{"version":1,"engine":"import","publishedAt":1793949220570}}},"markdown":{"dg_6":"# 《我就是你啊：走进他人内心的7项修炼》精华导读\n\n> **范围声明**：本导读的核心知识与原文摘录，仅基于实际细读的序言、第一关三种控情绪法、后记\"记忆锦囊\"（约 2 万字）；第二~七关仅据目录概述，未引原文。\n\n---\n\n## 一句话定位\n\n一本用\"蓝王国/红王国\"寓言讲沟通的方法论书，约 10 万字。故事好读，方法硬核——读完这篇导读约需 8 分钟，能带走一整套可上手的冲突化解术。\n\n## 这本书讲什么（结构骨架）\n\n1. 蓝红两国因一条新航线爆发冲突，蓝国王子奥姆奉命化解危机，却屡战屡败。\n2. 智者指点他踏上修行之路：七关修炼，每关学会一种\"走进他人内心\"的能力。\n3. 全书方法最后浓缩在后记\"记忆锦囊\"里——一套化解纷争的 6 步法（见下文核心知识）。\n4. 第一关是全部的根基：控制自己的情绪。学不会这关，后面六关全部免谈。\n\n## 核心知识（作者的精华）\n\n**① 三重山模型**：人与人的冲突，源于从\"我\"到\"你\"之间隔着三重大山——偏见、情绪、行为。想走进对方内心，得逐山翻越：先放下\"他就是针对我\"的偏见，再平息双方情绪，最后才谈得上改变行为互动。\n\n**② 自他交换**：本书相比\"非暴力沟通\"更进一层的主张——不仅是一种沟通话术，更是一种内在视角：像看待自己一样看待对方，从超越偏见和情绪的高度，洞察对方行为背后的真实需求。\n\n**③ 化解纷争 6 步法**：前提：全程避免解释、威胁、人身攻击——\"武力对抗\"只会适得其反。\n1. 平复自己的情绪：抑制攻击冲动（最难也最重要，只需几秒）\n2. 平复他人的情绪：对方炸毛时\"几乎什么也不要做\"，只回\"同意/好的/是的\"\n3. 理解他人，而非让他人被理解：问\"你为什么不同意？\"，倾听找共识\n4. 复述对方的话：\"我说得对吗？\"——让对方知道被理解，他才会闭嘴听你说\n5. 用并列词汇提自己的观点：\"就我而言/与此同时\"，不说\"没错，但是……\"\n6. 提出双赢方案：找不到就问对方；再不行就折中；连折中没有，至少留住关系\n\n**换句话说**：前两步管情绪（自己的和对方的），中间两步管理解（先听懂、再证明你听懂了），最后两步管解决（并肩提观点、一起找方案）。顺序不能乱——90% 的冲突升级，都死在前两步。\n\n## 原文精华摘录\n\n**摘录 1**（序言）：\n> 在人类的认知天性中，从'我'到'你'，间隔着三重大山：偏见、情绪和行为。\n\n*点评：全书的理论地基，一句话。冲突的本质不是利益之争，而是三重认知屏障。*\n\n**摘录 2**（序言）：\n> 相比大家所熟知的'非暴力沟通'，本书更进一层，提出'自他交换'的概念。'自他交换'不仅是一种沟通方法，更是一种高维度的内在视角。\n\n*点评：帮你快速定位本书在沟通书谱系里的坐标——它是《非暴力沟通》的进阶版，主打视角切换而非话术。*\n\n**摘录 3**（第一关·方法一，全书最核心的一句）：\n> 情绪并不取决于您正在经历什么，而取决于您觉得自己经历了什么。\n\n*点评：情绪控制的总开关。让你生气的从来不是事件本身，而是你对事件的解读——这句话背后有一整个认知心理学的传统。*\n\n**摘录 4**（第一关·方法一，智者论情绪）：\n> 就像您可以用锤子钉钉子，也可以用它锤别人的脑袋。锤子还是那个锤子，用法却不同了。\n\n*点评：妙在反常识——情绪没有好坏，恐惧和愤怒是警示你的能量（故事里正是恐慌救了奥姆的命），要\"先听听再判断\"，而不是消除它。*\n\n**摘录 5**（第一关·方法一，引向冲突的四个误判）：\n> 当别人不同意我们的看法时，我们就会认为他想跟我们对着干……但其实（他是为自己考虑）。当有人威胁我们时，我们会认为他想让我们害怕，但其实，（是威胁者自己在害怕）。如果别人批评或者侮辱我们，我们会觉得他打算伤害我们……（其实他自己正在痛苦当中）。当别人表现出轻蔑时，我们总认为这代表他看不起我们……（其实他真正看不起的是自己）。\n\n*点评：方法一\"纠误判\"的具体清单，可直接对着用——下次被激怒时，逐条检查自己犯了哪个。*\n\n**摘录 6**（第一关·方法一，奥姆转述奶奶的话）：\n> 世上并没有坏人，只有受苦的人罢了。\n\n*点评：全书最柔软的一句，也是\"自他交换\"的民间版表达。攻击性强的人，多半自己正在痛。*\n\n**摘录 7**（后记·记忆锦囊，第 2 步——全书最反直觉的招）：\n> 尤其不要和对方说'你冷静点儿！'或者'你生气是没有用的！'……你可以用'同意''好的''是的''没错'等来回复对方……对方的情绪起初会有些波动，但随后便会逐渐稳定，直到最后慢慢平复。\n\n*点评：与直觉完全相反——对方发火时，一句\"你冷静点\"是火上浇油，而\"你说得对\"反而能让对方几秒内熄火。这是全书实操价值最高的一招。*\n\n**摘录 8**（后记·记忆锦囊，第 4 步复述）：\n> 之后问对方'我说得对吗？'。这样你会收获意想不到的神奇效果——对方会眉头上扬，露出满意的笑容，大赞一声'对啊！'。而后他便会闭上嘴，听你说话。\n\n*点评：复述的双重作用写得极诚实——既检验你是否真懂，又给足对方\"被理解\"的体验。人只有感到被理解后，才愿意听你说。*\n\n## 思考与辨析\n\n- **成立之处**：6 步法顺序设计有坚实的心理学逻辑——情绪不解决，讲道理无效；不理解对方，方案谈不拢。第 2 步的\"同意\"策略与认知失调理论暗合：对方攻击得不到对抗性回应，情绪自然回落。\n- **存疑之处**：① \"同意/好的\"在权力严重不对等或对方恶意利用时，可能被解读为软弱退让，反而助长侵犯； ② 长期关系中若总是一方在\"自他交换\"，会造成单向透支——书里没细讲\"对方永远不肯翻山过来怎么办\"（此点基于细读范围的判断，后续章节可能有涉及）； ③ \"纠误判\"在盛怒当下最难执行——恰好最需要它的时刻，最用不出来。\n- **怎么落地**：不必七关全学。先只练两招——第 2 步的\"好的/同意\"（成本最低、见效最快）和摘录 5 的四误判清单（被激怒时逐条自查）。这两招练成习惯后，再回头看后面的关。\n\n## 适合谁读 / 不适合谁\n\n- **适合**：经常陷于人际冲突（职场、家庭、客户）的人；读过《非暴力沟通》想进阶的人；喜欢寓言体、读不进理论书的人。\n- **不适合**：想要学术论证与实证数据的人（本书是经验方法，不提供研究引用）；期待\"话术模板库\"的人（它给的是内在视角，不是台词）。\n\n## 读完能带走什么\n\n一套 6 步冲突化解流程 + 一个情绪自查清单 + 一句可贴在工位的反直觉口诀：对方炸毛时，别说\"你冷静点\"，说\"你说得对\"。 至少能改变一个行为：下次冲突升级前，先走第 1、2 步，再开口讲道理。\n\n## 避坑\n\n- 别把\"自他交换\"理解成无原则退让——书的前提是对方也在这段关系里，恶意博弈场景需另行判断。\n- 6 步法看着简单，第 1 步（平复自己）才是真功夫，跳过它直接背话术会显得虚伪，效果归零。\n- 本书是寓言体，情节是方法的外壳；只看故事不读\"记忆锦囊\"，等于白读。\n","dg_7":"# 《Theo of Golden》精华导读\n\n> **范围声明**：本导读的主线、身世与结局均基于实际细读的章节：序言、第 1、4、5、23、24、33、57 章全文，第 62 章开头与尾声（约 6 万词中的约 2.5 万词）；其余约 45 章仅据总目录与章首预览概述，未引原文。英文原著，摘录保留英文原文并附中文大意。\n\n---\n\n## 一句话定位\n\n一位隐去姓名的葡萄牙老人在美国小镇住了一年，用一墙铅笔画像和一封封手写信，把一个个普通人「看见」——直到他为保护一个无家可归的女人而死于非命。一本关于匿名之善、慷慨与尊严的疗愈系小说。\n\n## 这本书讲什么（结构骨架）\n\n1. 序言：Theo 在金色镇只住一年，「却足以形成一股自己的水流，把别人卷进去」。\n2. 第 1–3 章：神秘老人从纽约来到南方小镇 Golden，独居、漫步、匿名，对一切保持孩童式好奇。\n3. 第 4–5 章：第一封「奇怪的信」寄给会计师 Minnette——有人买下了她叔叔 Asher 画的她的肖像，要当面送她；律师丈夫将信将疑陪她赴约。\n4. 第 6–22 章：赠予（bestowal）成体系：每周从咖啡店 Chalice 的画像墙买画送人，手写信约人在喷泉见面；受赠者扩至流浪女 Ellen、清洁工 Kendrick 与病中的女儿 Lamisha。\n5. 第 23 章：名字之谜——「叫我 Theo 就好」，全镇放弃追问，选择凭果实判断人。\n6. 第 24 章：赠画加速至每周两三幅；给 Ellen 的信刻意用最简单的词写成。\n7. 第 33 章：身世闪回——1942 年葡萄牙杜罗河葡萄园的十岁男孩，里斯本美术馆之行被艺术「附魔」，人生从此分为里斯本前/后。\n8. 第 34–56 章：一年四季的友情网（大提琴手 Simone、街头乐手 Basil、小狗 Tony……），赠予持续，Simone 受伤的手奇迹痊愈。\n9. 第 57–59 章：深夜三个醉汉抢 Ellen 的帽子与自行车，Theo 下楼干预，被害身亡；消息震彻小镇。\n10. 第 60–62 章 + 尾声：知情人 Ponder 交付遗物与遗赠；凶手始终未查明；小镇的改变持续发酵——Minnette 给儿子取名 Theo。\n\n## 核心知识（作者的精华）\n\n**赠予的本质是「看见」**：Theo 送的从来不是画像本身——画家 Asher 画的是镇上真实的人，他买下画像送还本人，等于宣告「你值得被画下来、被记住」。对无名无姓的流浪女 Ellen、对大学清洁工 Kendrick，这份「被看见」比任何施舍都重。\n\n**匿名行善是一套完整设计**：无姓、无邮箱、无实名信用卡（用 PH Ltd 的卡付款），一切经由律师 Ponder 代理。匿名不是故弄玄虚：它让受赠者无法还人情，礼物保持纯粹；也逼着小镇「凭果实判断人」。\n\n**手写信是仪式的核心**：每次赠予都从一封钢笔手写、亚麻纸的信开始。给 Ellen 的信刻意用最短的句子、最简单的词——写信本身就是把对方当回事。\n\n**慷慨需要被认真运营**：Theo 不是心血来潮：画像清单、约会日历（周二 Bob 七点）、助手 Gidley 送信、频率从每周一幅加速到两三幅。善意像项目一样被管理。\n\n**艺术是「如何活」的答案**：第 33 章里斯本美术馆的顿悟——「音乐是声音的画像」。美构成了 Theo 一生的操作系统，他后来对大提琴手 Simone 的投入是同一件事的延续。\n\n**「把生活过小，反而活得比谁都大」**：尾声引镇报记者 Katherine 的话作结：他选择 small，却 larger than life。一年、一个镇、每周几幅画——规模极小，穿透力极强。\n\n**结局不给解药**：凶手未查明，真名未完全揭晓（Ponder 早已知道，书未和盘托出）。作者给的谜底不是「他是谁」，而是「他做了什么之后，小镇变成了什么样」。\n\n**换句话说**：一个匿名老人用「买下你的画像送给你」这一件事，把一座小镇的人一个个点亮；善意不在于规模，而在于让对方确信自己值得被看见。\n\n## 原文精华摘录\n\n**摘录 1**（序言）：\n> Only a year. Not so long. But long enough to create a current of his own and to catch others in it.\n\n*点评：全书题眼。中文大意：只有一年。不长，但足以形成一股自己的水流，把别人卷进去。一个人就是一股水流。*\n\n**摘录 2**（第 1 章）：\n> I'm sorry, dear fellow, but I have nothing to give you this morning. Perhaps tomorrow? And stop complaining. Be glad you're not in New York today.\n\n*点评：对乞食小鸟说话，人物一页立住：认真对待每一个小生命，还有一点幽默。*\n\n**摘录 3**（第 5 章）：\n> Just think, we might actually meet a sincerely kind human being. There don't seem to be many of those around these days.\n\n*点评：Minnette 决定赴约的理由，也是全书的时代注脚：真诚的善成了稀缺品。*\n\n**摘录 4**（第 23 章）：\n> The unspoken consensus of the neighborhood was that he would be judged by his fruits, by what could be seen with their own eyes. ... Or so they thought.\n\n*点评：全镇对匿名者的信任逻辑——凭果实判断人。结尾的「Or so they thought（他们原以为是）」为结局埋下钩子。*\n\n**摘录 5**（第 24 章（致 Ellen 的信））：\n> I bought your portrait and would like you to have it. It is a gift. You do not have to pay anything for it or do anything in exchange. ... I am an old man. I will be wearing a green hat.\n\n*点评：刻意用最简单的词写给流浪女：无附加条件、不居高临下，把尊严还给对方。*\n\n**摘录 6**（第 33 章）：\n> His life, thereafter, was clearly delineated into Theo-before-Lisbon and Theo-after-Lisbon.\n\n*点评：一次美术馆之行劈开一生。美对人的塑造力，是理解 Theo 全部行为的钥匙。*\n\n**摘录 7**（第 62 章）：\n> It was an acknowledgment, a tribute, to Theo's gift of sight. A eulogy.\n\n*点评：对逝者最好的悼念，是他教会别人「怎么去看」。Asher 拿起放大镜端详蛋壳那一幕，是全书最安静的告别。*\n\n## 思考与辨析\n\n- **成立之处**：把赠予设计成「看见」在心理学上站得住：被看见（recognition）是比物质更稀缺的需求；Ellen 从受赠、遇袭到振作经营 featherwood 小生意，Kendrick 升职、Lamisha 长大想当康复师——尾声用一连串后续证实了这种善的复利。\n- **存疑之处**：① 匿名善行的前提是极端财富与法律护航（Ponder 全权代理、私人飞机），普通人难以复制其形式——可复制的是心意而非排场； ② Theo 的动机只有身世碎片，神秘化略重，接近「圣人传记」的写法，人物有被神化之嫌； ③ 结尾暴力来得突然、凶手永不查明——是文学选择，但想要因果闭环的读者会卡在这里。\n- **怎么落地**：把「赠予」缩小到可操作：这周为身边某个不被注意的人做一件专属的、不要求回报的事——Theo 式的「买下那张画像送给你」。另一条是画家 Asher 的启示：把你的手艺变成看见他人的工具。\n\n## 适合谁读 / 不适合谁\n\n- **适合**：喜欢《解忧杂货店》《一个人的朝圣》式温柔叙事的人；对「匿名之善」「被看见」主题感兴趣的人；想找一本语言平实、适合睡前安静读的英文小说的人\n- **不适合**：想要强情节、快节奏的人；期待身世谜团有完整解答的人（谜底部分留白）；对挽歌语调、宗教意味敏感的人\n\n## 读完能带走什么\n\n记住一个动作：Theo 式的赠予 = 购买一份「专属的看见」，并无条件送出。合上书可做的一件事：本周为一个人手写一封信（或一条认真写的长消息），只送，不解释。\n\n## 避坑\n\n- 别把它当「行善指南」读——书的力量在文学呈现，不在方法论；也别期待悬疑式谜底，作者要给的不是 Theo 是谁，而是他做了什么之后，小镇变成了什么样。\n","dg_8":"# 《活着》精华导读\n\n> **范围声明**：本导读基于全书细读：五篇自序（中文版、韩文版、日文版、英文版、麦田新版）与正文全部十节（约 8.8 万字）。所有摘录均出自实际读到原文的段落，并标注出处。\n\n---\n\n## 一句话定位\n\n一个败光家产的少爷，用一生亲手埋葬了父母、妻子、儿女、女婿和外孙，最后与一头也叫福贵的老牛相依为命。余华写的不是苦难本身，而是一个人如何在苦难里保住讲述自己一生的平静。\n\n## 这本书讲什么（结构骨架）\n\n1. 五篇自序：交代写作原点——美国民歌《老黑奴》，以及那句题眼「人是为活着本身而活着的」。\n2. 1992 年夏天，采风的「我」在乡间遇见老人福贵；他对着老牛把一家人的名字一个个喊出来，骗牛说还有别的牛在耕田。\n3. 少爷时代：吃喝嫖赌、骑妓女向丈人请安、打怀着孕跪地劝他回家的家珍，被龙二设局输光一百多亩地和房产。\n4. 父亲从村口粪缸上摔下而死；丈人抬着花轿接走家珍；福贵租龙二的五亩地学做农活，长根沦为乞丐。\n5. 被抓壮丁：进城请郎中途中被国军抓走，渡江后被围，老全中弹、春生失踪；被俘后领两个馒头、拿了盘缠回家，母亲已死，凤霞高烧后失语。\n6. 土改：龙二被枪毙，临刑喊「福贵，我是替你去死啊」；福贵分到五亩地，家珍带着有庆回来。\n7. 人民公社与大跃进：砸锅、食堂、煮钢铁、老孙头的屋子被烧；饥荒里家珍得软骨病，揣着一袋米从娘家回来。\n8. 有庆之死：为救县长女人献血被抽干，县长竟是当年的春生；福贵夜里把儿子埋在自己爹娘坟前，家珍终究猜到了。\n9. 凤霞出嫁：偏头二喜带着二十多人、一车彩礼风光迎娶；凤霞难产大出血而死，留下儿子苦根。\n10. 家珍之死 → 二喜被水泥板夹死 → 苦根吃豆子撑死；福贵买下待宰的老牛，也叫福贵，一人一牛活成了「两个老不死」。\n\n## 核心知识（作者的精华）\n\n**「活着」的力量是忍受，不是喊叫**：韩文版自序里余华把「活着」拆开给外国读者看：这个词在中国语言里的力量，不来自进攻也不来自呐喊，而来自忍受——忍受生命赋予的责任，忍受现实给的幸福与苦难、无聊与平庸。全书没有一句控诉，福贵的语调始终像在讲别人的农事，这种平静本身就是力量。\n\n**生活是感受，幸存是看法**：日文版自序回答了意大利中学生的问题：为什么极端环境里还写「生活」而不是「幸存」？答案在叙述人称——福贵用第一人称讲述自己，不需要旁人的看法，只需要自己的感受。若换成第三人称，他就成了读者眼中的「苦难幸存者」。余华还交代了技术细节：最初用旁观者视角写，难以为继；改让福贵自己开口，写作一下畅通了。\n\n**苦难不是重点，讲述的平静才是**：福贵讲女儿被送人时嘿嘿笑，讲自己挨爹的布鞋时得意，讲家珍「死得很好，死得平平安安、干干净净」。全文最大的反常不是死了多少人，而是叙述者提起这些时的温和与幽默——这才是这本书区别于「苦难展览」的地方。\n\n**命运是偶然的，活下来的人只能领受**：输光家产本是灾祸，却让他躲过了枪毙（龙二替他去死）；被抓壮丁九死一生，回来反而分到了地。福贵摸着胳膊对自己说「这下可要好好活了」。书里没有因果报应，只有一连串偶然，人只能在偶然里决定怎么活。\n\n**亲情是唯一没有被夺走的财产**：一百多亩地输光了，绸衣穿不惯，唯一留得住的是家珍那句「我也不想要什么福分，只求每年都能给你做一双新鞋」。凤霞被领走两次都跑回来，福贵背着她往回走时说「就是全家都饿死，也不送凤霞回去」——这是全书最硬的骨头。\n\n**叫名字，是把死去的人留住**：开篇最动人的设计：福贵对牛喊「二喜、有庆不要偷懒，家珍、凤霞耕得好，苦根也行啊」，他骗牛说还有别的牛在耕田，其实是把五个死去的亲人一个个叫回田里。结尾他又对牛报账：今天谁耕了多少。记忆不是纪念碑，是每天下地时的一次点名。\n\n**体面是苦难里唯一能自己决定的事**：家珍临终前拒绝麻袋包身（「麻袋上都是死结，我到了阴间解不开」），要一块干净布、要洗净身子；她把所有破烂衣服堆在床边拆缝，说「有活干心里踏实」。余华不给他们意义，只给他们体面——这已经是一个人能守住的全部。\n\n**不争，是他活到最后的原因**：结尾福贵自述：龙二、春生都只风光了一阵，到头来命都丢了，「做人还是平常点好，争这个争那个，争来争去赔了自己的命」。这话不是成功学，是一个把亲人都送走的人对「活着」的最终理解：不争不是认输，是不再拿命去换。\n\n**换句话说**：余华让一个失去全部亲人的人来讲自己的一生，从而证明：活着不需要外部的理由，也不需要旁人的同情——它只需要一个人还能平静地、甚至带点得意地把日子讲下去。\n\n## 原文精华摘录\n\n**摘录 1**（中文版自序（1993））：\n> 人是为活着本身而活着的，而不是为了活着之外的任何事物所活着。\n\n*点评：全书的题眼。余华说这句话是「写作过程让我明白」的，不是预先设定的主题——先有福贵，后有这句话。*\n\n**摘录 2**（韩文版自序（1996））：\n> 作为一个词语，「活着」在我们中国的语言里充满了力量，它的力量不是来自于喊叫，也不是来自于进攻，而是忍受，去忍受生命赋予我们的责任，去忍受现实给予我们的幸福和苦难、无聊和平庸。\n\n*点评：最准确的自我注解。注意「无聊和平庸」——他要忍的不只是惨，还有漫长的不精彩。*\n\n**摘录 3**（日文版自序（2002））：\n> 生活是一个人对自己经历的感受，而幸存往往是旁观者对别人经历的看法。\n\n*点评：一句话说清叙述人称为何决定全书意义。读这本书时，你站在福贵的位置还是旁观者的位置，看到的是两本不同的书。*\n\n**摘录 4**（正文开篇（福贵赶牛时唱的歌谣））：\n> 皇帝招我做女婿，路远迢迢我不去。\n\n*点评：全书第一个声音就是这句自鸣得意的拒绝。一个一无所有的老人，先给你唱一句「我不去当驸马」——气派与穷困的反差，就是福贵的底色。*\n\n**摘录 5**（正文开篇（福贵解释为何对牛喊一串名字））：\n> 我怕它知道只有自己在耕田，就多叫出几个名字去骗它，它听到还有别的牛也在耕田，就不会不高兴，耕田也就起劲啦。\n\n*点评：全书最狠也最温柔的一笔：他骗的是牛，安放的是自己——那些名字全是死去的家人。*\n\n**摘录 6**（正文·间奏（福贵对插秧女人说的话））：\n> 做人不能忘记四条，话不要说错，床不要睡错，门槛不要踏错，口袋不要摸错。\n\n*点评：浪子回头后的人生总结，全是消极戒律。他一生做错的第一条就是「床睡错」，所以这句听着像玩笑，其实是忏悔。*\n\n**摘录 7**（正文·有庆死后）：\n> 月光照在路上，像是撒满了盐。\n\n*点评：十三个字，写尽丧子之痛——不写哭，写路；盐既白又咸，落在伤口上。中国当代文学最著名的比喻之一。*\n\n**摘录 8**（正文·间奏（福贵对采风人说的话））：\n> 家珍死得很好，死得平平安安、干干净净，死后一点是非都没留下，不像村里有些女人，死了还有人说闲话。\n\n*点评：用「很好」形容妻子的死，初读刺耳，再读才懂：在一个什么都被夺走的人生里，「死得干净」是他能替她守住的最后一件东西。*\n\n**摘录 9**（正文结尾（福贵远去的歌声））：\n> 少年去游荡，中年想掘藏，老年做和尚。\n\n*点评：三句民谣收束一生：游荡、贪求、放下。福贵没有做和尚，他只是把一家人的名字都记着，一个人过完了余生。*\n\n## 思考与辨析\n\n- **成立之处**：「第一人称让苦难变成日子」这个判断站得住，因为余华在三个不同年份的自序里反复确认过同一条技术路径：最初用旁观者视角写作难以为继，改成福贵自述后「没有任何阻挡」。这不是事后美化，而是可交叉印证的创作事实。也正因如此，书里那些近乎欢快的细节（对牛报账、跟插秧女人开玩笑、给苦根讲鸡变牛）才不显得突兀——它们是叙述者的性格，不是作者硬加的温情。\n- **存疑之处**：① 死亡密度过高：父母、妻子、儿子、女儿、女婿、外孙，七口人几乎全部非正常死亡，读到后半段读者容易从共情滑向麻木，苦难有被「清点」的风险。 ② 「忍受」被抬得太高，容易被误读为对苦难的顺从甚至赞美。全书没有一次追问「谁该负责」——有庆之死明明是医疗事故与权力冷漠，文本却停在福贵的悲痛里，这是文学选择，也是思想上的回避。 ③ 女性承担了全部沉默的付出：家珍逆来顺受到底，凤霞又聋又哑、死时连叫喊都不可能。她们的死推动情节，却几乎没有自己的视角——这一点在今天的阅读里值得警惕。\n- **怎么落地**：把「福贵视角」用在自己身上：挑一件你认定的倒霉事，先用旁观者口吻写 300 字（会写成控诉或抱怨），再换成当事人自述写 300 字（会出现细节、幽默、甚至得意）。两稿并排看，你会亲身验证余华那句「生活是感受，幸存是看法」——这也是把这本书从「读过」变成「用上」的最短路径。\n\n## 适合谁读 / 不适合谁\n\n- **适合**：想读中国当代文学经典、能承受沉重题材的读者；写作者 / 内容创作者：想看清叙述人称如何改变一本书的意义；经历过丧失、想找一种平静讲述方式的人\n- **不适合**：近期正处于丧亲、抑郁或情绪低谷的人（连续死亡描写可能造成二次伤害）；想找「励志」「正能量」解读的人——它不给安慰，只给承受；偏爱强情节、反转、多线叙事的读者\n\n## 读完能带走什么\n\n记住一句话：生活是属于每个人自己的感受，不属于任何别人的看法。合上书可做的一件事：找家里还健在的长辈，问一句「你这辈子最难的那一年是怎么过的」，把他的话录下来——这就是福贵对采风人做的事，也是这本书教人做的唯一一件具体的事。\n\n## 避坑\n\n- 别把福贵当「苦难榜样」去歌颂忍受，那会把一本反抗遗忘的书读成劝人认命的书。\n- 别把它读成「好死不如赖活着」的鸡汤：余华写的是一个人如何保住讲述自己一生的权利，不是教人放弃追问。\n- 别跳过五篇自序——它们不是附属品，是作者亲手给出的解读钥匙，尤其日文版那篇直接决定了你怎么看整本书。\n","dg_9":"# 《儒林外史》精华导读\n\n> **范围声明**：本导读细读了以下回目与段落：前言、第一回（楔子·王冕）、第二回（周进）、第三回（范进中举）、第五回与第六回（严氏兄弟）、第十四回（马二先生游西湖段落）、第十六回与第二十回（匡超人）、第三十四回（杜少卿）、第四十八回（王玉辉）、第五十五回（四大奇人）、第五十六回（幽榜，据前言考据为后人伪作，仅作参考）；其余回目依据总目录与各回回目做结构概览，未逐字细读，已在骨架中标明。所有摘录均出自上述实际读到的原文。\n\n---\n\n## 一句话定位\n\n中国第一部真正意义上的长篇讽刺小说：五十六回没有主角，只有一面照了三百年的镜子——读书人一旦横下「功名富贵」的念头，会当众活成什么样子。约三十三万字的明清白话章回体，通勤读完全书约需十小时，读完这篇导读约八分钟。\n\n## 这本书讲什么（结构骨架）\n\n1. 开篇一首词点题：「功名富贵无凭据，费尽心情，总把流光误」——全书唯一的贯穿线不是人物，是这四个字。\n2. 楔子借王冕立标尺：放牛娃自学成才、拒官避祸，断言八股取士之法一定，「一代文人有厄」——制度判词先于故事。\n3. 周进撞号板：六十岁考不进学的老童生，在贡院一头撞向号板放声大哭；商人凑二百两银子替他捐监，次年高中御史——「哭」与「中」的荒诞接力。\n4. 范进中举：考了三十多年，中举当场喜疯；胡屠户前一天骂他「尖嘴猴腮」，当天低着头替他扯了几十回衣襟——讽刺喜剧的巅峰一回。\n5. 严氏兄弟：严贡生横行碰瓷（把几文钱的云片糕讹成几百两的药、强立嗣夺产），严监生坐拥十多万两却两根灯草咽不下气。\n6. 名士群像：马二先生游西湖满眼只见食物与女客；莺脰湖、莫愁湖高会此起彼伏——假名士拿风雅给功名当点缀。\n7. 匡超人：全书最完整的堕落弧线——夜里跪着捧父亲出恭的孝子，一步步变成停妻再娶、拒探恩人、自吹「先儒匡子之神位」的「名士」。\n8. 理想寄托：杜少卿装病辞征辟、携妻游山、主张「娶妾伤天理」；虞育德、庄绍光与泰伯祠大祭——作者亲手造了一座精神庙宇。\n9. 庙宇倾颓：泰伯祠屋山倒了半边、儿孩在门口踢球；王玉辉劝女殉夫大笑「死的好」——礼教吃人，理想落空。\n10. 结局落在市井：会写字的、下棋的、开茶馆的、弹琴的四个市井奇人，才是作者眼里真正的贤人——「不曾在朝廷旌扬之列」。（第五十六回「幽榜」系后人伪作）\n\n## 核心知识（作者的精华）\n\n**主线不是故事，是「功名富贵」四个字**：五十六回没有贯穿主角，人物一环传一环：周进提携范进，范进连着张静斋，张静斋惹出汤知县……鲁迅评它是「集诸碎锦，合为帖子，虽非巨幅，而时见珍异」。把碎锦缀起来的针线只有一根：谁横了求功名富贵的念头，谁就开始变形。换句话说，这不是一部小说，是「学历社会」的完整纪录片。\n\n**讽刺从不出面骂人，让落差自己开口**：胡屠户中举前骂女婿「癞蛤蟆想吃起天鹅肉」「尖嘴猴腮，也该撒泡尿自己照照」，中举当天「见女婿衣裳后襟滚皱了许多，一路低着头替他扯了几十回」；严贡生的船工吃了他几片云片糕，他立刻说成「费了几百两银子合的药」。作者一句评论都没有，判决完全留给读者——这正是鲁迅说的「婉而多讽」：证据呈堂，不判而判。\n\n**科举画出的圈，比功名本身更伤人**：进学与不进学之间隔着的不是学问，是整个社会的脸色：梅玖以「老友不同小友序齿」的规矩当众羞辱六十岁的先生周进；王举人鸡鸭满桌吃剩一地骨头，周进「昏头昏脑扫了一早晨」还要替他挨造谣；范进中举当天，家里正等他卖掉一只母鸡换米救命。功名未到手时人不如鸡，到手的一瞬立刻翻盘——这个落差就是全书反复奏响的和弦。\n\n**匡超人：一个好人被环境层层加码教坏**：第十六回他半夜跪在床前捧着瘫痪父亲的腿让其出恭、四更天起来杀猪磨豆腐，是全书最动人的孝子。然后一路被「教」：马二先生教他把举业当正业，杭州名士圈教他吹牛抬轿，衙门潘三教他弄钱办事。到第二十回，恩人潘三下狱，他说「既替朝廷办事，就要照依着朝廷的赏罚」拒绝探监；停妻再娶时拿「戏文上说的蔡状元招赘牛相府，传为佳话，这有何妨」自我说服。堕落不是突变，每一步都有当时听来「合理」的理由。\n\n**严监生：被一句戏读埋没的最复杂人物**：他是家私十多万两的监生：儿子要吃肉只肯「在熟切店内买四个钱的哄他就是了」，病重舍不得吃人参，临死惦记两茎灯草「恐费了油」。但妻子办丧事花四五千两银子毫无犹豫，给两位舅爷送银子一送再送（每位一百两、再加五十两、病中又各两封）。对己刻薄到抠灯草，对人情世故挥金如土——他不是吝啬鬼寓言，是被宗法社会的人情账单活活拖垮的可怜人。先读第五回再笑他。\n\n**王玉辉：礼教吃人时，吃人的和被吃的都不知道疼**：老秀才王玉辉鼓励绝食殉夫的女儿「这是青史上留名的事，我难道反拦阻你」，女儿饿死八日而死，他仰天大笑「死的好！死的好！」；可入祠旌表之后他「转觉心伤」，庆功宴不肯去坐上席，后来在苏州看见一个穿白衣的少年妇人便「想起女儿，热泪直滚」。他不是坏人——这正是最可怕处：把一个老实人变成劝死机器的，是被他真诚相信的信仰本身。\n\n**杜少卿：全书唯一把功名念头真正放下的人**：朝廷征辟，他装病推掉，私下理由是「放着南京这样好玩的所在，留着我在家，春天秋天，同你出去看花吃酒，好不快活」；他解《诗经》敢不依朱注，说《女曰鸡鸣》里那对「绝无一点心想到功名富贵上去，弹琴饮酒，知命乐天」的夫妇是三代君子；他公开主张「娶妾的事，小弟觉得最伤天理」。在人人往科场挤的世道里，他往反方向走——作者把理想人格放在了他身上，而高翰林教子侄的纸条是「不可学天长杜仪」。一个人是不是醒着，看众人怎么骂他就够了。\n\n**答案最后写在市井**：贤人君子风流云散、泰伯祠颓败之后，出场的是四个市井奇人：季遐年「又不贪你的钱，又不慕你的势，又不借你的光」，敢当面骂叫他写字的御史公子；王太赢了国手，大笑「天下哪里还有个快活似杀矢棋的事」扬长而去；盖宽守着一壶茶赚一个钱的小茶馆叹「世情看冷暖，人面逐高低」；荆元白天做裁缝晚上弹琴，「又不贪图人的富贵，又不伺候人的颜色，天不收，地不管，倒不快活？」作者明说他们「不曾在朝廷旌扬之列」——真正的体面不在功名册上，在自食其力的手艺里。\n\n**换句话说**：《儒林外史》用五十六个彼此衔接的故事证明一件事：功名富贵这根念头一绷紧，读书人就会当众变形——周进哭了，范进疯了，严监生抠死了，匡超人变坏了，王玉辉劝女儿饿死了。而作者给出的出路既不在科场也不在朝廷，在市井四个自食其力的奇人身上。三百年来它照出每一代人的学历焦虑：书没有过时，过时的是我们以为的「新东西」。\n\n## 原文精华摘录\n\n**摘录 1**（第一回开篇词）：\n> 功名富贵无凭据，费尽心情，总把流光误。浊酒三杯沈醉去，水流花谢知何处？\n\n*点评：全书题眼。吴敬梓开卷先交底：这本书写的就是为这四个字「费尽心情」的一群人，以及他们回望时「知何处」的茫然。*\n\n**摘录 2**（第一回·王冕看邸报）：\n> 这个法却定的不好。将来读书人既有此一条荣身之路，把那文行出处都看得轻了。\n\n*点评：楔子的判决书。全书批判的靶子不是某个贪官，而是制度本身——这话由全书唯一的完人说出来，等于替读者先把结论钉死，后文五十五回全是证据。*\n\n**摘录 3**（第一回·王冕夜观天象）：\n> 你看贯索犯文昌，一代文人有厄！\n\n*点评：王冕指着天上星象说出的话，借「天意」包装的直白预告：文人的厄运来自取士之法。先抑后扬的楔子由此与正文锁死。*\n\n**摘录 4**（第三回·范进中举）：\n> 噫！好了！我中了！\n\n*点评：全书最著名的五个字。一个字都没提功名富贵，却是全书对功名富贵最狠的判词——绷了三十四年的弦，断的那一声就是「好了」。*\n\n**摘录 5**（第三回·胡屠户前后两副面孔）：\n> 像你这尖嘴猴腮，也该撒泡尿自己照照……【中举之后】屠户见女婿衣裳后襟滚皱了许多，一路低着头替他扯了几十回。\n\n*点评：讽刺的教科书级标本：同一个人、同一周、对同一个人，两张脸。作者一个字的评语都没写，读者自己会笑出声。*\n\n**摘录 6**（第六回·严监生临终）：\n> 老爷！只有我能知道你的心事。你是为那盏灯里点的是两茎灯草，不放心，恐费了油；我如今挑掉一茎就是了。……点一点头，把手垂下，登时就没了气。\n\n*点评：中国文学最著名的死亡特写：用两根灯草量一个人一生的重量。妙在赵氏一语道破后「登时就没了气」——他惦记的真是灯草，还是只有这个妾懂他？两种读法都成立。*\n\n**摘录 7**（第二十回·匡超人拒探潘三）：\n> 本该竟到监里去看他一看，只是小弟而今比不得做诸生的时候，既替朝廷办事，就要照依着朝廷的赏罚，若到这样地方去看人，便是赏罚不明了。……潘三哥所做的这些事，便是我做地方官，我也是要访拿他的。\n\n*点评：全书最冷的忘恩负义：把见利忘义说成朝廷大义，把落难恩人划为该拿之人。无耻说到这个流畅程度，竟像德性。*\n\n**摘录 8**（第三十四回·杜少卿说《诗经·女曰鸡鸣》）：\n> 但凡士君子，横了一个做官的念头在心里，便先要骄傲妻子。……你看这夫妇两个，绝无一点心想到功名富贵上去，弹琴饮酒，知命乐天，这便是三代以上修身齐家之君子。\n\n*点评：杜少卿从一首情诗里读出了全书想立的生活方式：把「做官的念头」放下，日子才回到日子本身。这是作者的正面宣言，借解经说出。*\n\n**摘录 9**（第四十八回·王玉辉劝女殉夫）：\n> 我儿，你既如此，这是青史上留名的事，我难道反拦阻你？你竟是这样做罢。\n\n*点评：全书最冷的一句话：历史荣誉成了杀人的许可。紧随其后的大笑「死的好」与后来的「转觉心伤」连起来读，才明白吴敬梓写的不是恶人，是被信仰接管的人。*\n\n**摘录 10**（第五十五回·裁缝荆元）：\n> 又不贪图人的富贵，又不伺候人的颜色，天不收，地不管，倒不快活？\n\n*点评：全书的答案句。泰伯祠倒了、贤人散了之后，体面的最后定义由一个裁缝说出：自食其力，不进别人的评价体系。*\n\n## 思考与辨析\n\n- **成立之处**：讽刺机制全部成立。三大名场面——撞号板、中举疯、两根灯草——没有一个依赖夸张情节，全部由可核查的行为落差构成：胡屠户骂人与扯衣襟是同一个人前后几天干的事；云片糕与「几百两的药」是同一样东西前后几分钟的两种说法。它比后出的《官场现形记》一类谴责小说高明，正在于不靠猎奇事件，靠日常细节的自相矛盾。鲁迅「戚而能谐，婉而多讽」六字，是准确的技术鉴定：悲是底色，笑是表层。\n- **存疑之处**：作者的药方乏力。理想寄托在杜少卿、虞育德与泰伯祠的古礼古乐上（本书前言也明说这是时代局限），而泰伯祠四十五回后直接颓败——吴敬梓自己似乎也知道乌托邦立不住，只能让裁缝荆元来收尾：批判有力，出路含糊。 女性角色的位置太窄。细读所见，女性几乎只有殉夫（王玉辉三女）、守节（王玉辉长女）与妾（赵氏）三种命运；全书被读者记住的女性只沈琼枝一人。 列传式结构牺牲了纵深。人物立起来又放下去，读者对任何人都来不及建立完整感情——这是它作为小说的美学选择，也是它影视改编困难的根本原因。 第五十六回「幽榜」为后人伪作（前言据程晋芳《怀人诗》考得原本止于五十五回），不必当作者本意；但伪作者的安排别有反讽——皇帝给全体儒林死者追赐进士，连反科举的人也被科举的逻辑收编了，姑妄读之，反添一层凉意。\n\n## 适合谁读 / 不适合谁\n\n- **适合**：想啃四大名著之外明清经典的古典文学爱好者；关心讽刺文学谱系、鲁迅源流的读者——鲁迅的讽刺观与这部书直接相关；正被升学、考编、「上岸」叙事裹挟的现代人：它是一面三百年前的镜子；写作者：想学白话对话写实与「不评价的讽刺」的人，这本书是最好的范本\n- **不适合**：期待强主线、连贯情节的读者——列传式结构天然散点，认人成本高；想看科举逆袭爽文的——书里中举者也没几个有好下场；明清白话读着吃力又不肯放慢的人——对话是全书精华，跳读损失最大\n\n## 读完能带走什么\n\n合上书带走两件事。一句话：「横了一个做官的念头在心里」——用它照一照自己此刻焦虑的来源。一个动作：下次围观任何「上岸/没上岸」的新闻，先想想范进——热闹的是围观者，疯的是当事人；压垮人的从来不是喜事或败事本身，是那根绷了三十四年的弦。\n\n## 避坑\n\n- 别把严监生当吝啬鬼段子讲。先读第五回再笑：他对人情挥金如土，对己才刻薄到抠灯草——这是全书最容易被一段戏文埋掉的人物。\n- 别把「幽榜」当结尾读。真本止于第五十五回「四大奇人」，第五十六回是后人伪作，读了不算吴敬梓的意思。\n- 别当古代官场现形记猎奇读。它的对手不是贪官，是制度与人心的合谋；只看热闹，会错过全部悲悯。\n- 别跳过对话。胡屠户、梅玖、匡超人的台词比叙述更好看——白话对话是这本书的第一成就，只读情节梗概等于白读。\n","dg_10":"# 《平凡的世界》精华导读\n\n> **范围声明**：本导读细读了以下章节：第一部第一章（开篇黑馍）、第四章、第六章、第十一章（少安与润叶）、第十八章（郝红梅事件与田晓霞出场）、第二十八章（偷水事件与金俊斌之死）、第二十九章（贺秀莲）、第五十四章（第一部结尾·责任制被制止）；第二部第一章（乔伯年）、第六章（责任制到来）、第十九章与第五十四、五十五章（开头段落）；第三部第一章（铜城煤矿）、第四章（下井第一课）、第九章（晓霞井口重逢）、第十七章（王世才之死）、第三十二章与第三十三章（晓霞之死）、第三十八章、第五十三章（结尾段落）、第五十四章（全书终章全文）；其余章节依据总目录做结构概览，未逐字细读，已在骨架中标明。所有摘录均出自上述实际读到的原文。\n\n---\n\n## 一句话定位\n\n一部八十二万字的三部曲：一九七五到一九八五年，黄土高原双水村的两兄弟——哥哥孙少安把根扎进土地，弟弟孙少平把心伸向远方——在贫穷与变革的夹缝里，把「平凡」活成了不平庸。读完这篇导读约八分钟，读完原著约需四十小时。\n\n## 这本书讲什么（结构骨架）\n\n1. 开篇名场面定调：一九七五年雨雪交加的县城高中，菜分甲乙丙三等、馍分「欧洲、亚洲、非洲」——孙少平永远最后来，拿走两个黑高粱面馍，躲着人刮盆底混了雨水的剩菜汤。「慌得如同偷窃一般」：全书的起点是贫穷，更是贫穷碾过的少年自尊。\n2. 结构是沙盘式的：双水村是整个中国的微缩。孙、田、金三姓在十年间的浮沉，与县、地、省三级干部的政策博弈（田福军、乔伯年）交织推进；第一部写穷（1975-1978），第二部写变（责任制与进城），第三部写分岔（煤矿与砖窑）。每部末章都停在下一次命运转折的前一刻。\n3. 孙少安线：十三岁以全县第三名的高小成绩辍学撑家，十八岁当生产队长。他先于时代一步在一队搞承包，被县革委会定性为「资本主义复辟倾向」制止——两年后政策自己来了。砖窑从起家、崩盘到东山再起，最后掏钱重建双水村小学：他的一生就是改革史的民间注脚。\n4. 孙少平线：黑馍少年→黄原揽工汉（背石头，脊背血肉模糊）→大牙湾煤矿工人。地位一路下沉，精神世界却始终靠书和报纸撑着。揽工结束告别东关大桥头时，他管那片人市叫「我的神圣的耶路撒冷」——把苦难之地敬为圣殿，是理解这个人物的钥匙。\n5. 爱情线是三堵时代的墙：少安与润叶败给城乡门第，润叶另嫁，少安娶了不要彩礼的山西姑娘贺秀莲；少平与省报记者田晓霞是跨越身份的精神之恋，定期在古塔山杜梨树下赴约——约定被洪水掐断；十年后金秀向少平表白，他拒绝的理由是「不能耽误她的前程」。\n6. 田晓霞：全书写得最亮的人物。抗洪一线她掏出记者证「像足球裁判亮黄牌一样」逼公安局副局长用刺刀逼退三千恋家的市民，半小时后那片街区成为汪洋——三千人幸免。随后电讯传来：本报记者田晓霞，在抗洪第一线为抢救群众的生命英勇牺牲。\n7. 井下线：师傅王世才为救护组员，钢梁从腹部穿背而过，死在掌子面上。少平从此照拂师母惠英与儿子明明。全书结尾，毁容出院的少平拒绝省城、拒绝金秀，回到大牙湾——「他远远地看见，头上包着红纱巾的惠英，胸前飘着红领巾的明明，以及脖项里响着铜铃铛的小狗，正向他飞奔而来」。\n8. 结尾是双重的反高潮：少安在捐资小学落成仪式上，看见刚立起来的秀莲「嘴里鲜血喷涌」——肺癌；少平在金秀宿舍摔碎镜子，独自面对脸上那道疤，然后买一副黑镜、一件风雨衣，把表彰和记过两份文件「揉成一团」揣进衣袋。路遥拒绝给奋斗者颁发圆满：生活继续，不收官。\n9. 田福军线是改革的官方版本：从被压制的县革委会副主任，到顶着「坚决制止」的上级指示在常委会上摆出全县口粮账，再到亲手推行责任制——改革不是文件自己落地的，是有人拿乌纱帽换的。而双水村的老支书田福堂，在责任制到来时「无法接受眼前的现实，但他也没有能力拒挡这个潮流」。\n10. 全书纲藏在第一部第十八章：少平被初恋郝红梅甩了之后完成的第一次人生自我教育——「普通并不等于庸俗。他也许一辈子就是个普通人，但他要做一个不平庸的人。」哥哥与弟弟，一个在土地上不平庸，一个在煤堆里不平庸：这就是书名「平凡的世界」的全部答案。\n\n## 核心知识（作者的精华）\n\n**先记住时间轴：全书与改革史严格咬合**：第一部（1975-1978）结尾，孙少安的责任制尝试被定性为「资本主义复辟倾向」制止；第二部（1979-1982）开头，中央文件下来，正是孙少安去年「要搞而没有搞成的事」在农村普遍实行——读到这个呼应才算读懂路遥的结构：个人的先手与时代的迟到的对表，是全书的引擎。三部各以一次转折收尾，人物命运永远停在半空。\n\n**「平凡」与「平庸」的分野，是全书的纲**：第一部第十八章，郝红梅转向顾养民、金波带人打了顾养民、顾养民挨打却不告不发——少平从这位「情敌」身上看到人格的分量，写下他人生第一次自我教育：普通不等于庸俗。此后全书所有人物都可以用这把尺子量：孙玉亭革命热情滚滚却把日子过烂，是庸；王世才一句话不多说、死在救人现场，是不平庸。\n\n**孙少安：先于时代半步的人**：他的一生是「半步」的代价史：承包早搞了两年，挨批判；砖窑是全公社第一个，火候一到就崩盘（雇工、扩建踩在政策模糊地带）；等一切都合法了，他已是先被磨过一轮的人。路遥对他的仁慈在于给他秀莲——一个说「就是他讨吃要饭，她也愿意跟他去」的妻子；路遥对他的残忍在于结尾：他终于站在自己捐建的教室前，秀莲倒下了。\n\n**孙少平：用读书守住下沉的人生**：从县城高中的黑馍，到黄原桥头的揽工汉，到大牙湾的煤黑——他的社会位置一路走低，但每天看报的习惯没断（在煤矿，区队的报纸常被拿去包猪头肉，他就站在矿部阅报栏前读）。揽工岁月结束时他告别东关：「我的忧伤和辛酸之地，我的幸运与幸福之邦，我的神圣的耶路撒冷」。他后来拒绝妹妹兰香和仲平安排的省城，理由清醒得近乎冷酷：「不同生活处境的人应该寻找各自的归宿。」\n\n**三段感情，三种「不可能」**：少安与润叶是童年最暖的暖流（她偷玉米面馍塞给他、蹲在土圪崂给他的破裤子缝补丁），被城乡鸿沟无声掐断——田福堂听说少安领回媳妇时「心里十分高兴」，因为「再不要担心他女儿和少安的关系了」，一句话写尽全部阻力的来源。少平与晓霞是精神对等之恋：矿工与省报记者，井口的黑手与六月阳光下的白裙。金秀的爱情则是少平的自我认知成熟后的拒绝——他不再需要用爱情证明自己配得上什么。\n\n**写苦难的克制：不喊疼，写细节**：王世才之死没有嚎啕：钢梁「从王世才的肚子里戳进去，一直从后背上穿出来」之后，路遥写的是矿工们一个接一个做人工呼吸接龙，以及一句「这染血的煤将变为熊熊炉火。难道我们还不能明白，为什么炉火总是那样鲜红」。晓霞之死同样不正面写：少平是在矿部阅报栏前，从报纸的「又讯」里读到死讯的——用新闻体谋杀爱情，比任何直接描写都狠。\n\n**改革是有具体面孔的**：第一部第五十四章，路遥把少安们连夜搞出的承包合同整份抄进小说——定土地、定产量、定工、奖赔，白纸黑字像件公文；同一章里田福军在县常委会上背出全县的账：一九五三年人均生产粮九百斤，去年降到六百斤，二十年间十六个年头社员平均口粮不足三百五十斤。宏大的政策史被压缩成一份村合同和一串挨饿的数字——这是全书最硬的写法。\n\n**每个配角都是完整的**：半脑壳田二在追悼会上捡纸花，嘟囔「世事要变了」——全书最准的谶语，两年后部长篇第二部的主题句；二队长的弟弟金俊斌为偷水送命，支部会给烈士定规格，孙玉亭激动地提议追认党员；田福堂为抗旱半夜豁坝引来决堤人命，最后自己成了被责任制甩下的人。路遥给每个配角都留了动机和体面，这是百万字长篇最见功力的地方。\n\n## 原文精华摘录\n\n**摘录 1**（第一部 第十八章）：\n> 他也许一辈子就是个普通人，但他要做一个不平庸的人。在许许多多平平常常的事情中，应该表现出不平常的看法和做法来。\n\n*点评：全书纲。这句写在郝红梅事件尘埃落定之后——少平从「情敌」顾养民挨打不报仇的克制里，完成了人生第一次自我教育。书名里的「平凡」由此有了对照物。*\n\n**摘录 2**（第一部 第十八章）：\n> 在最平常的事情中都可以显示出一个人人格的伟大来！\n\n*点评：上一句的落点。路遥把伟大从传奇里搬出来，安放在日常：能不能好好对待一件所有人都可能遇到的小事。这也是他写这本大书的笔法。*\n\n**摘录 3**（第一部 第五十四章）：\n> 说句反动话，如果让他单干种庄稼，他孙少安就不相信一家人连饭也吃不饱！\n\n*点评：一个农民在心里说「反动话」——「说句反动话」这个前置语本身就是时代。少安的全部勇气与全部恐惧都压缩在这五个字里。*\n\n**摘录 4**（第一部 第五十四章）：\n> 这也许是整个黄土高原农村的第一次自发性改革尝试——在短短的时间里就以失败而结束了！\n\n*点评：第一部的收束句。路遥自己跳出来说破：这场失败不是孙家的失败，是历史迟到两年。第二部开头政策落地时，读者会回头想起这句话。*\n\n**摘录 5**（第二部 第一章）：\n> 中间一点「白菜心」，周围全是「菜帮子」，这就是本省大自然的写照。\n\n*点评：新任省委书记乔伯年车窗外的省情速写，也是全书权力的出发点：他知道白菜心外面有多少菜帮子在挨饿。改革叙事由此从最顶层启动。*\n\n**摘录 6**（第二部 第六章）：\n> 他无法接受眼前的现实。但他也没有能力拒挡这个潮流。\n\n*点评：写给田福堂——合作化的功臣、偷水的莽汉、被责任制甩下的老支书。路遥对旧时代的人物没有羞辱，只有这两句准确的判词。*\n\n**摘录 7**（第二部 第五十四章）：\n> 别了，我的忧伤和辛酸之地，我的幸运与幸福之邦，我的神圣的耶路撒冷啊！你用严酷的爱的火焰，用无情而有力的锤砧，烧炼和锻打了我的体魄和灵魂。\n\n*点评：少平告别黄原东关大桥头的揽工地。把苦力市场称作圣城——这个比喻是全书少平线的题眼：他不逃离苦难，他在苦难里认领自己。*\n\n**摘录 8**（第三部 第四章）：\n> 这完全像远离人世间的另一个世界。当阿姆斯特朗第一脚踏上月球的时候，他感受也许莫过于此。\n\n*点评：少平第一次下井。罐笼坠向地层深处、阳光消失的瞬间，用登月作比——把煤矿写成另一个星球，为后面整部井下叙事定了调。*\n\n**摘录 9**（第三部 第十七章）：\n> 生活中真正的勇士向来默默无闻，喧哗不止的永远是自视高贵的一群。\n\n*点评：井下段落里的议论。不是鸡汤，是白描之后的总结：刚写完矿工们拖着疲惫的身子升井、有家室的钻回低矮的窝棚土窑。*\n\n**摘录 10**（第三部 第十七章）：\n> 那根钢梁无情地从王世才的肚子里戳进去，一直从后背上穿出来。……血渗进煤中；血成为黑色——这染血的煤将变为熊熊炉火。难道我们还不能明白，为什么炉火总是那样鲜红……\n\n*点评：王世才之死。全书最重的牺牲被处理成一次颜色转换：红的血、黑的煤、红的炉火。不喊一声疼，但比任何嚎啕都重。*\n\n**摘录 11**（第三部 第三十三章）：\n> 牺牲？我的晓霞……\n\n*点评：少平在矿部阅报栏前读到死讯的第一反应——四个字加一个省略号。随后他「沿着铁路向东面奔跑……一直奔跑到心力衰竭」。路遥把全书最大的悲痛压进最短的句子。*\n\n**摘录 12**（第三部 第五十三章）：\n> 哭，笑，都是因为欢乐。哭的人知道而笑的人并不知道，这欢乐是多少痛苦所换来的……\n\n*点评：少安在捐资小学落成仪式上的瞬间。下一秒秀莲口吐鲜血倒下——这句是路遥提前给出的预告：所有圆满都值得怀疑。*\n\n## 思考与辨析\n\n- **成立之处**：「平凡不平庸」的纲全篇立得住。时间线与政策节点严格咬合：第一部末少安的承包被制止，第二部开头文件自己来了——个人的先手与时代的迟到这组张力贯穿始终。三场重大死亡（金俊斌、王世才、晓霞）没有一场是煽情堆砌，全部用职业性细节完成：追悼会的悼词格式、矿工接龙式的人工呼吸、报纸上的「又讯」。结尾的双重反高潮（秀莲的病、少平的疤与拒绝）尤其诚实：路遥没有给任何奋斗者颁发圆满奖赏，生活只是继续——这比一切励志读法都高级。\n- **存疑之处**：女性角色的位置偏窄。细读所见，惠英与秀莲大多处于等待与扶持的位置；晓霞被写得近乎完美——记者、书记千金、精神伴侣三合一——她的死更像叙事需要（不掐断这层关系，少平线无法收束），而非命运必然。读者对她普遍的执念，一半是人物魅力，一半是作者的偏心。 第三部事件密度过高。矿难、洪水、殉情式的死亡、毁容接连而至，转折间隔明显短于前两部；单看第三十三章前后，悲剧像约好了排队。这未必是败笔，但读的时候能感觉到作者赶着收官。 苦难被审美化的风险。书里的苦难几乎总能兑换成精神成长——脊背的血肉换来「生活的力量和包容苦难而不屈服于命运的心脏」。作为文学成立，作为人生观要警惕：现实中的苦难不保证有这回报，别把它读成「感谢贫穷」。 篇幅负担。八十多万字中，第一部最见生活的密度，第二部改革线最锐，第三部情感线最重；若时间极有限而只读一部，选第一部会错过全书真正的题眼（第十八章的自我教育与第二部的政策落地）。\n\n## 适合谁读 / 不适合谁\n\n- **适合**：正在「小地方还是大城市」「扎根还是闯荡」之间摇摆的年轻人——孙家两兄弟是两种答案，不是对错；对 1975-1985 中国巨变只有课本印象、想摸到具体肌理的读者：一份村合同、一串口粮数字比通史更有手感；从小地方出来、在异乡吃过苦的人：揽工汉段落与井下段落会照见自己；研究当代文学与现实主义谱系的读者：这是理解「茅盾文学奖一代」绕不开的坐标\n- **不适合**：想要快节奏、强情节的读者——百万字的体量里，大半篇幅是日常与劳作的耐心白描；期待大团圆结局的读者——三场死亡、一场绝症、一张毁容的脸，路遥不负责治愈；对「苦难叙事」本能反感的读者——这本书会被读成说教，尽管它其实一直在克制\n\n## 读完能带走什么\n\n合上书带走两件事。一句话：「普通并不等于庸俗」——用它校准你此刻对「混得不好」的恐惧：怕的该是不平庸地活着，而不是平凡地活着。一个动作：想起这本书时，别只记得「苦难励志」——记得少平在阅报栏前读报、记得田福军背出的那串口粮数字：把宏大的日子过具体，就是不平庸的第一步。\n\n## 避坑\n\n- 别把它当成功学读。它不承诺奋斗必有回报：晓霞死了，秀莲病了，少平毁容后回到煤矿。书名里「平凡」二字不是谦辞，是结论。\n- 别跳过开篇的黑馍段落。全书所有动机——自尊、读书、出走、回不去——的种子都在第一部第一章那碗混着雨水的剩菜汤里。\n- 别只读第一部就停。第一部是「穷」，第二部才是「变」：责任制落地、少安翻身、少平进城揽工都在第二部；只读第一部等于只看了前半张地图。\n- 别用「励志金句」替代原文。这本书的力气在细节与克制里——追悼会、合同书、人工呼吸接龙、阅报栏——摘句集锦会把一部社会史读薄成鸡汤。\n"}};</script>
<script>
/* 静态站垫片：把阅读页的 /api/* 请求接到内嵌数据上，页面代码零改动 */
(function () {
  const D = window.__SY_STATIC__;
  const json = o => Promise.resolve(new Response(JSON.stringify(o), { status: 200, headers: { 'Content-Type': 'application/json' } }));
  const text = t => Promise.resolve(new Response(t, { status: 200, headers: { 'Content-Type': 'text/markdown; charset=utf-8' } }));
  const orig = window.fetch;
  window.fetch = function (url) {
    const u = String(url);
    let m;
    if (u === '/api/digests') return json({ digests: D.list });
    if ((m = u.match(/^\/api\/digests\/([^/]+)\/markdown$/))) return text(D.markdown[decodeURIComponent(m[1])] || '');
    if ((m = u.match(/^\/api\/digests\/([^/]+)$/))) {
      const d = D.details[decodeURIComponent(m[1])];
      return d ? json(d) : Promise.resolve(new Response('{"error":"not found"}', { status: 404 }));
    }
    return orig.apply(this, arguments);
  };
  /* 导出按钮：静态模式下点击直接下载 markdown */
  addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('btn-md');
    if (!btn) return;
    btn.onclick = () => {
      const m = (location.hash || '').match(/^#\/d\/(.+)$/);
      if (!m) return;
      const id = decodeURIComponent(m[1]);
      const md = D.markdown[id];
      if (!md) return;
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '精华导读-' + id + '.md';
      a.click();
      URL.revokeObjectURL(a.href);
      const t = document.getElementById('toast');
      if (t) { t.textContent = '已导出 Markdown'; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
    };
  });
})();
</script>
<script>
const $=s=>document.querySelector(s);
const app=$('#app');
const SPINES=['#2E6E65','#A6402C','#3B5A82','#8A5A2B','#5E4B7A','#2F6B6B','#7A6A3B','#8A3F55'];

let current=null;          // {digest,book,meta,id}
let sections=[];           // [{el}]
let secNo=0;               // 章节序号计数器
let tocBuilt=false;

function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2000)}
function spineOf(t){let h=0;for(const c of (t||''))h=(h*31+c.charCodeAt(0))>>>0;return SPINES[h%SPINES.length]}
const wn=n=>n>=10000?(n/10000).toFixed(1)+' 万':String(n);
const minutesOf=chars=>Math.max(3,Math.round((chars||0)/400));

/* ---------------- 偏好（字号/行距/主题） ---------------- */
const prefs={
  fs:+(localStorage.getItem('sy-fs')||16.5),
  lh:+(localStorage.getItem('sy-lh')||1.92),
  theme:localStorage.getItem('sy-theme')||'light',
};
function applyPrefs(){
  document.documentElement.style.setProperty('--fs',prefs.fs+'px');
  document.documentElement.style.setProperty('--lh',prefs.lh);
  document.documentElement.setAttribute('data-theme',prefs.theme);
  const m={light:'#FBFAF7',sepia:'#F6EFE1',dark:'#131311'}[prefs.theme];
  document.querySelector('meta[name=theme-color]').setAttribute('content',m);
  $('#fsVal').textContent=prefs.fs;
  $('#segLh').querySelectorAll('b').forEach(b=>b.classList.toggle('on',+b.dataset.lh===prefs.lh));
  $('#segTheme').querySelectorAll('b').forEach(b=>b.classList.toggle('on',b.dataset.theme===prefs.theme));
}
function savePrefs(){localStorage.setItem('sy-fs',prefs.fs);localStorage.setItem('sy-lh',prefs.lh);
  localStorage.setItem('sy-theme',prefs.theme);applyPrefs()}
$('#fsUp').onclick=()=>{prefs.fs=Math.min(22,prefs.fs+1);savePrefs()};
$('#fsDown').onclick=()=>{prefs.fs=Math.max(14,prefs.fs-1);savePrefs()};
$('#segLh').onclick=e=>{const b=e.target.closest('b');if(!b)return;prefs.lh=+b.dataset.lh;savePrefs()};
$('#segTheme').onclick=e=>{const b=e.target.closest('b');if(!b)return;prefs.theme=b.dataset.theme;savePrefs()};

/* ---------------- 抽屉 ---------------- */
function openSheet(which){
  closeSheets();
  $('#scrim').classList.add('on');
  $(which).classList.add('on');
  document.body.style.overflow='hidden';
}
function closeSheets(){
  $('#scrim').classList.remove('on');
  $('#sheetToc').classList.remove('on');
  document.body.style.overflow='';
}
$('#scrim').onclick=closeSheets;
$('#btn-toc').onclick=()=>{buildToc();openSheet('#sheetToc')};
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheets()});

/* ---------------- 路由 ---------------- */
function route(){
  const h=location.hash||'#/';
  const m=h.match(/^#\/d\/(.+)$/);
  closeSheets();
  if(m) showDigest(m[1]); else showShelf();
}
addEventListener('hashchange',route);

/* ---------------- 首页 ---------------- */
const cnNum=n=>{const d='零壹贰叁肆伍陆柒捌玖';
  if(n<=10)return n===10?'拾':d[n];
  if(n<20)return '拾'+d[n%10];
  if(n<100){const t=Math.floor(n/10),u=n%10;return d[t]+'拾'+(u?d[u]:'')}
  return String(n)};

async function showShelf(){
  document.title='简读 · 精华导读';
  current=null; sections=[];   // 清掉阅读页残留，防止滚动回调覆写顶栏
  $('#btn-back').style.visibility='hidden';
  $('#btn-toc').style.display='none';
  $('#chapName').innerHTML='<span class="brandmark">简读</span>';
  $('#pbar').style.width='0%';
  window.scrollTo(0,0);
  app.innerHTML=`<div class="shelf"><div class="skel-card">
      <div class="skel-line w60"></div><div class="skel-line w90"></div><div class="skel-line w40"></div>
    </div><div class="skel-card"><div class="skel-line w40"></div><div class="skel-line w90"></div></div></div>`;
  try{
    const r=await fetch('/api/digests');
    const {digests}=await r.json();
    if(!digests.length){
      app.innerHTML=`<div class="shelf">
        <div class="state">
          <div class="big">导读还没上架</div>
          <div class="sm">管理员在 /admin 上传书籍并发布导读后<br>会出现在这里</div>
        </div>
        <div class="shelf-foot">简读 · 把一本书读薄</div></div>`;
      return;
    }
    // 阅读进度（以位置为准）：1<p<99 视为在读；>=99 读完不再展示
    const progOf=bookId=>{
      const p=Math.round((+(localStorage.getItem('sy-prog-'+bookId)||0))*100);
      if(p<=1||p>=99) return null;
      return {p};
    };
    app.innerHTML=`<div class="shelf">
      <div class="sec-label">全部导读<span class="cnt">共 ${digests.length} 篇</span></div>
      ${digests.map((d,i)=>{
        const bp=progOf(d.id);
        return `
        <div class="book" style="animation-delay:${Math.min(i*70+140,700)}ms" onclick="location.hash='#/d/${d.id}'">
          <div class="no">${cnNum(i+1)}</div>
          <div class="body">
            <h4>${esc(d.title)}</h4>
            <p>${esc(d.oneLiner||'暂无一句话定位')}</p>
            <div class="meta">
              <span class="tag">${esc(d.tag||'精华导读')}</span><i></i>
              <span>${wn(d.totalChars||0)} 字</span><i></i>
              <span>${minutesOf(d.digestChars)} 分钟</span>
              ${bp?`<i></i><span class="read">已读 ${bp.p}%</span>`:''}
            </div>
            ${bp?`<div class="bprog"><i style="width:${bp.p}%"></i></div>`:''}
          </div>
        </div>`}).join('')}
      <div class="shelf-foot">简读 · 把一本书读薄</div>
    </div>`;
  }catch(e){
    app.innerHTML=`<div class="shelf"><div class="state">
      <div class="big">加载失败</div><div class="sm">请检查网络后重试</div></div></div>`;
  }
}

/* ---------------- 阅读页 ---------------- */
function sec(title,html,id){
  if(!html) return '';
  secNo+=1;
  return `<section class="sec" data-sec="${id}">
    <div class="sec-h"><div class="no">${String(secNo).padStart(2,'0')}</div><h2>${title}</h2></div>
    ${html}</section>`;
}

async function showDigest(id){
  $('#btn-toc').style.display='';
  $('#btn-back').style.visibility='';
  $('#chapName').textContent='加载中';
  sections=[]; secNo=0;
  app.innerHTML=`<div class="reader"><div class="r-head">
    <div class="skel-line w40"></div><div class="skel-line w90"></div><div class="skel-line w60"></div>
  </div></div>`;
  try{
    const r=await fetch('/api/digests/'+id);
    if(!r.ok){
      app.innerHTML=`<div class="state"><div class="big">导读不存在或未发布</div>
        <div class="sm"><a href="#/" style="color:var(--brand)">← 返回书架</a></div></div>`;
      return;
    }
    const {digest:d,book,meta}=await r.json();
    current={digest:d,book,meta,id};
    document.title=`${book.title} · 简读精华导读`;
    localStorage.setItem('sy-last',id);

    const ck=(d.core&&d.core.items)||[];
    const tlDr=(d.core&&d.core.tlDr)||'';
    const th=d.thoughts||{};
    const doubts=th.doubts||[];
    const notes=th.notes||[];
    const todo=`<div class="todo-note"><b>本段尚未生成。</b>当前是未接入模型的框架稿——在管理台配置模型，或导入 AI 稿后即可补全。</div>`;

    let body='';

    // 01 一句话定位
    if(d.oneLiner) body+=sec('一句话定位',`<div class="blk"><p>${esc(d.oneLiner)}</p></div>`,'定位');

    // 02 这本书讲什么
    if((d.skeleton||[]).length){
      body+=sec('这本书讲什么',
        `<div class="blk">${d.skeleton.map((s,i)=>`
          <div class="insight"><div class="dot">${String(i+1).padStart(2,'0')}</div>
          <div><div class="txt">${esc(s)}</div></div></div>`).join('')}</div>`,'讲什么');
    }

    // 03 核心知识
    body+=sec('核心知识',
      `<div class="blk">
        ${ck.length?ck.map((it,i)=>`
          <div class="insight"><div class="dot">${String(i+1).padStart(2,'0')}</div>
          <div>${it.lead?`<div class="lead">${esc(it.lead)}</div>`:''}
          ${it.body?`<div class="txt">${esc(it.body)}</div>`:''}</div></div>`).join(''):todo}
        ${tlDr?`<div class="tldr"><b>换句话说</b>${esc(tlDr)}</div>`:''}
      </div>`,'核心知识');

    // 04 原文摘录
    if((d.quotes||[]).length){
      body+=sec('原文摘录',
        d.quotes.map(q=>`
          <blockquote class="quote">
            <span class="mark">“</span>
            <div class="qt">${esc(q.text)}</div>
            <div class="qs"><span class="rule"></span>${esc(q.src||'原文')}</div>
            ${q.note?`<div class="qn">${esc(q.note)}</div>`:''}
          </blockquote>`).join(''),'摘录');
    }

    // 05 思考与辨析
    if(th.holds||doubts.length||th.howto||notes.length){
      body+=sec('思考与辨析',
        `<div class="blk"><div class="verdict">
          ${th.holds?`<div class="vd ok"><div class="lab"><i></i>成立</div><p>${esc(th.holds)}</p></div>`:''}
          ${doubts.length?`<div class="vd doubt"><div class="lab"><i></i>存疑</div>
            <ul>${doubts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
          ${th.howto?`<div class="vd how"><div class="lab"><i></i>怎么用</div><p>${esc(th.howto)}</p></div>`:''}
          ${notes.length?`<div class="vd"><p>${notes.map(esc).join('<br>')}</p></div>`:''}
        </div></div>`,'辨析');
    }

    // 06 适合谁
    if((d.fit||[]).length||(d.unfit||[]).length){
      body+=sec('适合谁',
        `<div class="blk"><div class="fitgrid">
          <div class="fitcol yes"><div class="h">适合</div>
            <ul>${(d.fit||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>—</li>'}</ul></div>
          <div class="fitcol no"><div class="h">不适合</div>
            <ul>${(d.unfit||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>—</li>'}</ul></div>
        </div></div>`,'适合谁');
    }

    // 07 带走什么
    if(d.takeaway){
      body+=sec('带走什么',
        `<div class="takeaway"><div class="h">TAKEAWAY</div><p>${esc(d.takeaway)}</p></div>`,'带走什么');
    }

    // 08 避坑
    if((d.pitfalls||[]).length){
      body+=sec('避坑',
        `<div class="blk"><ul class="pitfalls">${d.pitfalls.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`,'避坑');
    }

    app.innerHTML=`<article class="reader">
      <div class="r-head">
        <div class="kicker">${esc(d.tag||'精华导读')}</div>
        <h1>${esc(book.title)}</h1>
        <div class="sub"><span>${wn(book.totalChars||0)} 字</span><i></i>
          <span>${book.chaptersCount||'—'} 节</span><i></i><span>读完约 ${minutesOf(JSON.stringify(d).length)} 分钟</span></div>
        ${d.oneLiner?`<p class="oneliner">${esc(d.oneLiner)}</p>`:''}
        ${d.scope?`<p class="scope"><b>范围声明</b>${esc(d.scope)}</p>`:''}
      </div>
      ${body}
      <div class="fin">
        <button id="btn-fin">已读完 · 回到书架</button>
        <button id="btn-share" class="ghost">分享这篇导读</button>
      </div>
      <div class="r-end"><span>简读 · 精华导读 v${meta.version}</span><span id="pctEnd">0%</span></div>
    </article>`;

    $('#btn-fin').onclick=()=>{
      localStorage.setItem('sy-prog-'+id,'1');
      localStorage.removeItem('sy-pos-'+id);
      toast('已读完');
      setTimeout(()=>{location.hash='#/'},650);
    };

    $('#btn-share').onclick=async()=>{
      const u=location.origin+location.pathname.replace(/index\.html$/,'')+'d/'+id+'/';
      const t=`《${current.book.title}》精华导读 · 简读`;
      const x=current.digest.oneLiner||'把一本书读薄，通勤 8 分钟读懂一本好书';
      if(navigator.share){
        try{await navigator.share({title:t,text:x,url:u});return}
        catch(e){if(e&&e.name==='AbortError')return}
      }
      const clip=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t+'\n'+x+'\n'+u):null;
      if(clip) clip.then(()=>toast('分享文案已复制，去粘贴给朋友'),()=>toast('复制失败，请手动复制'));
      else toast('当前浏览器不支持分享');
    };

    sections=[...app.querySelectorAll('[data-sec]')];

    // 阅读位置恢复
    const pos=+(localStorage.getItem('sy-pos-'+id)||0);
    if(pos>200){requestAnimationFrame(()=>window.scrollTo(0,pos));toast('已恢复上次阅读位置')}
    else window.scrollTo(0,0);
    updateScroll(true);
  }catch(e){
    app.innerHTML=`<div class="state"><div class="big">加载失败</div>
      <div class="sm">请检查网络后重试</div></div>`;
  }
}

/* ---------------- 滚动：进度 / 章节名 / 位置记忆 ---------------- */
function updateScroll(force){
  const h=document.documentElement;
  const max=h.scrollHeight-h.clientHeight;
  const p=max>0?Math.min(1,h.scrollTop/max):0;
  $('#pbar').style.width=(p*100).toFixed(1)+'%';
  const pe=$('#pctEnd'); if(pe) pe.textContent=Math.round(p*100)+'%';

  if(!current || !sections.length) return;
  const y=h.scrollTop+80;
  let idx=0;
  sections.forEach((s,i)=>{ if(s.offsetTop<=y) idx=i; });
  const name=sections[idx].querySelector('h2').textContent;
  $('#chapName').textContent=`${String(idx+1).padStart(2,'0')} · ${name}`;
  $('#tocList').querySelectorAll('li').forEach((li,i)=>li.classList.toggle('on',i===idx));

  if(!force){
    localStorage.setItem('sy-pos-'+current.id,Math.round(h.scrollTop));
    localStorage.setItem('sy-prog-'+current.id,p.toFixed(3));
    localStorage.setItem('sy-sec-'+current.id,String(idx));
    localStorage.setItem('sy-sect-'+current.id,String(sections.length));
    localStorage.setItem('sy-secname-'+current.id,name);
  }
}
let ticking=false;
addEventListener('scroll',()=>{
  if(ticking)return;
  ticking=true;
  requestAnimationFrame(()=>{updateScroll();ticking=false});
},{passive:true});

/* ---------------- 目录 ---------------- */
function buildToc(){
  if(!current) return;
  const pct=Math.round((+(localStorage.getItem('sy-prog-'+current.id)||0))*100);
  $('#tocHint').textContent=`共 ${sections.length} 段 · 已读 ${pct}%`;
  $('#tocList').innerHTML=sections.map((s,i)=>`
    <li data-i="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span>
    <span class="t">${esc(s.querySelector('h2').textContent)}</span>
    <span class="pg">${i===sections.length-1?'结尾':''}</span></li>`).join('');
  $('#tocList').querySelectorAll('li').forEach(li=>{
    li.onclick=()=>{
      const s=sections[+li.dataset.i];
      closeSheets();
      setTimeout(()=>window.scrollTo({top:s.offsetTop-56,behavior:'smooth'}),120);
    };
  });
  updateScroll(true);   // 立即同步当前段高亮
}

/* ---------------- 顶部操作 ---------------- */
$('#btn-back').onclick=()=>location.hash='#/';

function doExport(btn){
  if(!current){toast('请先打开一篇导读');return}
  if(btn.dataset.mode==='copy'){
    fetch('/api/digests/'+current.id+'/markdown').then(r=>r.text()).then(t=>{
      navigator.clipboard?.writeText(t).then(()=>toast('Markdown 已复制'),()=>toast('复制失败，请用「导出文件」'));
    });
    return;
  }
  location.href='/api/digests/'+current.id+'/markdown';
  toast('正在导出 Markdown');
}
$('#btn-md').dataset.mode='copy';
$('#btn-md').onclick=e=>doExport(e.currentTarget);
$('#btn-dl').onclick=e=>doExport(e.currentTarget);

/* 初始化 */
applyPrefs();
route();
</script>
</body>
</html>
